</script><script>window.PAPER_STUDY={"schema": "paper.study.v3", "version": "2026-09-29.5", "framing": "以下框架为基于已核读资料的教学组织，不替代原文目录，也不增加原文没有开展的分析。点按术语解释，详细方法按需展开。", "journey": {"title": "把农业系统研究读成一条完整的论证链", "question": "在土地、水、劳动和资金有限，而且不同人重视不同结果的条件下，怎样提出有依据、可实施的农业系统改进方案？", "narrative": ["我们先不从软件和缩写开始。研究的起点是一个现实系统：谁经营哪些地块，种什么，投入和产出是多少，受到什么约束。只有把这个系统及其数据边界说清楚，才有资格比较好坏。因此，调查、指标和类型划分先回答‘现在是什么样’，而不是一上来就计算最优解。", "下一步有两条互补路线。梁政渊从现实农场寻找可学习的优秀案例，再用农学规则生成尚未实施的轮作，最后把地块内时序与全农场资源约束连接起来。程嘉莉先研究人们怎样感知农业景观，再识别他们优先考虑什么，最后讨论如何把这些偏好与景观设计相连。徐展的工作提醒我们：不同农场的资源和经营背景不同，可行的改进方案也不应只有一种。", "因此，每篇论文都应读成‘问题为什么成立—证据从哪里来—为什么需要这一步方法—它产生什么结果—结果能支持到哪里’。Pareto、PCA、Q方法或FarmDESIGN只是其中某个环节的工具，不是需要孤立背诵的知识点。下方沿这条链进入论文；每篇先展示整体框架，再展开原有方法细节。"], "stages": [{"title": "01 认识现实系统", "question": "比较对象和资源边界是什么？", "input": "村庄、农户、地块与活动记录", "output": "可连接、可比较的数据结构和农场类型", "papers": ["xu-data-2024", "xu-2024"], "next": "对象可比以后，才能问哪些现实系统表现更好。"}, {"title": "02 找到现实改进线索", "question": "谁已经实现了较好的多目标折中？", "input": "现实系统的多指标绩效", "output": "非支配案例、优势类型与待解释的管理差异", "papers": ["liang-2022"], "next": "现实中的优秀案例是起点，但并不穷尽未来可能的生产方式。"}, {"title": "03 生成未来可行选择", "question": "农学规则允许哪些新轮作？", "input": "作物活动、日历、轮作规则和绩效参数", "output": "可行候选集合及可解释的折中类型", "papers": ["liang-2023"], "next": "一条轮作在一个地块上可行，还不保证整个农场同一时期有足够资源。"}, {"title": "04 连接全农场与时空约束", "question": "地块、时间和种养资源流怎样共同决定可行性？", "input": "活动组合、平衡关系、地块与时期资源上限", "output": "在明确约束和假设内的农场设计选择", "papers": ["farmdesign-2012", "farmsteps-2026", "ditzler-2019", "qu-2025"], "next": "模型给出可达到的结果，还没有回答谁更愿意接受哪一种。"}, {"title": "05 理解人的需求并设计景观", "question": "人们看见什么、重视什么；空间配置又能改变什么？", "input": "感知调查、相对偏好与空间指标", "output": "不同观点及其对应的景观方案讨论", "papers": ["cheng-2023", "cheng-2025", "landscape-2018", "cheng-thesis"], "next": "方案还需面对风险、遗漏过程和实际实施，不能把模型结果直接写成已发生的改善。"}, {"title": "06 检查证据与迁移边界", "question": "方案在不同情景和现实条件下还可靠吗？", "input": "模型假设、参数范围、利益相关者和验证证据", "output": "有边界的结论、改进需求和下一步研究问题", "papers": ["breure-2024", "toorop-2023", "hainan-map"], "next": "回到数据和问题定义，形成迭代，而不是不断叠加新工具。"}]}, "frameworks": {"liang-2022": {"question": "在同一类小麦—玉米双季系统中，哪些现实案例能在七项指标间取得较好的折中，值得进一步研究？", "object": "344个已观测的生产系统案例；不是344个随机试验处理。", "result": "由56个第一前沿案例进一步识别优势群组，其中9个案例组成作者选择的典型优秀系统群组。", "narrative": "这篇论文没有先规定一套‘最佳技术’，也没有让模型创造新农场。它先承认同一种种植制度内部存在很大差异：某个农场利润高，可能同时耗水多；某个农场省工，可能能量产出也低。作者因此需要一套方法，从多个维度同时寻找现实中的改进线索。研究最关键的连接是：指标让案例可比较，Pareto保留不同优势，聚类解释优势类型，理想点距离帮助挑选较均衡的群组。最后对照管理和背景差异，讨论这些案例能否成为可学习的参照。", "prior": "先能区分指标、改善方向和分析单位即可，不需要先学会农业模型软件。", "phases": [{"title": "把‘可持续’变成可以比较的证据", "bridge": "第一步不是排名，而是把每个案例表达成同口径的指标组合。研究选择毛利、能量、劳动、水、氮、温室气体和农药等维度。每列的方向、单位和估算边界决定后续比较究竟比较什么。若把氮损失估计写成淋溶实测，算法再正确也无法挽救解释。", "sections": [0, 1], "output": "一个有单位、方向和来源的案例×指标矩阵。"}, {"title": "先保留不同优势，再判断哪些组合值得学习", "bridge": "Pareto排序回答‘有没有另一个案例全面不差、且至少一项更好’，但第一前沿上仍可能保留靠单项极端优势胜出的案例。因此作者继续聚类，把优势结构分开，再用MIDIP和HDIP描述整体距离与维度间均衡。两种距离必须一起解释，均匀地差也可以得到很低的HDIP。", "sections": [2, 3], "output": "非支配案例、不同绩效群组及被选中的典型群组。"}, {"title": "把统计筛选结果转成有边界的管理启发", "bridge": "有了优秀群组，才回头比较其管理措施和经营背景。这里得到的是现实样本中的关联与可学习线索，不是某一种技术的独立因果效应。最后再检查图表、原文数值疑点和数据获取条件，决定哪些步骤可以立即学习，哪些需要作者材料才能复现。", "sections": [4, 5, 6, 7], "output": "关于改进潜力的证据与限制，而非对所有农户通用的处方。"}], "next": "下一篇梁2023将问题从‘现实中谁较好’推进到‘哪些尚未实施的轮作值得考虑’。", "sources": ["liang-2022"], "walkthrough": {"title": "把整篇研究连起来读", "paragraphs": ["设想你拿到的是一张农户调查表，而不是一个能自动给出最优答案的软件。第一件事是确认每行都是同一种小麦—玉米生产系统，并把产量、投入和环境估计换算到同一年、同一面积。若一列用总量、另一列用每公顷，后面的比较可能只是在比较规模。", "统一口径以后，先别给七个指标凑一个综合分。Pareto让你保留不同优势的案例：收入更高但用水也更多的案例，可能与省水案例同时留下。此时你得到的是“值得继续看”的候选集，而不是最终推荐。", "接着问：这些候选以什么方式表现好？聚类把相似的优势结构组织成群组。再看群组中心离各指标理想值的整体距离，以及差距是否很不均衡。前一步减少明显落后的对象，这一步解释剩下对象的差异，所以不是重复筛选。", "用一个自编两指标例子贯穿后半程：两个标准化差距为0.3与0.4，MIDIP为0.5；而差距0.8与0.8虽然完全均衡，却整体很远。由此理解为什么HDIP不能单独选冠军。论文实际使用七项指标，示例不替代作者数据。", "最后才回到管理实践：优秀群组与其他案例哪里不同？这些差异是可学习线索，仍可能受资源、土壤或选择过程影响。你的阅读笔记应把“研究筛出哪个群组”与“某种做法导致优势”分开写；后者需要额外证据。"], "scope": "基于本课已核读证据的教学解释；示例为自编，不是论文数据。"}, "readingCheck": {"start": "先用自己的话回答：在同一类小麦—玉米双季系统中，哪些现实案例能在七项指标间取得较好的折中，值得进一步研究？", "finish": "回到原文证据：由56个第一前沿案例进一步识别优势群组，其中9个案例组成作者选择的典型优秀系统群组。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "liang-2023": {"question": "能否系统生成多样化轮作，并从大量相互取舍的方案中找出可解释、可讨论的选择？", "object": "由作物节点和农学规则生成的1—4年轮作，不是3011个实测农场。", "result": "3011个候选轮作→1298个非支配方案→125个经进一步规则筛选的方案→8类绩效组合。", "narrative": "现实案例告诉我们目前有人怎样做，却不保证所有有价值的组合已经有人尝试。这篇论文因此先扩展选择空间：用ROTAT表达哪些作物在什么时间、以什么顺序可以组合，再用统一指标评价。由于11个目标下非支配方案过多，作者另设目标子集意义上的Pareto efficiency筛选，最后用降维和聚类把庞大的结果组织成可讨论的轮作类型。整篇贡献是一个从生成到解释的流程，而不是发布一条唯一最佳轮作。", "prior": "先掌握梁2022中非支配的含义；再问‘待比较的方案从哪里来’。", "phases": [{"title": "用农学规则界定未来的选择空间", "bridge": "候选方案并非任意排列作物。作物日历、顺序、返回间隔和频次等规则先决定哪些组合能够被考虑，产量与投入参数再决定怎样评价它们。这里的时间与顺序表达，不应被误解成逐日作物生理模拟。", "sections": [0, 1, 2], "output": "带有农学可行性和11列绩效的轮作候选库。"}, {"title": "从巨大前沿中保留更有讨论价值的折中", "bridge": "1298个非支配点说明没有明显被全面压过，不代表它们都均衡。进一步得分要求一个方案在所有同大小的目标子集中都保持非支配；‘所有’是方法的关键。阈值取自参照轮作，也不表示保留方案全部指标都超过参照。", "sections": [3], "output": "125个满足作者进一步筛选规则的方案。"}, {"title": "把方案空间转成可解释的类型", "bridge": "PCA和聚类不是再宣布一次最优，而是帮助说明这些方案怎样不同、各类依赖哪些作物与取舍。最终需要回到具体序列及参数假设，判断某类方案适合什么情境，并承认价格风险和前茬效应等表达的边界。", "sections": [4, 5, 6], "output": "8类轮作及其可持续性取舍，以及可迁移与不可直接复制的条件。"}], "next": "FarmSTEPS再把单条轮作扩展为多个地块、多个时期的农场计划。", "sources": ["liang-2023"], "walkthrough": {"title": "把整篇研究连起来读", "paragraphs": ["接着上一课往前想一步：现实里没有出现的生产组合，不等于它不值得研究。本篇先扩展未来选择空间，因此第一份重要材料不是最终排名，而是作物活动、日历和组合规则。规则允许什么，决定模型有机会发现什么。", "每条候选序列生成后，作者用统一的指标口径评价。这里要先停下来对照2022年的论文：农药频次与有效成分质量不是同一列，营养供给与农户实际消费也不是同一个问题。读懂评价口径，才有资格解释筛选结果。", "多个目标使大量候选互不支配，所以“在前沿”还不能把结果整理成便于讨论的一小组方案。作者的进一步得分检查不同目标子集，关键是某一大小下的所有子集，而不是只挑对自己有利的一个子集。", "自编三目标演示：固定为两目标时，必须分别检查AB、AC、BC。只在前两组保持非支配，不能通过所有二目标组合的检查。这个小例子帮助你理解量词“所有”，不要把它误读成优于参照的指标数量。", "筛选后才用降维与聚类组织类型。此处目标不是再次证明最优，而是让读者解释哪些轮作依靠哪种作物组合，获得何种收益又承担何种代价。最终交付应是一组有条件的选择，不是一条普遍最佳的轮作。"], "scope": "基于本课已核读证据的教学解释；示例为自编，不是论文数据。"}, "readingCheck": {"start": "先用自己的话回答：能否系统生成多样化轮作，并从大量相互取舍的方案中找出可解释、可讨论的选择？", "finish": "回到原文证据：3011个候选轮作→1298个非支配方案→125个经进一步规则筛选的方案→8类绩效组合。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "farmsteps-2026": {"question": "怎样同时满足地块内轮作规则与同一时期全农场资源限制，探索多样化种植计划？", "object": "农场配置、土地单元、时间轴、作物序列、指标和约束六个模块。", "result": "案例枚举213679个可行计划，再筛出128个Pareto方案；数量属于该案例的既定空间。", "narrative": "这篇将轮作设计推进到真正的农场计划。一个地块上的作物序列可以完全符合农艺规则，但多个地块一起进入收获期时，劳动力仍可能不足。因此研究必须同时表达‘同一块地前后能怎样安排’和‘同一时期整个农场承担得起什么’。先理解这两个方向的可行性，再理解枚举和Pareto筛选，才不会把多时期规划、动态过程模拟和进化优化混为一谈。", "phases": [{"title": "用模块表达地块与时间", "bridge": "先界定可调整的活动、时间粒度、土地单元和输入参数。六个模块共同描述农场，但不同模块并不自动具备生理动态反馈。", "sections": [0, 1], "output": "可以计算与核查的地块—时间—活动结构。"}, {"title": "生成可行计划并比较多目标表现", "bridge": "局部序列生成后还要组合、核对横向资源，再比较绩效。案例采用枚举，而不是FarmDESIGN式进化搜索。即使枚举完整，也只对已经定义的离散空间作完整声明。", "sections": [2, 3], "output": "满足约束的候选及其中的非支配计划。"}, {"title": "确定软件学习与海南迁移的接口", "bridge": "先把输入表、规则和资源账写清楚，再学习软件操作。扩展到牲畜和水产需要独立的资源流与生产周期，并非简单追加作物名称。", "sections": [4, 5], "output": "一个可实现的小规模时空规划练习及明确扩展边界。"}], "next": "对照FarmDESIGN理解资源平衡，再决定你的问题需要哪些模块。", "sources": ["farmsteps-2026"], "walkthrough": {"title": "把整篇研究连起来读", "paragraphs": ["先把问题放到一张“地块×时间”的表上：每行是一块地，每列是规划时期，每个格子安排相应活动。只把每块地的轮作单独选好，仍可能造成所有地块同一时间争用劳动或其他资源。", "因此要分别沿两个方向读约束。同一行向后看，是同一地块的作物序列限制；同一列往下合计，是同一时期全农场的共同资源限制。只有两个方向都满足，才能称为当前模型边界内的可行计划。", "自编例子：地块甲和乙的某月活动各需6人日，而农场总共只有8人日。两块地单独看都能做，一起安排却需要12人日。这时不能用高利润弥补劳动超限，应该先改变活动或时间安排。", "可行性检查后，再计算计划在多个指标上的表现，进行非支配筛选。模型案例中的候选数量由具体地块、活动、时间和限制产生，不是软件在任何地区都会输出的固定数字。", "最后把保留计划与基准方案对照，并返回具体格子检查改变了什么。时间维度上的计划安排不等于逐日生理生长模拟，空间明确也不能自动说明已经计算所有空间生态过程。迁移到别处需要重建本地活动和约束。"], "scope": "基于本课已核读证据的教学解释；示例为自编，不是论文数据。"}, "readingCheck": {"start": "先用自己的话回答：怎样同时满足地块内轮作规则与同一时期全农场资源限制，探索多样化种植计划？", "finish": "回到原文证据：案例枚举213679个可行计划，再筛出128个Pareto方案；数量属于该案例的既定空间。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "cheng-2023": {"question": "农业参与者怎样感知生态系统服务及负服务，这些感知在什么村庄背景下有所不同？", "object": "2020年267位参与者的调查；RDA使用35个村庄均值及村庄属性。", "result": "识别感知结构与关联背景，而不是提供2015—2020生态服务的连续实测趋势。", "narrative": "在设计更好的农业景观之前，研究需要理解当地人认为哪些问题存在。但‘认为水质变差’与‘测得水质变差’是两种证据。作者先把感知及回忆变化收集成有编码规则的调查数据，再比较群体和服务类型，并在村庄尺度探讨与环境、社会经济属性的关联。整篇的价值是让人的认知进入系统研究，同时保留感知不能替代监测的边界。", "phases": [{"title": "把感知问题转成可信的调查记录", "bridge": "先分清受访者是谁、回答对应哪个时间、0与不知道怎样编码。村庄与个人是不同层级，调查问题和变量编码直接决定后续能解释什么。", "sections": [0, 1], "output": "有明确时间、单位和缺失规则的感知数据。"}, {"title": "在正确层级解释多变量差异", "bridge": "个人回答聚合到35个村庄，才与村庄属性进行RDA。排序图用于表达该模型下的关联，不把箭头方向当成因果方向，也不把未解释变异全部归为农户知识不足。", "sections": [2, 3], "output": "感知差异与村庄背景的多变量关联。"}, {"title": "限定结论并设计下一步调查", "bridge": "低报负服务不证明负服务不存在；回忆变化也不是五年监测。这些发现帮助确定后续实测、试访与沟通需求，并引出另一类问题：人们知道和看见的事，与他们优先选择的事是否一致？", "sections": [4, 5], "output": "感知研究的结论边界及转向偏好研究的理由。"}], "next": "程2025不再主要问‘你认为现在怎样’，而是问‘不同服务之间你更看重什么’。", "sources": ["cheng-2023"], "walkthrough": {"title": "把整篇研究连起来读", "paragraphs": ["先问研究要观察的究竟是什么：本篇关心人们怎样感知生态系统服务及不利影响，而不是把所有服务都用仪器测一遍。因此问卷措辞、回答编码和受访者经验，与后面的统计方法同样重要。", "把问题、回答、聚合和分析单位接起来读。如果先获得个人回答，再形成村庄层面的平均感知，后面的统计比较就应按那个聚合层级理解；不能继续把所有个人记录当成独立分析对象。", "自编例子：一个人选“不知道”，另一个人选“很少”，两者不应自动使用同一个最低分。前者可能缺少认识，后者表达了低水平判断。把二者混在一起会改变平均感知的含义。", "多变量分析接着寻找感知差异与解释变量之间的关系。读图时先核对轴、变量编码与聚合尺度，再描述关联；不能把箭头关系直接写成某种管理造成服务变化。", "读完应形成两套并列笔记：人们报告了什么，以及这些报告能证明到哪里。没有报告某种负面影响并不证明该影响不存在，这恰恰可能是感知研究值得进一步讨论的地方。"], "scope": "基于本课已核读证据的教学解释；示例为自编，不是论文数据。"}, "readingCheck": {"start": "先用自己的话回答：农业参与者怎样感知生态系统服务及负服务，这些感知在什么村庄背景下有所不同？", "finish": "回到原文证据：识别感知结构与关联背景，而不是提供2015—2020生态服务的连续实测趋势。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "cheng-2025": {"question": "不同利益相关者如何排列生态系统服务的相对优先级，可以识别出哪些共同观点？", "object": "327份20条陈述的Q-sort；五档位置数为2—4—8—4—2。", "result": "总体分析得到3种主要观点；7个群体分别分析共得到18种观点，不能当作18类人口比例。", "narrative": "说每项服务都重要，仍不足以帮助选择一个受资源约束的景观方案。Q方法要求人们将同一组陈述放进有限的等级位置，表达相对取舍，并结合排序理由解释共同观点。统计的对象是人的整套排序模式，而不是给20项服务直接计算一组通用权重。只有把陈述设计、参与者立场、因子提取和观点解释连起来，才读懂了整篇研究。", "phases": [{"title": "先让相对取舍成为可观察的回答", "bridge": "研究设计首先决定谁参与、表达个人还是机构立场、排序哪些服务。强制网格让相对优先级可见，但低分不等于绝对无价值。陈述覆盖不足也无法靠后续因子分析自动弥补。", "sections": [0, 1], "output": "同一组陈述上的完整个人或机构排序。"}, {"title": "由排序相似性识别共同观点", "bridge": "PCA与varimax生成可解释的因子，载荷描述一份排序与因子的关系；典型排序则表达该观点如何排列陈述。总体分析与分群分析解决的问题不同，必须保留未归组者并解释因子数选择。", "sections": [2, 3, 4], "output": "有归属依据、典型排序和访谈解释的观点模式。"}, {"title": "把偏好研究接到设计，而不跳过接口", "bridge": "本篇没有完成景观优化，更没有证明观点能直接预测采纳。连接LandscapeIMAGES时，需要另行决定偏好怎样影响目标、约束或方案选择，并检查不同映射方式的影响。", "sections": [5, 6], "output": "供景观设计讨论使用的偏好证据，而非现成优化权重。"}], "next": "在博士论文景观设计部分追踪偏好到模型的实际映射；全文未核对处保持待确认。", "sources": ["cheng-2025"], "walkthrough": {"title": "把整篇研究连起来读", "paragraphs": ["不要先从因子分析公式进入。本篇先给参与者同一组陈述，请他们在有限位置上排出相对优先顺序；研究需要比较的对象，是每个人整份排序，而不是某项服务的一个孤立分数。", "完整链条是：为什么选这些参与者和陈述，怎样完成排序，怎样比较排序之间的相似性，最后怎样结合排序结果与表达理由解释共同观点。漏掉前面的陈述覆盖，后面的统计无法自动补回遗漏的立场。", "自编例子：两人都认为粮食、水环境和景观重要，但只能给一项最高位置。甲选粮食，乙选水环境，这种差异表达相对取舍，不表示另两项毫无价值。", "读结果时分开两个对象：因子载荷说明一个人的整份排序与某观点的关联，因子典型排序说明该共同观点倾向把哪些陈述放高或放低。二者都不应被直接当成多目标优化里的权重。", "最后讨论共同观点对方案协商有什么帮助，同时检查样本选择。为覆盖观点而选择的参与者，不自动支持推断全体人口中各种观点所占的比例。理解观点类型与估计人群比例是不同研究任务。"], "scope": "基于本课已核读证据的教学解释；示例为自编，不是论文数据。"}, "readingCheck": {"start": "先用自己的话回答：不同利益相关者如何排列生态系统服务的相对优先级，可以识别出哪些共同观点？", "finish": "回到原文证据：总体分析得到3种主要观点；7个群体分别分析共得到18种观点，不能当作18类人口比例。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "xu-2024": {"question": "小农与经营型农场的可持续性差异，是否只是规模不同，还与作物配置、复种和计量分母有关？", "object": "486个小农场与19个经营型农场，一年作物生产记录。", "result": "不同作物结构、复种与尺度下的绩效差异；不是规模扩大带来改善的因果证明。", "narrative": "这篇的重要性在于提醒我们不要急于把‘农场变大’等同于‘系统更可持续’。作者先比较生产结构，再以地块和农场尺度计算资源、环境与经济指标，进一步用复种指数帮助分辨年度投入变化与种植强度变化。理解结论必须沿着‘经营结构—核算分母—分布比较—解释边界’走，而不是只看哪组均值更高。", "phases": [{"title": "界定比较对象与核算口径", "bridge": "先明确有效样本、时间边界及各指标的成本和养分定义。单位面积均值与全农场总量不同，氮盈余也不能改称氮淋溶。", "sections": [0, 1], "output": "可解释的地块与农场绩效记录。"}, {"title": "分辨规模、作物结构与复种的作用", "bridge": "少种一季会降低年度资源投入，却未必表示每季管理效率更高。作者用MCI换算和分布比较补充年度结果，并采用面积匹配方式比较丰富度。它们改善解释，但不消除所有混杂。", "sections": [2, 3, 4], "output": "不同尺度和种植强度下的绩效对照。"}, {"title": "由差异走向分类型设计", "bridge": "既然资源与生产背景不同，下一步优化就需要不同的可行域和代表案例。本篇本身没有进行FarmDESIGN优化，不能将博士论文中的后续工作倒写进来。", "sections": [5], "output": "分类、采样和建模所需的边界意识。"}], "next": "接徐展博士论文的类型化改进路线，再返回全农场模型。", "sources": ["xu-2024"], "walkthrough": {"title": "把整篇研究连起来读", "paragraphs": ["先关心农场之间为什么不同，再看怎样比较表现。不同经营类型可能在土地、活动、投入强度和复种安排上不同；不先澄清这些条件，综合比较很容易把经营方式与规模效应混在一起。", "阅读指标表时，把每公顷、每年和每轮作物的口径写在数值旁。复种次数高的系统，在同一年可能生产和投入都更多，因此年度比较与每轮平均比较回答不同问题。", "自编例子：1ha土地一年种两季，总播种面积为2ha，复种指数可写成2或200%。比较时必须统一表达。把年度指标除以复种指数只改变了部分口径，不能自动消除土壤、灌溉和管理差异。", "接着看作者怎样处理多维表现和类型差异，再回到具体变量解释。类型不是软件自动发现的天然标签，而是基于变量和目的构造的分析工具。", "最终把值得迁移的方法与仍需当地数据支持的结论分开。类型化可以帮助安排抽样和模型代表农场，但不能凭一张类型图就替每个农户作出相同决策。"], "scope": "基于本课已核读证据的教学解释；示例为自编，不是论文数据。"}, "readingCheck": {"start": "先用自己的话回答：小农与经营型农场的可持续性差异，是否只是规模不同，还与作物配置、复种和计量分母有关？", "finish": "回到原文证据：不同作物结构、复种与尺度下的绩效差异；不是规模扩大带来改善的因果证明。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "xu-data-2024": {"question": "如何把一套调查组织成可以连接村庄、家庭和作物活动，并支撑多项研究的数据？", "object": "342条村庄总表、308个分类样本村、35个抽样村、525户访问、505份有效家庭记录及1352条作物记录，口径分别不同。", "result": "可追溯的数据层级、抽样设计与数据字典。", "narrative": "这不是为别的论文补一个下载链接，而是解释证据如何产生。村庄分类帮助覆盖异质性，分层抽样决定访问哪些家庭，家庭与作物表则通过主键连接。只有保留这些关系，后续比较、感知分析和系统建模才不会重复计算或错误外推。", "phases": [{"title": "从总体异质性到样本", "bridge": "先读清每一个样本数属于哪个层级，再理解分类和抽样为什么这样衔接。", "sections": [0, 1], "output": "有总体和层次依据的样本。"}, {"title": "从记录到可复用的数据关系", "bridge": "时间、面积分母和一对多连接关系是这套数据的骨架，不能靠Excel行号或姓名替代。", "sections": [2, 3], "output": "能够正确聚合和连接的表结构。"}, {"title": "复用之前检查边界", "bridge": "开放下载不代表无需检查许可、匿名性、采样权重和适用地区。海南的生产周期需要重新定义字段。", "sections": [4], "output": "可靠的数据复用计划。"}], "next": "再看这些数据怎样分别进入梁、程、徐的分析。", "sources": ["xu-data-2024"], "readingCheck": {"start": "先用自己的话回答：如何把一套调查组织成可以连接村庄、家庭和作物活动，并支撑多项研究的数据？", "finish": "回到原文证据：可追溯的数据层级、抽样设计与数据字典。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "farmdesign-2012": {"question": "怎样把农场内部相互联系的活动和资源流表达成可计算的多目标设计问题？", "object": "静态年度、稳态假设下的全农场生物经济模型。", "result": "约束与参数设定内的备选配置和目标取舍，不是自动确定的现实最优经营方案。", "narrative": "读这篇先画农场边界：哪些流来自外部，哪些发生在作物、牲畜、饲料、粪肥和土壤之间。然后明确哪些量是输入、哪些可以调整、哪些必须守恒。优化算法最后才进入，用来在这套结构内探索配置。这样读才能发现软件输出背后的科学假设，而不是把按钮操作当成建模能力。", "phases": [{"title": "建立系统边界和年度计算结构", "bridge": "静态模型能够表示活动之间的关联，但没有自动包含每日天气和施肥到产量的全部响应。先读假设，再读输出。", "sections": [0, 1], "output": "模型能够与不能回答的问题。"}, {"title": "由资源平衡进入设计空间", "bridge": "内部流需要抵消；决策、参数、约束与目标分别承担不同职责。缺少约束可能让算法找到现实中不可能的配置。", "sections": [2, 3], "output": "可行的候选配置及其多目标绩效。"}, {"title": "验证解释并连接后续扩展", "bridge": "以具体资源链追踪一个决策改变的后果，再检查现实可实施性，最后读家庭和粪肥模块如何扩展边界。", "sections": [4], "output": "可解释的模型学习路线。"}], "next": "连接家庭预算、粪肥链与地块时序，按问题需要选择扩展。", "sources": ["farmdesign-2012"], "readingCheck": {"start": "先用自己的话回答：怎样把农场内部相互联系的活动和资源流表达成可计算的多目标设计问题？", "finish": "回到原文证据：约束与参数设定内的备选配置和目标取舍，不是自动确定的现实最优经营方案。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "landscape-2018": {"question": "怎样把农业景观中的土地利用选择转成可比较的空间配置和生态服务取舍？", "object": "GIS土地对象、可选活动和案例指标模块。", "result": "每个候选绩效组合背后对应一张地图；指标有些是代理量，不能当作全部实测服务。", "narrative": "景观设计比把各类土地面积相加多了一步：相同数量的生境，放在不同位置可能产生不同连通性和边缘作用。框架通过生成、评价、选择和展示把地图与绩效连接起来，再供利益相关者讨论。其价值在于探索空间选择，而不是替所有参与者做最终决定。", "phases": [{"title": "从地图到决策对象", "bridge": "先分清土地组成、配置、空间单元和可改变的活动，再识别哪些指标真的使用邻接或空间过程。", "sections": [0, 1], "output": "明确的空间设计问题。"}, {"title": "从配置到服务指标与取舍", "bridge": "模型计算代理指标并探索非支配方案；偏好如何进入目标或筛选仍需专门说明。", "sections": [2, 3], "output": "地图与绩效一一对应的候选集合。"}, {"title": "从探索到使用边界", "bridge": "战略探索不等于日常自动调度，也不替代生态验证或现实采纳研究。", "sections": [4], "output": "可以用于讨论但有明确限制的设计工具。"}], "next": "用程嘉莉研究追踪人的需求如何进入景观设计。", "sources": ["landscape-2018"], "readingCheck": {"start": "先用自己的话回答：怎样把农业景观中的土地利用选择转成可比较的空间配置和生态服务取舍？", "finish": "回到原文证据：每个候选绩效组合背后对应一张地图；指标有些是代理量，不能当作全部实测服务。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "landscape-2007": {"question": "为什么田块层面较好的选择，在农场或景观尺度未必仍然最好？", "narrative": "这篇早期框架将农业收益、自然保护与景观质量放到一个多尺度讨论中。先理解尺度怎样改变边界与聚合，再看空间显式探索怎样支持土地利用讨论，不把近真实案例演示当成已经落地的政策效果。", "phases": [{"title": "问题与框架", "bridge": "先看目标由谁定义、在哪个尺度计算。", "sections": [0, 1], "output": "多尺度权衡的基本逻辑。"}, {"title": "案例怎样支撑方法", "bridge": "地图和绩效之间往返阅读，再检查演示的结论范围。", "sections": [2], "output": "能区分方法可行性与实际实施效果。"}], "sources": ["landscape-2007"], "readingCheck": {"start": "先用自己的话回答：为什么田块层面较好的选择，在农场或景观尺度未必仍然最好？", "finish": "回到原文证据：能区分方法可行性与实际实施效果。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "novotny-2024": {"question": "土地利用重新配置能否改善社区营养供给，同时兼顾收入、劳动与环境目标？", "narrative": "这篇把景观设计的产出从粮食或热量扩展到多种营养素。研究先定义生产端供给与人群需求，再比较现有活动重新配置和加入新生产系统的情景。读到营养自给结果时必须回到边界：本地产得出，不等于每个家庭买得起、吃得到或能充分吸收。", "phases": [{"title": "界定社区需求与可改变的生产活动", "bridge": "营养指标先需要明确产品来源和需求分母。", "sections": [0, 1], "output": "可计算的营养供给设计问题。"}, {"title": "解释情景结果与营养边界", "bridge": "逐项追踪营养来源，避免把植物多样化写成直接提供B12或改善居民健康。", "sections": [2, 3], "output": "营养敏感设计的启发与迁移条件。"}], "sources": ["novotny-2024"], "readingCheck": {"start": "先用自己的话回答：土地利用重新配置能否改善社区营养供给，同时兼顾收入、劳动与环境目标？", "finish": "回到原文证据：营养敏感设计的启发与迁移条件。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "ditzler-2019": {"question": "农场增收为什么不一定增加家庭福利，怎样把家庭的钱、时间和食物纳入模型？", "narrative": "农场并非独立于家庭。家庭成员还要在非农工作、照料和休闲之间分配时间，购买与留用食物也影响预算和营养。因此这篇先扩展模型边界，再探索不同活动组合的取舍，而不是给原有利润指标换一个名称。", "phases": [{"title": "从农场边界扩展到家庭", "bridge": "明确新增模块怎样改变可支配预算、劳动和营养核算。", "sections": [0, 1], "output": "农场与家庭指标的区别及连接。"}, {"title": "用机会成本理解选择", "bridge": "以小规模预算练习追踪一个活动的连锁影响，再判断现实可用性。", "sections": [2], "output": "能解释不采纳高农场收益方案的原因。"}], "sources": ["ditzler-2019"], "readingCheck": {"start": "先用自己的话回答：农场增收为什么不一定增加家庭福利，怎样把家庭的钱、时间和食物纳入模型？", "finish": "回到原文证据：能解释不采纳高农场收益方案的原因。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "qu-2025": {"question": "改良粪肥管理能否改善整个农场的环境取舍，而不是只把损失从一个环节移到另一个环节？", "narrative": "储存阶段保住的氮仍会进入后续施用与土壤过程。作者因此把粪肥链放回全农场，比较管理技术与资源重新配置。核心不是单项技术的减排百分比，而是系统规模、吸收能力和内部流共同决定的总体表现。", "phases": [{"title": "将局部技术放回完整资源链", "bridge": "先建立案例和模块边界，再追踪保留的养分流向何处。", "sections": [0, 1], "output": "全链条核算而非局部效率。"}, {"title": "解释前沿变化与案例不确定处", "bridge": "区分技术改变可达集合与资源配置沿现有集合移动；原文参数疑点保持记录。", "sections": [2, 3], "output": "技术与系统配置作用的区分。"}], "sources": ["qu-2025"], "readingCheck": {"start": "先用自己的话回答：改良粪肥管理能否改善整个农场的环境取舍，而不是只把损失从一个环节移到另一个环节？", "finish": "回到原文证据：技术与系统配置作用的区分。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "breure-2024": {"question": "怎样判断一项农业权衡分析的方法是否足以支持它提出的决策结论？", "narrative": "这篇综述适合在读完几篇案例后回看。它不提供一种包打天下的算法，而是把目标、尺度、方法、风险和参与方式放到共同框架中审查。把它用于自己的研究时，先问决策问题，再检查证据、边界和遗漏，不要把相关图、优化图和因果证据当成同一种分析。", "phases": [{"title": "先确定综述的证据范围", "bridge": "发表年不等于检索截止年，纳入研究也不是所有农业研究的随机样本。", "sections": [0, 1], "output": "可正确使用的综述结论。"}, {"title": "将方法审查落到具体研究", "bridge": "逐项检查目标、尺度、风险和参与，形成可操作的研究修订问题。", "sections": [2, 3], "output": "一份有来源边界的方法审查框架。"}], "sources": ["breure-2024"], "readingCheck": {"start": "先用自己的话回答：怎样判断一项农业权衡分析的方法是否足以支持它提出的决策结论？", "finish": "回到原文证据：一份有来源边界的方法审查框架。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "toorop-2023": {"question": "怎样在农户脆弱性与正向案例中讨论反脆弱性，又不超出已有证据？", "narrative": "反脆弱比‘表现稳定’提出了更强的主张。这篇借访谈和案例讨论储备、选择空间与自主性等特征。读法是先界定概念，再看哪些特征被实际观察、哪些机制仍是解释，而不是见到灾后表现好就宣称系统从冲击中受益。", "phases": [{"title": "概念必须对应研究证据", "bridge": "这里的正向案例识别不同于梁2022的Pareto程序，不能互相套用。", "sections": [0, 1], "output": "稳健、韧性与反脆弱的区别。"}, {"title": "由概念走向可检验问题", "bridge": "把抽象能力转成储备、可替代活动、转换成本等可说明的属性。", "sections": [2], "output": "不超出数据能力的风险研究问题。"}], "sources": ["toorop-2023"], "readingCheck": {"start": "先用自己的话回答：怎样在农户脆弱性与正向案例中讨论反脆弱性，又不超出已有证据？", "finish": "回到原文证据：不超出数据能力的风险研究问题。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "mixed-2026": {"question": "为何混合小农系统的创新需要同时考虑技术关联、参与过程和地方情境？", "narrative": "这是一篇Perspective。先理解系统思维、参与和情境之间的关系，再看案例如何说明这些原则。它提供创新研究的组织方式，不等于一个统一干预的因果效果检验。", "phases": [{"title": "理解框架，而非背三条原则", "bridge": "技术改变会沿资源、劳动和收入关系传播，人的参与和地方约束决定这些变化是否有意义。", "sections": [0, 1], "output": "可以用于提出系统问题的框架。"}, {"title": "把框架转成关系与待验证假设", "bridge": "画影响链时区分测量、已知机制与尚待调查的假设。", "sections": [2], "output": "有证据标签的系统关系图。"}], "sources": ["mixed-2026"], "readingCheck": {"start": "先用自己的话回答：为何混合小农系统的创新需要同时考虑技术关联、参与过程和地方情境？", "finish": "回到原文证据：有证据标签的系统关系图。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "verdouw-2021": {"question": "农业数字孪生需要怎样连接真实对象、状态数据、模型和决策？", "narrative": "先问孪生的对象和用途，再讨论数据更新与模型结构。这里现有带读仅核到摘要与框架层，新增原件可供继续阅读，但不能把‘现在可以打开全文’自动改称‘已经完成全文核读’。", "phases": [{"title": "明确概念和已经核实的范围", "bridge": "数字地图或静态模型不因有看板就自动成为数字孪生。", "sections": [0, 1], "output": "对象、更新、模型和行动四个接口问题。"}, {"title": "限定自己真正准备实现的系统", "bridge": "原型能力应按实际数据连接和反馈说明，不添加未确认的实时控制要求。", "sections": [2], "output": "最低可行研究系统与待补材料。"}], "sources": ["verdouw-2021"], "readingCheck": {"start": "先用自己的话回答：农业数字孪生需要怎样连接真实对象、状态数据、模型和决策？", "finish": "回到原文证据：最低可行研究系统与待补材料。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "liang-thesis": {"question": "怎样把现实案例、轮作生成和时空规划组织成连续的博士研究，而非相互孤立的论文？", "narrative": "此页是研究主线导航，不是对未取得博士全文的章号猜测。按已核读文章能建立‘诊断现实—拓展选择—满足农场约束’的学习链，随后再以博士论文目录和总讨论校对章际关系。", "phases": [{"title": "确认材料与时间边界", "bridge": "博士完成时间和后续文章发表时间不同。", "sections": [0], "output": "清楚的核读范围。"}, {"title": "追踪各项研究如何传递问题", "bridge": "沿已有文章的输入和输出建立接口，不将教学路线冒充正式目录。", "sections": [1, 2], "output": "整合性阅读提纲。"}], "sources": ["liang-thesis"], "readingCheck": {"start": "先用自己的话回答：怎样把现实案例、轮作生成和时空规划组织成连续的博士研究，而非相互孤立的论文？", "finish": "回到原文证据：整合性阅读提纲。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "cheng-thesis": {"question": "感知、偏好和景观重设计之间，证据究竟通过什么接口传递？", "narrative": "三类研究回答不同问题。感知调查呈现当地人怎样理解现状，Q方法表达相对偏好，景观模型探索改变空间配置会得到什么结果。真正的整合点在于这些输出怎样转成下一步的输入；未经核读的映射和算法细节仍需保留为缺口。", "phases": [{"title": "先确定官方摘要支持的主线", "bridge": "不能根据相关文章反推优化章的具体权重、约束和参数。", "sections": [0, 1], "output": "已经核实的设计范围及未确认接口。"}, {"title": "围绕接口组织全文学习", "bridge": "将需申请的数据、偏好映射、指标模块和运行设置与具体问题一一对应。", "sections": [2, 3], "output": "有目标的全文核读与资料申请。"}], "sources": ["cheng-thesis"], "readingCheck": {"start": "先用自己的话回答：感知、偏好和景观重设计之间，证据究竟通过什么接口传递？", "finish": "回到原文证据：有目标的全文核读与资料申请。", "scope": "阅读练习，不替代论文结果或作者论证。"}}, "xu-thesis": {"question": "不同类型农场为何需要不同的系统改进路径，现实优秀案例和模型设计又如何互补？", "narrative": "这条博士主线从异质性出发：先比较现实类型，再识别较好的管理与配置，最后以全农场模型探索针对性方案。现有材料支持这一主线导航，但不支持猜测未核到的章节算法或代表性农场选择细节。", "phases": [{"title": "由总体差异进入类型化问题", "bridge": "总体平均并不代表一套现实可行资源组合，分类应服务不同约束。", "sections": [0, 1], "output": "类型化设计的必要性。"}, {"title": "连接已发表证据与待读全文", "bridge": "数据、比较、类型与优化各有角色，沿接口准备后续阅读。", "sections": [2, 3], "output": "不混淆章节状态的学习路线。"}], "sources": ["xu-thesis"], "readingCheck": {"start": "先用自己的话回答：不同类型农场为何需要不同的系统改进路径，现实优秀案例和模型设计又如何互补？", "finish": "回到原文证据：不混淆章节状态的学习路线。", "scope": "阅读练习，不替代论文结果或作者论证。"}, "next": "完整原件现已核验，继续进入第4章正文方法带读；旧版摘要路线保留为阅读历史，不代表当前仍未取得全文。"}, "groot-2017": {"question": "怎样把生产、自然资源、市场和家庭营养放入同一个综合系统研究框架？", "narrative": "作为理论方法章节，它先组织尺度与系统之间的关系，而不是报告营养干预的效果。阅读时对每项指标确认层级，对每个措施确认获益者和成本承担者，再看后续应用如何把框架变成模型。", "phases": [{"title": "建立跨系统的研究问题", "bridge": "产量只是系统表现的一部分，营养、家庭与景观边界也需要明确。", "sections": [0], "output": "综合系统框架。"}, {"title": "从概念接口读向实际应用", "bridge": "用家庭模型和营养景观案例检查哪些关系已可计算、哪些仍需实证。", "sections": [1], "output": "框架到应用的阅读连接。"}], "sources": ["groot-2017"], "readingCheck": {"start": "先用自己的话回答：怎样把生产、自然资源、市场和家庭营养放入同一个综合系统研究框架？", "finish": "回到原文证据：框架到应用的阅读连接。", "scope": "阅读练习，不替代论文结果或作者论证。"}}}, "terms": [{"id": "cropping-system", "en": "cropping system", "zh": "种植系统", "aliases": ["cropping systems", "cropping system", "种植系统"], "definition": "一定时空范围内的作物组合、种植次序及其管理方式。读本文时先确认它指一个作物季、一个年度双季制度，还是多年轮作。", "boundary": "不自动包含全农场牲畜、家庭预算等全部子系统。", "sources": ["liang-2022", "liang-2023"], "explanation": "一定时空范围内的作物组合、种植次序及其管理方式。读本文时先确认它指一个作物季、一个年度双季制度，还是多年轮作。"}, {"id": "farming-system", "en": "farming system", "zh": "农业经营系统／农作系统", "aliases": ["farming systems", "farming system", "农作系统", "农业经营系统／农作系统", "农业经营系统"], "definition": "相互联系的农业生产活动、资源与经营条件组成的系统。中文译法随语境变化；本学习站全农场研究强调土地、作物、动物、劳动和经济之间的联系。", "sources": ["farmdesign-2012"], "explanation": "相互联系的农业生产活动、资源与经营条件组成的系统。中文译法随语境变化；本学习站全农场研究强调土地、作物、动物、劳动和经济之间的联系。"}, {"id": "whole-farm", "en": "whole-farm model", "zh": "全农场模型", "aliases": ["whole-farm model", "whole farm model", "whole-farm", "全农场模型", "全农场"], "definition": "把一个农场的多个活动及其资源流一起核算或设计，而不是逐作物孤立分析。", "boundary": "全农场范围不意味着已经包含全部动态过程。", "sources": ["farmdesign-2012", "whole-farm"], "explanation": "把一个农场的多个活动及其资源流一起核算或设计，而不是逐作物孤立分析。"}, {"id": "pareto", "en": "Pareto dominance", "zh": "帕累托支配", "aliases": ["Pareto dominance", "Pareto domination", "帕累托支配", "Pareto支配", "dominance", "支配关系"], "definition": "A在全部目标上都不比B差，且至少一项严格更好，则A支配B。判断前必须统一各目标的改善方向。", "sources": ["pareto", "liang-2022"], "explanation": "先明确每项指标是越大越好还是越小越好，再把两个方案逐项比较。只要甲在所有指标都不比乙差，且至少一项更好，就说甲支配乙。没有被其他方案支配的方案组成第一前沿。\n\n先逐列比较，不要先把指标相加。例如利润最大化、氮损失最小化，A的利润不少于B且氮损失不高于B，再检查是否至少有一项严格改善。只有全部条件成立，才能淘汰B。", "example": "只考虑利润越高越好、用水越少越好：甲(100,20)、乙(90,25)，甲支配乙；丙(120,30)比甲赚钱多但用水也多，甲和丙不能直接分出谁全面更好。\n\n教学例：A利润10、氮损失5；B利润9、氮损失6，因此A支配B。C利润12、氮损失8则与A各有长处，二者不能据这两列直接排出唯一优劣。", "exampleType": "synthetic-teaching", "boundary": "不被支配不等于每项都是最好，也不等于已经选出了一个最优方案。"}, {"id": "pareto-front", "en": "Pareto front", "zh": "帕累托前沿", "aliases": ["Pareto frontier", "Pareto frontiers", "Pareto fronts", "Pareto front", "Pareto前沿", "帕累托前沿", "非支配前沿"], "definition": "在被比较的可行集合中，不被其他方案支配的方案所构成的目标空间边界。", "boundary": "样本前沿或搜索得到的近似前沿，不自动等于现实全局最优。", "sources": ["pareto", "liang-2023"], "explanation": "在被比较的可行集合中，不被其他方案支配的方案所构成的目标空间边界。"}, {"id": "nondominated", "en": "non-dominated solution", "zh": "非支配方案", "aliases": ["non-dominated solutions", "non-dominated solution", "non-dominated", "nondominated", "非支配方案", "非支配案例", "非支配"], "definition": "在当前比较集合中，没有另一个方案能在所有目标上不差且至少一项更好。", "boundary": "可能靠单项极端优势保留，不等于各方面均衡或可直接采纳。", "sources": ["pareto", "liang-2022"], "explanation": "非支配不是一种绝对品质，而是相对于当前候选集合的比较结果。判断时需要所有目标同时参加，不能只拿最擅长的那一项比较。", "example": "甲利润100、用水20；乙利润120、用水30。甲更省水，乙更赚钱，两者都可能保留。新增丙利润130、用水15后，甲乙都会被丙支配。", "exampleType": "synthetic-teaching"}, {"id": "pareto-ranking", "en": "Pareto ranking", "zh": "帕累托分层排序", "aliases": ["non-dominated sorting", "Pareto ranking", "非支配排序", "Pareto排序", "帕累托分层排序"], "definition": "找出第一非支配层，移除后再找第二层，逐层排列。层级不是目标加权总分。", "sources": ["liang-2022", "pareto"], "explanation": "第一轮找出无人支配的方案，记为第一层；暂时移除这一层，再对剩下的方案重复。这样形成层次，不需要先把不同单位的指标加成总分。", "example": "只有利润和用水两个目标时，甲(100,20)支配乙(90,25)，乙又支配丙(80,30)。依次移除后，三者分别处于第1、2、3层。", "exampleType": "synthetic-teaching"}, {"id": "positive-deviance", "en": "positive deviance", "zh": "正向偏离／正向案例方法", "aliases": ["positive deviants", "positive deviant", "positive deviance", "正向偏离", "正向案例", "正向偏离／正向案例方法", "正向案例方法"], "definition": "从现实对象中识别在相关目标上表现突出的案例，并探究可学习的做法。", "boundary": "不同论文可用不同识别程序；不是数据清洗中的异常值剔除，也不自动建立因果关系。", "sources": ["liang-2022", "toorop-2023"], "explanation": "先看现实中是否已经有人在类似困难下做得较好，再分析这些人的做法与条件。它从已发生的案例中找启发，而不是先由模型虚构一套最优做法。", "example": "一个村大多农户利润相近，但少数农户在利润不低的同时少用水。可以研究他们的灌溉、作物和条件差异；不能仅据此断言某种灌溉方式一定造成高利润。", "exampleType": "synthetic-teaching"}, {"id": "multiobjective", "en": "multi-objective optimization", "zh": "多目标优化", "aliases": ["multi-objective optimization", "multiobjective optimization", "multi-objective optimisation", "多目标优化"], "definition": "在约束下同时考虑多个通常存在取舍的目标，探索有效方案集合，再结合决策偏好选择。", "sources": ["farmdesign-2012", "pareto"], "explanation": "单目标会给一个明确的改善方向；多目标要同时处理多个方向，并承认它们可能相互冲突。优化通常先给出值得考虑的方案集合，再由决策者按偏好选择。", "example": "种更多蔬菜可能增加收入，也增加劳动。模型同时考虑收入和劳动，而不是默认收入增加就意味着整体更好。", "exampleType": "synthetic-teaching"}, {"id": "tradeoff", "en": "trade-off", "zh": "权衡／目标间取舍", "aliases": ["trade-offs", "trade-off", "tradeoffs", "tradeoff", "目标取舍", "权衡关系", "权衡", "权衡／目标间取舍", "目标间取舍"], "definition": "在特定条件或比较空间中，改善一个目标可能伴随另一个目标的恶化。", "boundary": "观测相关、模型中的配置取舍和因果权衡不是同一种证据。", "sources": ["breure-2024"], "explanation": "先问：是在什么候选集合、约束和条件下，一项改善会让另一项变差？权衡可能来自资源争用，也可能只是样本中的统计关联，两者不能直接等同。\n\n先指出哪些目标发生了冲突，再说明这种关系在哪些数据、约束和比较范围内成立。看到散点趋势不等于已经证明因果机制。", "example": "一天只有8小时，增加蔬菜管理时间可能减少养殖管理时间。资源上限解释了为什么两个活动不能同时无限增加。\n\n教学例：某方案利润更高，但需要更多灌溉；另一个方案节水，但收入稍低。是否接受取舍取决于决策者、用水上限与风险。", "exampleType": "synthetic-teaching"}, {"id": "synergy", "en": "synergy", "zh": "协同", "aliases": ["synergies", "synergy", "协同"], "definition": "在明确边界与比较条件下，多个目标共同改善或活动之间相互支持。", "boundary": "不意味着在所有情景下不存在冲突。", "sources": ["qu-2025", "breure-2024"], "explanation": "协同强调多个目标一起改善，但必须给出比较基准和系统边界。某个局部过程的协同，可能被其他环节的成本抵消。", "example": "把可利用的畜禽粪肥替代部分外购肥料，可能同时减少购买成本与废弃物处置压力；还需核算运输、储存和施用损失。", "exampleType": "synthetic-teaching"}, {"id": "midip", "en": "MIDIP", "zh": "多指标到理想点的距离", "aliases": ["MIDIP", "Multi-indicator distance to the ideal point", "多指标到理想点的距离"], "definition": "梁2022将群组中心到各指标理想值的距离按观测范围标准化后，平方求和并开根号。值较小表示整体更接近该理想点。", "boundary": "不是距离的简单平均；理想点可能不对应任何现实农场。", "sources": ["liang-2022", "ideal-distance"], "explanation": "可以把每项指标看成一条坐标轴。先计算群组中心在每项指标上离最好值有多远，再除以该指标的观测范围，使单位可比；最后将这些距离平方相加后开根号。这里比较的是群组中心，不是直接给每个农户算平均分。", "example": "两个标准化差距为0.3与0.4，则MIDIP=√(0.3²+0.4²)=0.5。若差距变成0.6与0.8，MIDIP=1，说明相对于同一个理想点更远。", "exampleType": "synthetic-teaching"}, {"id": "hdip", "en": "HDIP", "zh": "各指标到理想点距离的异质性", "aliases": ["HDIP", "Heterogeneity of distances to the ideal point", "各指标到理想点距离的异质性"], "definition": "梁2022用标准化距离在指标间的样本标准差描述不均衡。值小表示各维度距离相近。", "boundary": "各项都很差但差得一样时也可很小，不能单独据此选最佳系统。", "sources": ["liang-2022", "ideal-distance"], "explanation": "先得到各指标标准化后的差距，再计算这些差距的样本标准差。差距越分散，说明某些方面很接近理想值、另一些却差得多。它衡量均衡程度，需和整体距离一起看。", "example": "差距(0.2,0.2)与(0.8,0.8)的HDIP都为0；前者整体较好，后者只是均匀地较差。差距(0,1)的HDIP约0.707。", "exampleType": "synthetic-teaching"}, {"id": "idealpoint", "en": "ideal point", "zh": "理想点", "aliases": ["ideal point", "理想点"], "definition": "按每一项指标各自的最好值组成的参照点。这些最好值可能来自不同案例，因此不一定同时可达到。", "sources": ["ideal-distance"], "explanation": "把不同指标各自的最好成绩拼成一个虚拟参照。由于最高利润和最低用水可能来自不同农户，这个参照不一定是现实中能同时达到的方案。\n\n利润列取最大值，污染列取最小值；不同列的最佳值可以来自不同农场。它说明“各列都达到最好”在哪里，不保证这个组合可同时实现。", "example": "甲利润最高为150，乙用水最低为10，理想点就是利润150、用水10；但未必存在一个农场同时达到这两个值。\n\n教学例：农场A利润100、用水80，B利润80、用水50。利润最大化、用水最小化时，理想点是利润100、用水50；样本里并没有这样的农场。", "exampleType": "synthetic-teaching", "boundary": "一定注明理想值来自全样本、子样本还是外部目标，换比较范围可能改变距离。"}, {"id": "efficiency", "en": "Pareto efficiency score", "zh": "帕累托效率得分（本文特定定义）", "aliases": ["Pareto efficiency score", "Pareto efficiency", "Pareto效率得分", "帕累托效率得分（本文特定定义）"], "definition": "梁2023考察最小目标子集大小k，使某方案在所有大小为k的目标子集中都非支配。", "boundary": "关键是‘所有子集’，不是至少一个，也不是非支配概率。其他文献同名概念需另核定义。", "sources": ["liang-2023", "efficiency-score"], "explanation": "先固定目标子集的大小，再检查这个大小下的所有目标组合。梁2023的特定得分寻找使方案在所有这些子集上都保持非支配的最小子集大小。不要把它读成有多少概率最优。", "example": "三个目标有三个二目标子集：AB、AC、BC。某方案只在AB和AC非支配、在BC被支配，就不能说它在所有二目标子集中都非支配。", "exampleType": "synthetic-teaching"}, {"id": "pca", "en": "principal component analysis (PCA)", "zh": "主成分分析", "aliases": ["principal component analysis", "principal components analysis", "PCA", "主成分分析"], "definition": "用原变量的线性组合提取主要变异方向，以较少维度表达数据差异。", "boundary": "保留方差不等于衡量社会重要性，PC1不能自动称为总体可持续性。", "sources": ["liang-2023", "pca-cluster"], "explanation": "把几列彼此有关的数据重新组合成少数新轴，让第一条轴尽可能保留数据差异，第二条在与第一条正交的方向上保留剩余差异。读结果时先看是否标准化，再看解释方差和各变量载荷。", "example": "农场的面积、总产量和总收入常随规模一起变大。一个主成分可能主要反映规模，而不是综合可持续性；轴名必须依据载荷解释。", "exampleType": "synthetic-teaching"}, {"id": "hca", "en": "hierarchical cluster analysis (HCA)", "zh": "层次聚类", "aliases": ["hierarchical clustering", "hierarchical cluster analysis", "HCA", "层次聚类"], "definition": "根据距离和连接规则逐步合并对象，形成层次结构，再选定切分层级。结果依赖变量、标准化、距离和连接方法。", "sources": ["liang-2022", "liang-2023", "pca-cluster"], "explanation": "先把每个对象单独看成一组，然后根据距离和合并规则，逐次把相似组并在一起。树状图表示合并历史，最终分几组需要另外决定。", "example": "四个农场中，甲乙都高利润高耗水，丙丁都低投入省水，聚类可能先合并甲乙、丙丁。换成别的变量后分组也可能改变。", "exampleType": "synthetic-teaching"}, {"id": "ward", "en": "Ward.D2", "zh": "Ward连接方法的一种实现", "aliases": ["Ward.D2", "Ward’s method", "Ward's method", "Ward clustering", "Ward连接方法的一种实现"], "definition": "R层次聚类中的连接方法。其最小方差解释对应欧氏几何；复现时需同时核对原文使用的距离和实现设置。", "sources": ["pca-cluster", "liang-2022"], "explanation": "Ward是一种决定哪些组优先合并的规则，关注合并后组内差异增加的程度。Ward.D2是R中的具体实现名称；距离计算与连接规则是两个不同设置，复现必须同时记录。", "example": "先用哪种距离表示甲乙有多不同，再用Ward.D2决定怎样合并群组。把论文的距离擅自改成更常见的距离，就不是严格复现。", "exampleType": "synthetic-teaching"}, {"id": "gross-margin", "en": "gross margin", "zh": "毛利", "aliases": ["gross margins", "gross margin", "毛利"], "definition": "按论文的成本边界，以收入减去相应变动成本得到的经济指标。", "boundary": "不自动等于扣除所有固定成本和家庭劳动机会成本后的净利润；不同论文成本项需分别核对。", "sources": ["liang-2022", "xu-2024"], "explanation": "先按产量乘价格计算收入，再扣除论文规定的变动成本。比较研究时必须检查种子、肥料、机械、雇工、家庭劳动和折旧分别有没有计入。", "example": "收入1万元、所列变动成本6000元，则毛利4000元；若房屋折旧和家庭劳动未计入，这4000元不能直接称为净利润。", "exampleType": "synthetic-teaching"}, {"id": "dietary-energy", "en": "dietary energy yield", "zh": "膳食能量产出", "aliases": ["dietary energy yield", "dietary energy production", "膳食能量产出"], "definition": "由农业产品数量及可食部分、能量含量等换算的生产端能量供给。", "boundary": "不等于家庭实际摄入的能量。", "sources": ["liang-2022", "novotny-2024"], "explanation": "这是把生产出的产品换算成食物能量，服务于生产系统能提供多少食物的讨论。产量、可食比例、能量含量和时间面积单位都会影响结果。", "example": "生产1000kg某可食产品，若按教学假设每kg含3000kcal，则生产端能量为300万kcal；它不代表农户实际吃掉这些能量。", "exampleType": "synthetic-teaching"}, {"id": "n-surplus", "en": "nitrogen surplus", "zh": "氮盈余", "aliases": ["nitrogen surplus", "N surplus", "氮盈余"], "definition": "在给定系统与时间边界内，氮输入减去定义中的氮输出。", "boundary": "可能涉及土壤积累及多种损失或遗漏项，不能直接等同实际氮淋溶。", "sources": ["xu-2024", "nutrients"], "explanation": "像做收支账一样，在同一边界、同一时期内把进入的氮减去被定义为输出的氮。盈余可以进入土壤存量，也可能经多种途径损失；具体项取决于研究核算。", "example": "投入氮200kg、收获产品带走120kg，氮盈余80kg。但这80kg不能不加证据地全部写成流进地下水的氮。", "exampleType": "synthetic-teaching"}, {"id": "n-loss", "en": "nitrogen loss", "zh": "氮损失", "aliases": ["nitrogen losses", "nitrogen loss", "N losses", "N loss", "氮损失"], "definition": "氮通过相关途径离开所研究系统的量。须查清论文是实测、过程估算，还是平衡残差。", "boundary": "不同估算方法不能默认具有同等证据精度。", "sources": ["farmdesign-2012", "liang-2022", "nutrients"], "explanation": "氮损失描述氮离开所关注系统的途径，可能是氨挥发、硝酸盐淋溶或氧化亚氮排放。读论文时先分清各途径，再看是直接测量还是根据施肥量估计。", "example": "如果论文用施肥量乘经验系数估计氨挥发，这是一项模型估计，而不是在每个农户地里安装仪器测出的排放量。", "exampleType": "synthetic-teaching"}, {"id": "groundwater", "en": "groundwater depletion", "zh": "地下水消耗／耗竭", "aliases": ["groundwater depletion", "地下水消耗", "地下水耗竭", "地下水消耗／耗竭", "耗竭"], "definition": "与地下水资源减少有关的指标。具体计算可能考虑灌溉、补给或其他水量过程，应以本文公式为准。", "boundary": "不能把某个用水估算值说成每个农户都有地下水位实测。", "sources": ["liang-2022", "liang-2023"], "explanation": "不要把抽了多少水和地下水净减少多少直接画等号。某些核算会扣除深层补给；理解公式时应逐项检查抽取量、补给量、面积和时间。", "example": "按一个简化教学账本，抽水300mm、回补60mm，则净消耗240mm；这不是直接观测到地下水位下降240mm。", "exampleType": "synthetic-teaching"}, {"id": "ghg", "en": "greenhouse gas emissions", "zh": "温室气体排放", "aliases": ["greenhouse gas emissions", "greenhouse gases", "GHG emissions", "GHG", "温室气体排放"], "definition": "按特定排放边界及温室效应换算表达的气体排放量。净排放还需要查清抵扣或固碳项。", "boundary": "不同边界、时间尺度或CO₂当量系数下的数值不能直接比较。", "sources": ["liang-2022", "liang-2023"], "explanation": "不同温室气体影响气候的能力不同，常按约定系数换算为CO₂当量。还需检查是直接田间排放、投入品生产运输，还是包含土壤碳变化的全边界结果。", "example": "甲只报告田间N₂O，乙报告肥料生产加运输加田间排放。即便二者都标CO₂当量，也不能在未统一边界前直接比较。", "exampleType": "synthetic-teaching"}, {"id": "rotation", "en": "crop rotation", "zh": "作物轮作", "aliases": ["crop rotations", "crop rotation", "轮作", "作物轮作"], "definition": "同一土地在多个生产时期按一定顺序安排不同作物。是否计入季节、返回间隔和前茬效应，应查具体模型。", "sources": ["liang-2023", "rotation"], "explanation": "重点是同一块地的时间顺序：前一季种什么、后一季接什么、多久能再种回来。轮作不同于同时在相邻地块种不同作物，也不同于在同一季混种。", "example": "一块地第一年玉米、第二年大豆、第三年小麦，是时间上的序列。三块地同一年分别种这三种作物，则首先是空间配置。", "exampleType": "synthetic-teaching"}, {"id": "rotat", "en": "ROTAT", "zh": "轮作方案生成工具", "aliases": ["ROTAT+", "ROTAT", "轮作方案生成工具"], "definition": "用作物活动和农学规则生成候选作物序列的工具。本文先生成再评价。ROTAT与ROTAT+的版本和扩展不能混同。", "boundary": "方案生成器不等于逐日作物生长过程模型。", "sources": ["liang-2023", "farmsteps-2026"], "explanation": "先把每种可选作物看成带日历和约束的活动，再按规则连接成序列。生成后还要评价绩效；能生成并不表示经济上最好，也不代表已经模拟了逐日生长。", "example": "规则要求马铃薯至少隔两年再种，生成器会排除连续种马铃薯的序列，然后由其他指标评估留下的序列。", "exampleType": "synthetic-teaching"}, {"id": "farmsteps", "en": "FarmSTEPS", "zh": "农场时空种植计划探索模型", "aliases": ["FarmSTEPS", "农场时空种植计划探索模型"], "definition": "连接农场配置、土地单元、时间轴、作物序列、指标和约束，探索多地块多时期种植计划。", "boundary": "已核读案例使用枚举与Pareto筛选，不称为P-MODE。", "sources": ["farmsteps-2026"], "explanation": "先定义农场地块、土地单元、时间、作物、指标和约束。对每块地检查前后作物能否衔接，再合并到同一时期的全农场，检查共同资源是否足够。", "example": "两块地各自的蔬菜安排都符合轮作，但同一月都需6人日，而农场只有8人日；合起来需要12人日，这个全农场计划就不可行。", "exampleType": "synthetic-teaching"}, {"id": "farmdesign", "en": "FarmDESIGN", "zh": "全农场多目标设计模型", "aliases": ["FarmDESIGN", "全农场多目标设计模型"], "definition": "将农场作物、动物、资源平衡及经济劳动等指标与多目标设计连接。原始模型采用静态年度与稳态设定。", "boundary": "不同后续模块和版本的功能应分别确认。", "sources": ["farmdesign-2012"], "explanation": "把作物和动物活动放进一个资源账本，连接饲料、粪肥、养分、劳动和经济指标，再探索不同活动组合。先看模型表达了什么平衡，再看它如何搜索方案。", "example": "增加奶牛会增加牛奶收入，也会增加饲料和劳动需求、产生更多粪肥。这些流量必须一起进入农场核算，不能只加收入。", "exampleType": "synthetic-teaching"}, {"id": "landscapeimages", "en": "LandscapeIMAGES", "zh": "空间显式景观多目标探索框架", "aliases": ["LandscapeIMAGES", "空间显式景观多目标探索框架"], "definition": "围绕GIS土地对象与活动选项，生成、评价、筛选并展示土地利用配置及生态系统服务取舍。", "boundary": "输出支持方案讨论，不自动保证实际生态效果或社会采纳。", "sources": ["landscape-2007", "landscape-2018"], "explanation": "先以土地对象为基础列出可选活动，再计算不同位置安排这些活动的结果，探索多个目标间的取舍。关键不只是种多少，还包括种在哪里。", "example": "两种方案都有10ha生境带，一种连成通道，另一种零散分布；空间指标可能不同，面积相同并不保证生态效果相同。", "exampleType": "synthetic-teaching"}, {"id": "enumeration", "en": "enumeration", "zh": "枚举", "aliases": ["exhaustive enumeration", "systematic enumeration", "enumeration", "枚举"], "definition": "按定义系统列出候选组合并检验可行性。", "boundary": "只有确实遍历全部有限空间时，才对该空间完整；不代表覆盖现实所有可能活动。", "sources": ["farmsteps-2026", "rotation"], "explanation": "枚举不是随机挑几个例子，而是依照事先定义的有限选择空间逐一构造并检验。组合数量可能随着地块、时期和作物数迅速增加，所以需要约束剪枝。", "example": "两块地各有3种作物可选，一期共有3×3=9种组合；两期在无其他规则时共有9×9=81种组合。", "exampleType": "synthetic-teaching"}, {"id": "constraint", "en": "constraint", "zh": "约束条件", "aliases": ["constraints", "constraint", "约束条件", "资源约束", "约束"], "definition": "候选方案必须满足的限制，例如土地总面积、同一时期劳动上限或饲料需求。目标是希望改善的方向，约束是不能违反的边界。", "sources": ["whole-farm", "farmsteps-2026"], "explanation": "约束决定能不能做，目标决定希望做得多好。把一个希望误写成硬约束，可能排除本来有讨论价值的方案；把硬限制当目标则可能留下无法实施的方案。\n\n资源约束可以是土地、劳动或资金上限；逻辑约束可以是作物先后次序或不能同时占地。约束需与相应时间和空间范围一致。", "example": "劳动力不能超过100小时是约束；在可行方案里尽量减少劳动是目标。一个方案用101小时，不能仅靠更高利润抵消超限。\n\n教学例：全年总劳动100小时看似够用，但若某一周要80小时、该周只有40小时可用，方案仍不可行。", "exampleType": "synthetic-teaching", "boundary": "不能把希望尽量提高的目标与绝对不能超过的上限混为一谈。"}, {"id": "decision-variable", "en": "decision variable", "zh": "决策变量", "aliases": ["decision variables", "decision variable", "决策变量"], "definition": "模型允许选择或调整的量，如作物面积、活动序列、牲畜数量。与预先给定的参数以及计算所得指标不同。", "sources": ["whole-farm"], "explanation": "决策变量是允许被选择的部分，参数是暂时给定的条件，指标是选择之后算出来的结果。先分清这三者，就能理解模型到底在优化什么。\n\n先问“我实际能改变什么”，再确定取值范围、单位和相互关系。只有把可调整的量写清楚，优化问题才有明确的方案空间。", "example": "玉米面积是决策变量，玉米单价是给定参数，总收入是计算结果。价格风险研究也可能把单价改成情景变量，但需另行说明。\n\n教学例：一个10公顷农场可以决定小麦和豆类的种植面积。两种面积是决策变量；总土地不超过10公顷是约束。", "exampleType": "synthetic-teaching", "boundary": "某个输入是否是决策变量取决于建模设定，不能看到一个数就默认模型可以调整它。"}, {"id": "ecosystem-services", "en": "ecosystem services", "zh": "生态系统服务", "aliases": ["ecosystem services", "ecosystem service", "生态系统服务"], "definition": "生态系统对人类福祉的相关贡献。研究需明确选择了哪些服务、怎样量化或收集感知，以及属于供给、调节等何种框架。", "boundary": "感知评分、代理指标与实测服务量不能相互替代。", "sources": ["cheng-2023", "cheng-2025", "landscape-2018"], "explanation": "先问生态系统给谁带来什么好处，再确定用什么方法描述这种好处。供给能力、人们的感知、需求和实际受益是相互联系但不同的量。", "example": "农田附近有授粉昆虫可能支持作物授粉；统计昆虫数量、问农户觉得授粉重要不重要、测结实率，是三种不同证据。", "exampleType": "synthetic-teaching"}, {"id": "disservices", "en": "ecosystem disservices", "zh": "生态系统负服务", "aliases": ["ecosystem disservices", "ecosystem dis-services", "dis-services", "disservices", "负服务", "生态系统负服务"], "definition": "所研究生态或农业系统对人造成的不利影响。本研究关注受访者是否感知或报告这些影响。", "boundary": "没有报告不等于实际不存在。", "sources": ["cheng-2023"], "explanation": "关注系统对人造成的不利影响，并明确受影响对象、机制和测量方法。感知研究回答人们是否认识到问题，不等于直接测量损害有多大。", "example": "有人认为农田害虫增加了生产压力，这是感知证据；若要证明产量减少多少，还需要相应观测或试验。", "exampleType": "synthetic-teaching"}, {"id": "rda", "en": "redundancy analysis (RDA)", "zh": "冗余分析", "aliases": ["redundancy analysis", "RDA", "冗余分析"], "definition": "用解释变量约束多个响应变量的线性排序。程2023的分析单位是35个村庄，使用村庄平均感知。", "boundary": "箭头关系是特定模型与尺度下的关联，不是因果证据。", "sources": ["cheng-2023", "rda"], "explanation": "可以理解为先用一组解释变量预测多列响应，再用少数轴概括这些可解释的共同变化。它同时处理多个响应，而不是只分析一个产量变量。", "example": "用村庄作物结构和经营特征解释多个服务感知评分。箭头接近只提示所选模型下的关联，不自动说明改种某作物会导致感知改变。", "exampleType": "synthetic-teaching"}, {"id": "likert", "en": "Likert scale", "zh": "李克特式等级评分", "aliases": ["Likert scale", "Likert-type", "Likert", "李克特量表", "李克特式等级评分"], "definition": "用有序等级表达回答。分析前需分清真实低值、未知、不适用与未发生，并核对论文的编码与聚合方式。", "sources": ["cheng-2023", "survey"], "explanation": "用有顺序的档位让人表达态度或判断。1到5表示由低到高，但相邻档位之间是否能当等距离，须看分析假设。未知应与最低分区别编码。", "example": "1=很不重要、5=很重要；回答不知道的人不应自动记成1，否则会把不了解误作不重视。", "exampleType": "synthetic-teaching"}, {"id": "q-method", "en": "Q methodology", "zh": "Q方法", "aliases": ["Q methodology", "Q-methodology", "Q method", "Q方法"], "definition": "让参与者排序同一组陈述，再分析人与人完整排序模式的相似性，识别共同观点并结合理由解释。", "boundary": "不是普通量表求总分，也不直接估计总体人口比例。", "sources": ["cheng-2025", "q-method"], "explanation": "先准备一组覆盖议题的陈述，让每个人把整组陈述按相对重视程度排序；再比较不同人的完整排序模式，识别共同观点，并结合访谈解释。", "example": "甲优先保收入、乙优先保环境；即使两人都认为所有服务重要，有限的高分位置仍迫使他们展示相对优先顺序。", "exampleType": "synthetic-teaching"}, {"id": "qsort", "en": "Q-sort", "zh": "Q排序／一份完整排序", "aliases": ["Q-sorts", "Q-sort", "Q sorting", "Q排序", "Q排序／一份完整排序", "一份完整排序"], "definition": "一个参与者将全部陈述放入规定排序位置形成的整体回答。程2025为20条陈述和2—4—8—4—2五档网格。", "sources": ["cheng-2025"], "explanation": "一份Q排序是一个人的整套取舍，不是某一条陈述的单个分数。规定各档能放几张卡片，是为了表达相对排序，不代表真实意见服从正态分布。", "example": "20张卡按2、4、8、4、2放进五档，最高档只有两个位置。某条被放中间可能只是相对没那么优先，不等于绝对不重要。", "exampleType": "synthetic-teaching"}, {"id": "qset", "en": "Q-set", "zh": "Q陈述集", "aliases": ["Q-set", "Q set", "Q陈述集"], "definition": "参与者需要排序的一组陈述。它对议题的覆盖影响能识别哪些观点。", "sources": ["q-method", "cheng-2025"], "explanation": "Q陈述集相当于提供给参与者表达观点的词汇表。漏掉一种重要立场，就可能无法识别持有该立场的人；因此陈述覆盖和措辞都重要。", "example": "只给收入类陈述、不放水环境陈述，即便参与者很关心水污染，最后的排序也难以完整表达这种观点。", "exampleType": "synthetic-teaching"}, {"id": "pset", "en": "P-set", "zh": "Q研究参与者集合", "aliases": ["P-set", "P set", "Q研究参与者集合"], "definition": "参与Q排序的人或机构代表集合，通常用于覆盖观点多样性；不自动具备总体比例推断的抽样基础。", "sources": ["q-method"], "explanation": "这里的P指参与排序的人。选择参与者常是为了覆盖不同经验、职业或利益立场，而不一定按人口比例抽样。", "example": "邀请农户、政府与环保人员各若干人，可以探索不同观点；不能仅用样本中人数比例推算全国有多少人持某一观点。", "exampleType": "synthetic-teaching"}, {"id": "loading", "en": "factor loading", "zh": "因子载荷", "aliases": ["factor loadings", "factor loading", "因子载荷"], "definition": "在本篇Q分析中，表示一份完整排序与某个共同观点因子的关联。", "boundary": "不是生态系统服务在优化模型中的目标权重。", "sources": ["cheng-2025", "q-method"], "explanation": "先看这份排序与某个共同观点是否相似，再判断其载荷和显著性。Q方法的对象通常是人的完整排序，这和普通变量因子分析中的载荷对象不同。", "example": "某农户在因子A上的载荷0.8、在B上0.1，提示其排序更接近A；不能据此说他给某项生态服务赋予0.8的优化权重。", "exampleType": "synthetic-teaching"}, {"id": "array", "en": "factor array", "zh": "因子典型排序", "aliases": ["factor arrays", "factor array", "factor-array", "典型排序", "因子典型排序"], "definition": "依据归属该因子的排序形成代表性分数，再映射为该观点对全部陈述的典型排序。它与因子载荷是不同对象。", "sources": ["cheng-2025", "q-method"], "explanation": "因子典型排序把共同观点展示成一份代表性的卡片安排，便于说明这个观点最重视和最不重视什么。它是统计汇总，不一定对应某个真实参与者的逐项回答。", "example": "同属一观点的几个人都把粮食供给放前列，汇总后该陈述也可能处于典型排序高位；个别人仍可有差异。", "exampleType": "synthetic-teaching"}, {"id": "varimax", "en": "varimax rotation", "zh": "最大方差正交旋转", "aliases": ["varimax rotation", "varimax", "Varimax", "最大方差正交旋转"], "definition": "因子分析中的一种正交旋转方式，用于使载荷结构更清晰，便于解释。程2025将它用于Q分析。", "sources": ["cheng-2025"], "explanation": "旋转的作用是让载荷结构更便于解释，而不是增加新数据。正交旋转保持因子轴相互垂直；是否采用、如何解释，须回到研究设定。", "example": "旋转前某些对象同时在两个因子上中等载荷，旋转后可能更清楚地主要关联其中一个因子，但并不意味着找到真实社会群体的唯一划分。", "exampleType": "synthetic-teaching"}, {"id": "stakeholder", "en": "stakeholder", "zh": "利益相关者", "aliases": ["stakeholders", "stakeholder", "利益相关者"], "definition": "会影响系统决策或受到其结果影响的个人、群体或机构。应区分代表个人还是机构表达观点。", "sources": ["cheng-2025"], "explanation": "利益相关者不只是参加访谈的人，也包括受到结果影响或能够影响实施的人。研究需要明确谁被纳入、谁没有发声，以及一个人代表个人还是组织。", "example": "灌溉方案既影响农户，也可能影响下游居民和水管理部门。只问农户不能自动代表所有受影响者的意见。", "exampleType": "synthetic-teaching"}, {"id": "perception", "en": "perception", "zh": "感知", "aliases": ["perceptions", "perception", "感知"], "definition": "参与者怎样认识或判断现状及变化，受经验、可见性和问题理解等影响。", "boundary": "感知不是实测状态；感知、偏好和实际采纳是不同研究对象。", "sources": ["cheng-2023", "survey"], "explanation": "感知反映人怎样观察和理解环境，受经验、记忆、知识和可见性影响。它对社会接受与决策很重要，但应和实测状态分别报告。", "example": "农户认为近年虫害增加，不等于监测数据已经证明虫害密度增加；两者一致时互相支持，不一致时需要研究原因。", "exampleType": "synthetic-teaching"}, {"id": "preference", "en": "preference", "zh": "偏好", "aliases": ["preferences", "preference", "偏好"], "definition": "在不同结果或选项之间的相对优先关系。Q排序帮助表达这种取舍。", "boundary": "偏好评分不能直接当作实际行为预测。", "sources": ["cheng-2025", "survey"], "explanation": "偏好表达在多种选择之间更愿意优先保留什么。说重要和真正投入资源可能不同，所以偏好不是行为的直接替代指标。", "example": "甲更看重收入，乙更看重低污染；在同一组非支配方案中，两人可能选择不同方案，而不是一人一定算错。", "exampleType": "synthetic-teaching"}, {"id": "mci", "en": "multiple cropping index (MCI)", "zh": "复种指数", "aliases": ["multiple cropping index", "multi-cropping index", "MCI", "复种指数"], "definition": "表达单位土地在一年内种植活动的重复利用程度。徐2024用它帮助区分年度绩效与每轮作物的平均绩效。", "boundary": "用指标除以MCI不等于消除了所有规模或经营背景混杂。", "sources": ["xu-2024"], "explanation": "通常以一年内的总播种面积除以耕地面积，再按所用单位表达。它反映土地被重复用于种植的程度；不同统计口径应先统一。", "example": "1ha地一年种两季，每季播1ha，总播种面积2ha，复种指数为2或200%，须明确采用哪种表达。", "exampleType": "synthetic-teaching"}, {"id": "typology", "en": "farm typology", "zh": "农场类型划分", "aliases": ["farm typology", "farm typologies", "农场类型划分", "类型化"], "definition": "为抽样、解释差异或模型设计，将农场按相关特征组织成有意义的类型。不同目的需要不同变量。", "sources": ["xu-thesis", "typology"], "explanation": "先说明为什么分类型，再选择能够服务这个目的的变量。类型是帮助抽样、解释和设计的工具，不是农场天然只有一种固定分类。", "example": "为研究劳动限制，可以按家庭劳动力和种养结构分组；为研究水资源，可能更需要按灌溉条件分组。", "exampleType": "synthetic-teaching"}, {"id": "rarefaction", "en": "rarefaction", "zh": "稀释抽样", "aliases": ["rarefaction", "稀释抽样"], "definition": "在控制或匹配抽样规模后比较丰富度，避免样本面积或数量不同导致直接计数不可比。", "sources": ["xu-2024"], "explanation": "观察越多往往越容易见到更多种类。稀释抽样把比较放到共同样本量下，减少单纯因为样本更多而看到种类更多的影响。", "example": "甲调查100个地块看到12种作物，乙调查20个地块看到8种。先比较相同抽样规模下的丰富度，才能避免直接用12对8下结论。", "exampleType": "synthetic-teaching"}, {"id": "steady-state", "en": "steady state", "zh": "稳态", "aliases": ["steady-state", "steady state", "稳态"], "definition": "在所研究时间与边界下，相关存量被假定不发生净变化。FarmDESIGN原始年度模型采用相关稳态设定。", "boundary": "不意味着现实农场没有季节波动。", "sources": ["farmdesign-2012", "whole-farm"], "explanation": "稳态是对特定存量的净变化作出的假设，不是说系统每一刻都静止。它能简化平衡核算，但也限制模型解释长期积累或衰减的能力。", "example": "年度模型假定饲草库存年初年末相同，仍可能存在夏季入库、冬季消耗；若库存逐年减少，这个稳态假设就需重新检查。", "exampleType": "synthetic-teaching"}, {"id": "bioeconomic", "en": "bio-economic model", "zh": "生物经济模型", "aliases": ["bio-economic model", "bioeconomic model", "bio-economic", "生物经济模型"], "definition": "将农业生产与资源等生物物理关系同经济核算或选择相连接的模型。具体过程详细程度取决于研究目的。", "sources": ["farmdesign-2012"], "explanation": "把生产过程与经济选择连接起来：自然过程决定可产多少、需多少资源，经济核算再计算成本和收益。模型精细程度取决于研究目标。", "example": "降雨影响产量，产量乘价格形成收入，灌溉又同时影响用水和成本。只给作物填一个价格表并不一定已完整表达生物物理过程。", "exampleType": "synthetic-teaching"}, {"id": "pmode", "en": "P-MODE", "zh": "群体多目标差分进化方法", "aliases": ["P-MODE", "differential evolution", "差分进化", "群体多目标差分进化方法"], "definition": "通过群体候选的变异和选择探索多目标设计空间的一类进化搜索方法。", "boundary": "搜索到的前沿通常是近似集合，不能无证明宣称全局最优；也不等同FarmSTEPS的枚举。", "sources": ["farmdesign-2012", "landscape-2018"], "explanation": "用一群候选方案反复产生新候选，并根据约束和多目标表现保留较好者。它是搜索策略，不是农场的生产过程模型；搜索预算会影响找到的集合。", "example": "在很多作物面积组合中不断修改候选，尝试找到利润高且损失低的方案。没有穷举或证明时，应称近似前沿而非全部全局最优。", "exampleType": "synthetic-teaching"}, {"id": "spatial", "en": "spatially explicit", "zh": "空间显式", "aliases": ["spatially explicit", "spatial-explicit", "空间显式"], "definition": "对象的位置、邻接或空间过程明确影响计算。只有GIS面积输入，不保证模型实际表达了空间配置效应。", "sources": ["landscape-2018", "spatial-design"], "explanation": "空间显式需要区分位置或空间关系怎样进入模型。地块属性影响结果、相邻关系影响过程，都是可说明的机制；一张地图作为背景本身不够。", "example": "同样10ha作物，放在坡上与坡下可能产生不同径流影响；若模型只看总面积而不看位置，就没有表达这个差异。", "exampleType": "synthetic-teaching"}, {"id": "connectivity", "en": "connectivity", "zh": "连通性", "aliases": ["connectivity", "连通性"], "definition": "空间对象在结构或过程意义上的连接程度。相同生境面积，配置不同可得到不同连通性。", "sources": ["landscape-2018", "spatial-design"], "explanation": "连通性有结构与功能两个常见角度：地图上是否连成片，以及生物或物质实际上能否通过。两者有关，但不能不经验证地等同。", "example": "树篱连成线可能提高结构连通性；是否真的帮助某种昆虫迁移，还与距离、树篱质量和物种能力有关。", "exampleType": "synthetic-teaching"}, {"id": "proxy", "en": "proxy indicator", "zh": "代理指标", "aliases": ["proxy indicators", "proxy indicator", "代理指标"], "definition": "用较易计算或观测的量间接表达目标过程或服务。", "boundary": "代理值改善不自动证明实际生态过程按同样幅度改善。", "sources": ["landscape-2018", "indicators"], "explanation": "无法直接量化想研究的目标时，用有依据的替代量间接表示。解释时要写清代理关系，不把容易计算的数当成目标本身。", "example": "用半自然生境面积表示生物多样性潜力，不能直接得出增加1ha就增加多少个物种，除非另有验证关系。", "exampleType": "synthetic-teaching"}, {"id": "nutrition", "en": "nutrient self-sufficiency", "zh": "营养素自给程度", "aliases": ["nutrient self-sufficiency", "nutritional self-sufficiency", "营养自给", "营养素自给", "营养素自给程度"], "definition": "以本地生产可提供的营养素量与定义人群需求量相比较的生产端指标。", "boundary": "不直接证明家庭消费、分配、可负担性或健康结果。", "sources": ["novotny-2024", "ditzler-2019"], "explanation": "先确定要比较的营养素、可供给人群和时期，再用生产量对照需要量。这主要是生产端核算，还没回答食物如何流通和分配。", "example": "某农场生产的蛋白质理论上覆盖家庭需求，不意味着所有成员实际饮食都足量，产品可能出售或分配不均。", "exampleType": "synthetic-teaching"}, {"id": "farmm3", "en": "FarmM3", "zh": "粪肥管理模块", "aliases": ["FarmM3", "粪肥管理模块"], "definition": "Qu2025与FarmDESIGN连接的粪肥链模块，用来比较相关管理对全农场指标的影响。", "sources": ["qu-2025"], "explanation": "把粪肥从产生、收集、储存到处理和施用看成一条链，比较各阶段损失和资源回收，再与全农场模型连接。", "example": "盖好储存池可能减少某种损失，但还要核算后续施用时是否发生新的排放，不能只看储存阶段。", "exampleType": "synthetic-teaching"}, {"id": "pollution", "en": "pollution swapping", "zh": "污染转移", "aliases": ["pollution swapping", "污染转移"], "definition": "减少一个阶段或一种形式的污染，同时可能增加另一阶段或形式的污染。需要完整边界核算。", "sources": ["qu-2025", "nutrients"], "explanation": "改变一种管理可能把损失从一个环节移到另一个环节。判断整体是否改善，需要在一致边界内检查多种污染途径。", "example": "储存阶段少挥发的氮可能在施用阶段排放；只报告前一阶段的下降可能高估整体改善。", "exampleType": "synthetic-teaching"}, {"id": "sensitivity", "en": "sensitivity analysis", "zh": "敏感性分析", "aliases": ["sensitivity analysis", "敏感性分析"], "definition": "分析输入改变如何影响输出或决策，以识别关键参数与假设。", "boundary": "不等于完整的不确定性传播或稳健性证明。", "sources": ["uncertainty", "breure-2024"], "explanation": "主动改变一个或多个输入，观察输出改变多少，回答结果对哪些假设最敏感。改变范围和其他条件是否固定必须写清楚。\n\n先规定改变哪些参数、改变多少、独立改变还是一起改变，再观察指标数值、方案排序或可行性是否变化。", "example": "把产品价格分别降低10%和提高10%，检查利润排序是否改变；这只是价格敏感性，不代表已经覆盖天气等全部风险。\n\n教学例：把作物价格分别下调和上调10%，比较同一农场方案是否仍被选中；排序改变说明结论依赖价格假设。", "exampleType": "synthetic-teaching"}, {"id": "uncertainty", "en": "uncertainty", "zh": "不确定性", "aliases": ["uncertainties", "uncertainty", "不确定性"], "definition": "对输入、结构、情景或结果认识不完全的状态。报告时说明来源、表达方式和未处理部分。", "sources": ["uncertainty", "breure-2024"], "explanation": "区分测量误差、参数估计误差、模型结构遗漏与未来情景未知。可以用区间、概率分布或不同情景表达，但每种表达都需要依据。", "example": "明年作物价格不知道，可以设置高低价格情景；若没有概率依据，不能把两个情景各自强行解释为50%的真实概率。", "exampleType": "synthetic-teaching"}, {"id": "robustness", "en": "robustness", "zh": "稳健性", "aliases": ["robustness", "稳健性"], "definition": "在一组明确扰动、参数或情景下，方案仍保持可接受表现的能力。必须说清‘对什么稳健’。", "sources": ["uncertainty"], "explanation": "先定义哪些情景要考虑，以及什么叫可接受，再检查方案能否在这些条件下保持表现。稳健方案可能牺牲最佳情景下的最高收益。", "example": "甲正常年利润更高，但干旱年亏损；乙两类年份都能满足最低收入。按最低收入标准，乙可能更稳健。", "exampleType": "synthetic-teaching"}, {"id": "resilience", "en": "resilience", "zh": "韧性", "aliases": ["resilience", "韧性"], "definition": "围绕系统承受扰动、恢复或调整的能力，具体操作定义需按研究说明。", "boundary": "不直接等同受扰动后获益的反脆弱性。", "sources": ["toorop-2023", "uncertainty"], "explanation": "看系统受到冲击后是否能维持关键功能、多久恢复，以及是否需要调整组织方式。韧性评价要有冲击和时间过程，不能只看一次静态排名。", "example": "一场干旱后，农场能否保住基本收入并在下一季恢复生产，是韧性问题；常年平均利润高并不能单独证明有韧性。", "exampleType": "synthetic-teaching"}, {"id": "antifragility", "en": "antifragility", "zh": "反脆弱性", "aliases": ["antifragility", "antifragile", "反脆弱性", "反脆弱"], "definition": "比保持或恢复表现更强的概念，强调在某种扰动或波动条件下系统能够改善。", "boundary": "需要比较基准与机制证据，灾后表现好并不足以单独证明。", "sources": ["toorop-2023"], "explanation": "反脆弱不仅是没有受损或能够恢复，而是某种波动或冲击使系统通过特定机制获得改善。需要说明比较基准、扰动范围和因果机制。", "example": "经历小规模可控试验后改进种植安排可能带来学习收益，但单次灾后丰收不能直接证明系统从灾害中受益。", "exampleType": "synthetic-teaching"}, {"id": "validation", "en": "model validation", "zh": "模型有效性检验", "aliases": ["model validation", "模型验证", "模型有效性检验"], "definition": "检验模型是否足以支持特定研究用途，常需与独立观测、过程知识和外推边界对照。", "boundary": "代码测试通过不等于科学预测可靠。", "sources": ["validation", "farmdesign-2012"], "explanation": "先明确模型被用于什么决策，再用独立数据、机制知识和错误检查判断是否够用。代码实现正确、参数拟合良好、外部预测可靠是不同层面。", "example": "用同一批数据调参数并展示拟合良好，不能当作独立验证；在未参与调参的年份检验预测更能揭示泛化问题。", "exampleType": "synthetic-teaching"}, {"id": "digitaltwin", "en": "digital twin", "zh": "数字孪生", "aliases": ["digital twins", "digital twin", "数字孪生"], "definition": "与特定真实对象及其状态或行为相联系的数字表示与使用框架。需说明对象、更新、模型和决策之间如何连接。", "boundary": "一张地图或漂亮看板不自动具备这些连接。", "sources": ["verdouw-2021"], "explanation": "把某个具体真实对象和可更新的数字表示联系起来，说明数据怎样进入、状态怎样更新、模型怎样预测或支持决策。不同应用的实时程度和反馈方式可以不同。", "example": "某块田的传感器数据更新其数字状态，模型据此提出灌溉建议；只有一张静态田块地图时，不能自动称为完整数字孪生。", "exampleType": "synthetic-teaching"}, {"id": "opportunity", "en": "opportunity cost", "zh": "机会成本", "aliases": ["opportunity costs", "opportunity cost", "机会成本"], "definition": "把有限资源用于一种活动时，放弃的其他可行用途的价值。家庭劳动投入农业时，可能放弃非农收入或其他活动。", "sources": ["ditzler-2019", "whole-farm"], "explanation": "有限资源一旦用于当前活动，就无法同时用于另一个可行活动。机会成本看的是放弃的最佳替代用途，而不只是实际支付的钱。", "example": "家庭成员花一天管理农田，若同一天有可实现的其他收入，就需要考虑放弃该收入的价值；不能假设没有现金支出就没有劳动成本。", "exampleType": "synthetic-teaching"}, {"id": "normalization", "en": "normalization", "zh": "标准化／归一化", "aliases": ["normalization", "normalisation", "标准化", "归一化", "标准化／归一化"], "definition": "把不同尺度的数据变成适合共同分析的表达；具体操作不止一种。", "explanation": "先检查作者使用Z分数、极差缩放还是其他方式。变换可以改变距离和权重关系，不能只写做了标准化。", "example": "极差缩放中，最小10、最大30，数值20变为(20−10)/(30−10)=0.5；Z分数则使用均值和标准差，不是同一个公式。", "exampleType": "synthetic-teaching", "sources": ["pca-cluster"]}, {"id": "euclidean", "en": "Euclidean distance", "zh": "欧氏距离", "aliases": ["Euclidean distance", "欧氏距离", "欧几里得距离"], "definition": "直角坐标空间中两点的直线距离。", "explanation": "各坐标差值平方相加再开根号。不同单位的轴常需先缩放，否则大数值尺度容易主导结果。", "example": "横向差3、纵向差4，直线距离为√(3²+4²)=5。", "exampleType": "synthetic-teaching", "sources": ["ideal-distance"]}, {"id": "manhattan", "en": "Manhattan distance", "zh": "曼哈顿距离", "aliases": ["Manhattan distance", "曼哈顿距离"], "definition": "各维度绝对差值的和。", "explanation": "像沿棋盘式街道走路，不能斜穿街区。它和欧氏距离使用不同几何，不应在复现时随意替换。", "example": "横向差3、纵向差4，曼哈顿距离为3+4=7，而欧氏距离为5。", "exampleType": "synthetic-teaching", "sources": ["pca-cluster"]}, {"id": "centroid", "en": "cluster centroid", "zh": "群组中心", "aliases": ["cluster centroid", "centroid", "群组中心", "聚类中心"], "definition": "常指组内对象在各变量上的平均坐标。", "explanation": "先按变量求组内平均，再组成代表这个组的点。中心可能并不是某个实际观测对象。\n\n把同组所有农场的利润求平均，再把用水求平均，依次得到一个完整指标组合。比较群组中心可以看总体特征，但还必须检查组内差异。", "example": "两农场坐标(10,2)、(20,4)，均值中心是(15,3)。\n\n教学例：两农场的利润是80和120，用水是40和60，中心为利润100、用水50；不能据此说两个农场都恰好是100和50。", "exampleType": "synthetic-teaching", "sources": ["ideal-distance"], "boundary": "平均中心与实际代表样本不同；偏斜分布或离群点会影响平均值。"}, {"id": "indicator", "en": "indicator", "zh": "指标", "aliases": ["indicators", "indicator", "评价指标", "绩效指标", "指标"], "definition": "用于表达某一方面状态或表现的量。", "explanation": "每个指标都应有定义、单位、时间面积口径、改善方向和数据来源。指标值高不一定好。", "example": "利润通常希望更高，氮损失通常希望更低；比较前应先写清方向。", "exampleType": "synthetic-teaching", "sources": ["indicators"]}, {"id": "objective", "en": "objective function", "zh": "目标函数", "aliases": ["objective function", "objectives", "优化目标", "目标函数"], "definition": "把希望改善的结果写成可计算的表达。", "explanation": "目标函数根据决策变量和参数计算某个表现，再指定最大化或最小化。它不等于硬性约束。", "example": "在面积和劳动限制内最大化收入；劳动不超100小时则是约束。", "exampleType": "synthetic-teaching", "sources": ["whole-farm"]}, {"id": "parameter", "en": "model parameter", "zh": "模型参数", "aliases": ["model parameters", "model parameter", "parameters", "parameter", "模型参数"], "definition": "在当前计算或情景中给定的量。", "explanation": "参数可以来自测量、文献或校准。改变参数可能改变结果，所以应记录来源与范围。", "example": "作物价格设为2元/kg，这是当前情景的参数，不是模型优化出来的答案。", "exampleType": "synthetic-teaching", "sources": ["whole-farm"]}, {"id": "baseline", "en": "baseline", "zh": "基准方案", "aliases": ["baseline scenario", "baseline plan", "baseline", "基准方案", "基准情景"], "definition": "用于比较改进程度的参照状态或方案。", "explanation": "先检查基准是真实当前管理、历史平均还是作者设计的假设；百分比改善都依赖基准。", "example": "基准利润100，方案利润120，增加20%；换用基准110，增幅就约9.1%。", "exampleType": "synthetic-teaching", "sources": ["farmsteps-2026"]}, {"id": "scenario", "en": "scenario", "zh": "情景", "aliases": ["scenarios", "scenario", "情景分析", "情景"], "definition": "一组共同描述某种可能条件的假设。", "explanation": "情景可以探索未来，不一定是预测，也不一定带有发生概率。应清楚列出改变了什么。\n\n写明改变了价格、气候、技术或政策中的哪些量，哪些量保持不变，再比较方案是否仍然可行、结论是否稳定。", "example": "低价情景假设价格降低20%，其他条件固定；它回答假如低价会怎样，不直接预测价格。\n\n教学例：分别考察正常水价、水价上涨20%两个假设。第二种是假设条件下的计算，不是预测水价一定上涨20%。", "exampleType": "synthetic-teaching", "sources": ["uncertainty"], "boundary": "概率预测、压力测试和情景比较应区别表述。"}, {"id": "calibration", "en": "model calibration", "zh": "模型校准", "aliases": ["model calibration", "calibration", "模型校准", "参数校准"], "definition": "用一定资料调整模型参数，使其符合选定的观测或目标。", "explanation": "校准用过的数据不是独立验证数据。拟合更好也可能来自过多参数，而非更真实的机制。", "example": "用2020—2023年产量调参数，再以2024年未用过的数据检验预测。", "exampleType": "synthetic-teaching", "sources": ["validation"]}, {"id": "correlation", "en": "correlation", "zh": "相关关系", "aliases": ["correlation", "correlations", "相关关系", "相关性"], "definition": "两个量在数据中共同变化的统计关系。", "explanation": "相关可以来自直接作用、共同原因、选择偏差或偶然；不能只凭相关确定因果方向。", "example": "大农场的肥料总量和总产量可能都高，原因可能是面积更大，而不只是多施肥导致高产。", "exampleType": "synthetic-teaching", "sources": ["survey"]}, {"id": "causality", "en": "causal effect", "zh": "因果效应", "aliases": ["causal effect", "causal effects", "causality", "因果效应", "因果关系"], "definition": "改变一个因素本身所引起的结果变化。", "explanation": "需要能够支持因果识别的研究设计和假设；普通观测差异不自动满足。", "example": "高产农户和低产农户还可能在土壤、资金上不同，不能把两者产量差全部归因于施肥。", "exampleType": "synthetic-teaching", "sources": ["survey"]}, {"id": "confounding", "en": "confounding", "zh": "混杂", "aliases": ["confounding", "confounder", "confounders", "混杂因素", "混杂变量", "混杂"], "definition": "其他因素同时影响研究中的解释因素和结果，使关联难以直接解释。", "explanation": "先画清可能的作用路径，再决定设计或分析如何处理；增加控制变量也不是万能解决办法。\n\n观察到某类管理更好的农场产量更高，还要问这些农场是否也有更好的土壤、资金或劳动力条件。不能仅凭分组平均差异断言某措施造成增产。", "example": "灌溉条件好的农户既可能多施肥又更高产，灌溉可能混杂施肥与产量的关系。\n\n教学例：受培训的农户产量高，但他们原本可能设备更好。产量差异不能全部归因于培训，除非研究设计和分析能支持这种解释。", "exampleType": "synthetic-teaching", "sources": ["survey"], "boundary": "识别了潜在混杂并不等于已经消除了它；统计调整也依赖假设和数据。"}, {"id": "unit-analysis", "en": "unit of analysis", "zh": "分析单位", "aliases": ["unit of analysis", "analysis unit", "分析单位"], "definition": "统计分析中一行记录代表的对象。", "explanation": "受访者、地块、村庄、年份可能是不同层级。数据收集层级和最终分析层级要分清。", "example": "调查100名农户后计算10个村的平均值，再做模型时分析单位是村，不是100个独立农户。", "exampleType": "synthetic-teaching", "sources": ["survey"]}, {"id": "sample-size", "en": "sample size", "zh": "样本量", "aliases": ["sample size", "样本量"], "definition": "研究中参与相应分析的观测数量。", "explanation": "先看数量对应人、地块、时期还是组合；同一个人的多次测量并不自动独立。", "example": "20户每户记录5块地，有100块地记录，但不能直接当作100户独立农户。", "exampleType": "synthetic-teaching", "sources": ["survey"]}, {"id": "uncertainty-propagation", "en": "uncertainty propagation", "zh": "不确定性传播", "aliases": ["uncertainty propagation", "不确定性传播"], "definition": "输入的不确定性经模型计算传到输出。", "explanation": "给输入指定有依据的范围或分布，再观察输出范围。范围来源和输入相关性会影响结果。", "example": "产量与价格都不确定，利润分布取决于二者的联合变化，而不是只改变一个平均值。", "exampleType": "synthetic-teaching", "sources": ["uncertainty"]}, {"id": "monte-carlo", "en": "Monte Carlo simulation", "zh": "蒙特卡洛模拟", "aliases": ["Monte Carlo simulation", "Monte Carlo", "蒙特卡洛模拟"], "definition": "按设定规则重复随机抽样并计算，以探索结果的分布。", "explanation": "抽样次数多只能减少计算抽样误差，不能弥补输入分布或模型假设错误。", "example": "反复抽取产量和价格组合，计算1000次利润，观察亏损频率；频率解释依赖抽样分布。", "exampleType": "synthetic-teaching", "sources": ["uncertainty"]}, {"id": "lca", "en": "life cycle assessment", "zh": "生命周期评价", "aliases": ["life cycle assessment", "life-cycle assessment", "LCA", "生命周期评价"], "definition": "在明确生命周期边界内核算资源使用与环境影响的方法。", "explanation": "需定义功能单位、边界、清单和影响类别；只报告田间排放不能默认覆盖生产运输等上游环节。", "example": "比较每kg粮食与每ha农田的排放是两种功能单位，可能得到不同排序。", "exampleType": "synthetic-teaching", "sources": ["indicators"]}, {"id": "functional-unit", "en": "functional unit", "zh": "功能单位", "aliases": ["functional unit", "功能单位"], "definition": "环境核算或比较所依据的一定量功能或服务。", "explanation": "它回答结果是为多少产品或服务计算的，影响不同系统能否公平比较。", "example": "每kg粮食的排放衡量产品效率；每ha的排放衡量面积负担，两者不是同一个问题。", "exampleType": "synthetic-teaching", "sources": ["indicators"]}, {"id": "eutrophication", "en": "eutrophication", "zh": "富营养化", "aliases": ["eutrophication", "aquatic eutrophication", "富营养化"], "definition": "水体营养物输入增加引起的一类生态变化与环境问题。", "explanation": "论文可能报告潜在影响指标而非实测水华。应分清排放量、换算潜势和真实水体反应。", "example": "施肥产生的营养物流失可能增加水体富营养化压力，但一个潜势分数不能直接换成水华面积。", "exampleType": "synthetic-teaching", "sources": ["farmsteps-2026"]}, {"id": "carbon-sequestration", "en": "carbon sequestration", "zh": "固碳", "aliases": ["carbon sequestration", "soil carbon sequestration", "固碳", "土壤固碳"], "definition": "把碳转移并保留在相应存量中的过程。", "explanation": "应说明碳储存在何处、维持多久、相对于什么基准，以及是否计算其他环节排放。", "example": "秸秆还田可能增加土壤碳输入；输入增加不等于全部碳都长期留存在土壤。", "exampleType": "synthetic-teaching", "sources": ["indicators"]}, {"id": "nue", "en": "nitrogen use efficiency", "zh": "氮利用效率", "aliases": ["nitrogen use efficiency", "NUE", "氮利用效率"], "definition": "衡量氮投入与有效产出关系的一组指标的统称。", "explanation": "不同论文可能采用产量/施氮量、氮输出/氮输入等定义，需核对分子分母。", "example": "氮输出100kg、输入200kg时按该收支定义为50%；不能自动替换成肥料吸收率。", "exampleType": "synthetic-teaching", "sources": ["nutrients"]}, {"id": "feasible", "en": "feasible solution", "zh": "可行方案", "aliases": ["feasible solutions", "feasible solution", "feasible plans", "可行方案", "可行域"], "definition": "满足模型所列全部约束的方案。", "explanation": "可行只说明在当前假设内不违规，不代表优于其他方案或现实一定能实施。", "example": "某计划面积和劳动都未超限，属于可行；它仍可能利润很低而被更好方案支配。", "exampleType": "synthetic-teaching", "sources": ["whole-farm"]}, {"id": "longitudinal", "en": "longitudinal constraints", "zh": "纵向约束（作物序列）", "aliases": ["longitudinal constraints", "longitudinal constraint", "纵向约束", "纵向约束（作物序列）"], "definition": "FarmSTEPS语境中约束同一地块随时间安排的规则。", "explanation": "关注同一块地前后作物之间的限制；不要和同一时期全农场横向约束混淆。", "example": "规定同一块地不能连续种某作物，检查的是该地块的时间序列。", "exampleType": "synthetic-teaching", "sources": ["farmsteps-2026"]}, {"id": "transversal", "en": "transversal constraints", "zh": "横向约束（全农场）", "aliases": ["transversal constraints", "transversal constraint", "横向约束", "横向约束（全农场）"], "definition": "FarmSTEPS语境中对同一时期或农场整体进行的共同限制。", "explanation": "多个地块单独可行，合并后仍要核查劳动、总产量或其他全农场上限。", "example": "两块地各需60小时劳动，而一期全农场上限100小时；不能同时实施。", "exampleType": "synthetic-teaching", "sources": ["farmsteps-2026"]}, {"id": "land-unit", "en": "land unit", "zh": "土地单元", "aliases": ["land-units", "land unit", "land units", "land-unit", "土地单元"], "definition": "模型中按一定属性或可选活动组织土地的表达单位。", "explanation": "土地单元的定义取决于论文，不能默认就是独立地块或土壤类型。", "example": "同类土地单元可以关联多个地块；地块的位置和面积仍可不同。", "exampleType": "synthetic-teaching", "sources": ["farmsteps-2026"]}, {"id": "planning-window", "en": "planning window", "zh": "规划窗口", "aliases": ["planning window", "planning horizon", "规划窗口", "规划期"], "definition": "模型探索未来活动安排的总时间范围。", "explanation": "规划窗口包括多个决策或评价时期，长短决定能看见哪些轮作和资源关系。", "example": "总窗口3年，每年评价一次，则有3个年度规划时期；不能说只有3个作物季。", "exampleType": "synthetic-teaching", "sources": ["farmsteps-2026"]}, {"id": "crop-sequence", "en": "crop sequence", "zh": "作物序列", "aliases": ["crop sequence", "crop sequences", "crop-sequence", "crop-sequences", "作物序列"], "definition": "同一地块按时间先后发生的一串作物活动。", "explanation": "序列可以非循环；轮作方案往往另有重复周期或闭合要求。应按论文定义区分。", "example": "三年序列可以以某作物开始并以同种作物结束，若首尾闭合后违反连作规则，它可能不是可循环轮作。", "exampleType": "synthetic-teaching", "sources": ["farmsteps-2026"]}, {"id": "frontier", "en": "Pareto front", "zh": "帕累托前沿", "aliases": ["Pareto front", "Pareto frontier", "Pareto-optimal", "Pareto optimality", "帕累托前沿", "非支配前沿"], "definition": "在多目标空间中由当前非支配方案构成的边界或集合。", "explanation": "前沿形状帮助讨论目标取舍；有限候选或近似搜索得到的前沿不一定等于全部真实可能性。", "example": "在利润—用水图上，保留既没有更高利润又更少用水的竞争方案压过的点。", "exampleType": "synthetic-teaching", "sources": ["pareto"]}, {"id": "range-scaling", "en": "Range scaling", "zh": "极差标准化", "aliases": ["range-scaled", "range scaling", "极差标准化"], "definition": "用一列指标的最大值减最小值得到极差，再用它缩放差异，使不同单位的指标能够放在可比较的尺度上。", "explanation": "原来利润差10元和用水差10立方米没有相同意义。分别除以各自的范围后，表达的是在当前比较范围中相差了多大比例。", "example": "教学例：利润最小50、最大150，某群组中心130，离最佳值150的差距为20，标准化距离为20/100=0.2。", "boundary": "极差为零时不能直接除；极端值、比较范围改变都会影响结果，标准化也不自动代表没有价值判断。", "sources": ["liang-2022"], "scope": "original beginner teaching; synthetic examples are not article data"}, {"id": "standard-deviation", "en": "Standard deviation", "zh": "标准差", "aliases": ["standard deviation", "标准差"], "definition": "用来描述一组数围绕平均值分散得有多开的量，单位与原变量相同。数越集中，标准差通常越小。", "explanation": "先求平均值，再看每个数与平均值的差，平方后合计，按相应分母平均，再开平方。样本标准差通常使用n−1，不能在复现时把论文指定的分母擅自改成n。", "example": "教学例：2、2、2完全相同，标准差为0；0、2、4平均值仍为2，但更分散。HDIP中比较的是各指标到理想点的距离，而不是利润原始值。", "boundary": "标准差小只说明数值接近，不说明表现好；各项同样差也可能很均衡。", "sources": ["liang-2022"], "scope": "original beginner teaching; synthetic examples are not article data"}, {"id": "system-boundary", "en": "System boundary", "zh": "系统边界", "aliases": ["system boundary", "system boundaries", "系统边界"], "definition": "明确一次评价把哪些活动、投入产出、空间范围和时间范围算进去，以及哪些不算。", "explanation": "比较农场排放前，应先确认是否都包括化肥生产、运输、田间排放和土壤变化；如果边界不一致，相同名称的指标也未必可比。", "example": "教学例：只算田间燃油与把化肥制造排放也计入，得到的温室气体总量通常不同；这首先是统计边界不同，不是计算器出了错。", "boundary": "边界要按原文说明，未报告的环节不能由读者自行补成已经包含。", "sources": ["liang-2022", "farmdesign-2012"], "scope": "original beginner teaching; synthetic examples are not article data"}]};

function validRef(r){return r&&typeof r.id==='string'&&/^[\w:-]{1,160}$/.test(r.id)&&typeof r.title==='string'&&r.title.length<5000&&(!r.landing||safeURL(r.landing))&&(!r.candidates||Array.isArray(r.candidates)&&r.candidates.every(c=>safeURL(c.url)));}

async function importMetadata(){try{const [f]=await select('.json');if(!f)return;if(f.size>20000000)throw Error('元数据备份不能超过20MB');const x=JSON.parse(await f.text());if(x.schema!=='paper.workspace.backup.v4')throw Error('不是文献库备份');for(const n of ['references','workbooks','terms'])if(!Array.isArray(x[n])||x[n].length>10000)throw Error('备份格式不完整');await mergeRecords('references',x.references);await mergeRecords('workbooks',x.workbooks);await mergeRecords('terms',x.terms);notice('已合并，冲突项保留副本。');go('#/my-library');}catch(e){notice('导入失败：'+e.message);}}
function parseCitations(text){if(text.length>5000000)throw Error('文献列表过大');const out=[];if(/^TY\s*-/m.test(text)){for(const record of text.split(/^ER\s*-.*$/m)){const f={};for(const m of record.matchAll(/^([A-Z0-9]{2})\s*-\s*(.*)$/gm))(f[m[1]]||=[]).push(m[2]);const title=(f.TI||f.T1||[])[0];if(title)out.push({title,doi:doi(f.DO?.[0]),authors:f.AU||f.A1||[],year:(f.PY||f.Y1||[''])[0].slice(0,4),journal:(f.JO||f.JF||f.T2||[''])[0],landing:safeURL(f.UR?.[0]),source:'RIS',candidates:[],licenses:[]});}}else{let i=0;while(i<text.length){const at=text.indexOf('@',i);if(at<0)break;const start=text.indexOf('{',at),comma=text.indexOf(',',start);if(start<0||comma<0)break;let depth=1,end=start+1,escape=false;for(;end<text.length&&depth;end++){const c=text[end];if(escape){escape=false;continue;}if(c==='\\'){escape=true;continue;}if(c==='{')depth++;if(c==='}')depth--;}const body=text.slice(comma+1,end-1),f={};let pos=0;while(pos<body.length){const m=body.slice(pos).match(/(?:^|,)\s*([\w-]+)\s*=\s*/);if(!m)break;pos+=m.index+m[0].length;let value='',c=body[pos++];if(c==='{'||c==='"'){let d=1;for(;pos<body.length&&d;pos++){const x=body[pos];if(x==='\\'&&pos+1<body.length){value+=x+body[++pos];continue;}if(c==='{'&&x==='{')d++;if(c==='{'&&x==='}'||c==='"'&&x==='"')d--;if(d)value+=x;}}else{pos--;const n=body.indexOf(',',pos);value=body.slice(pos,n<0?body.length:n);pos=n<0?body.length:n;}f[m[1].toLowerCase()]=value.replace(/[{}]/g,'').trim();}if(f.title)out.push({title:f.title,doi:doi(f.doi),authors:(f.author||'').split(/\s+and\s+/).filter(Boolean),year:f.year||'',journal:f.journal||f.booktitle||'',landing:safeURL(f.url),source:'BibTeX（常见字段，宏未展开）',candidates:[],licenses:[]});i=end;}}if(out.length>500)throw Error('最多500条引用，请分批');return out;}

function searchPage(query){const q=query.trim().toLowerCase();const hits=q?docs.filter(d=>JSON.stringify(d).toLowerCase().includes(q)):[];return head('全站搜索',q?`“${query}” · ${hits.length}条结果；搜索包含全文、作者、术语和自测。`:'输入论文名、作者或卡住的概念。')+(hits.length?cards(hits):'<div class="empty">没有匹配项。可尝试 Pareto、梁政渊、Q方法、劳动力等词。</div>');}

function offline(){return head('离线与下载','先联网保存，再测试飞行模式。包括已归档的原文、图表、阅读器、术语释义和本机翻译引擎。尚未取得或不允许转载的资料需本机导入。')+`<section class="card"><h2>01 · 保存网站到这台手机</h2><p>正文、搜索、方法、完整原文与全部原图一起保存；浏览器可能清理缓存，请同时下载备份。</p><div class="actions"><button class="primary" id="cache-site">缓存完整网站</button><button id="check-cache">检查离线状态</button><button id="check-update">检查新版本</button><button id="install-app">安装 / 添加到主屏幕</button></div><p id="cache-status" role="status">${location.protocol==='file:'?'当前为本地单文件：正文和教学无需联网。':'等待检查缓存状态。'}</p></section><section class="card"><h2>02 · 下载独立备份</h2><p>单文件HTML包含带读和教学；原文、原图及PDF在原文分卷与完整缓存中，不包含在这个轻量单文件内。手机系统若仅显示文件预览，请优先使用已缓存的网站或添加到主屏幕。</p><div class="actions"><a class="btn" href="./Paper-Lab-offline.html" download>离线单文件HTML</a><a class="btn secondary" href="./Paper-Lab-offline.zip" download>基础网站与练习ZIP</a><a class="btn secondary" href="./index.html">下载全部原文分卷</a><button data-action="export">学习笔记JSON</button></div><p><a href="#/annotations">划线批注和便签备份</a> · <a href="#/offline-help">完整使用说明 →</a></p></section><section class="card"><h2>03 · 教学数据与可运行脚本</h2><p>所有数据均为明确标记的自编教学示例，不能用来重现作者原始样本数量与论文结果。</p><div class="downloadlist">${Object.keys(D.files||{}).map(name=>`<button data-file="${esc(name)}">${esc(name)}<small>从当前页面内嵌数据下载，已缓存或单文件状态下也可使用。</small></button>`).join('')}</div></section>`;}
let farmRows=[['A',100,30,80],['B',80,40,100],['C',120,50,90],['D',90,20,70],['E',100,30,80],['F',110,35,120]];
function lab(){return head('交互实验室','自编小数据。先猜结果，再改变条件，最后用代码验证。不是作者原始数据，也不是农业处方。')+`<section class="card"><h2>实验1 · 手动改变Pareto前沿</h2><p>利润提高，用水和劳动减少。点击目标开关，比较前沿如何变化。数值均为无实际单位的教学分数。</p><div class="labcontrols"><label><input class="objective" type="checkbox" value="1" checked>利润 ↑</label><label><input class="objective" type="checkbox" value="2" checked>用水 ↓</label><label><input class="objective" type="checkbox" value="3" checked>劳动 ↓</label></div><div class="tablewrap"><table class="labtable"><thead><tr><th>方案</th><th>利润</th><th>用水</th><th>劳动</th><th>结果</th></tr></thead><tbody>${farmRows.map((r,i)=>`<tr><td>${r[0]}</td>${r.slice(1).map((v,j)=>`<td><input type="number" value="${v}" step="1" data-farm="${i}" data-col="${j+1}" aria-label="方案${r[0]}指标${j+1}"></td>`).join('')}<td id="result-${i}"></td></tr>`).join('')}</tbody></table></div><p id="pareto-result" role="status"></p><svg id="pareto-plot" class="labplot" viewBox="0 0 640 300" role="img" aria-label="利润与用水二维投影；筛选依据所勾选目标"></svg><p><small>二维图只画利润和水，不代表劳动目标不存在。完全重复方案不会互相严格支配。</small></p><a href="#/pareto">返回定义 →</a></section><section class="card"><h2>实验2 · 20张卡片，不能全部选最重要</h2><p>用自编陈述体验Q-sort，五档位置必须为2–4–8–4–2。它不是程嘉莉原问卷，也不会产生有效科学观点分类。</p><div class="qgrid" id="q-counts"></div><div class="qchoices">${['稳定收入','减少用水','更多食物','减少氮损失','减少工作时长','保留景观','土壤肥力','减少化学投入','低投资成本','家庭时间','生物多样性','风险缓冲','学习机会','文化传统','非农机会','产品品质','易于管理','市场稳定','资源循环','未来灵活性'].map((t,i)=>`<label class="qrow">${i+1}. ${t}<select class="q-select" aria-label="${t}排序"><option value="">未选</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${n}分</option>`).join('')}</select></label>`).join('')}</div><p id="q-result" role="status"></p><button id="export-q">导出这次教学排序</button><p><a href="#/q-method">Q-sort如何成为典型观点？ →</a></p></section>`;}
function updatePareto(){const cols=$$('.objective:checked').map(n=>Number(n.value));let valid=farmRows.every(r=>r.slice(1).every(Number.isFinite));if(!valid||!cols.length){$('#pareto-result').textContent='请填写全部有限数值，并至少选择一个目标。';return;}const cost=r=>cols.map(k=>r[k]*(k===1?-1:1));const nd=farmRows.map((r,i)=>!farmRows.some((s,j)=>j!==i&&cost(s).every((v,k)=>v<=cost(r)[k])&&cost(s).some((v,k)=>v<cost(r)[k])));farmRows.forEach((r,i)=>{$('#result-'+i).textContent=nd[i]?'非支配':'被支配';$('#result-'+i).className=nd[i]?'good':'bad';});$('#pareto-result').textContent='当前非支配方案：'+farmRows.filter((_,i)=>nd[i]).map(r=>r[0]).join('、');const xs=farmRows.map(r=>r[1]),ys=farmRows.map(r=>r[2]),xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);const px=v=>55+(v-xmin)/(xmax-xmin||1)*520,py=v=>245-(v-ymin)/(ymax-ymin||1)*195;$('#pareto-plot').innerHTML=`<path d="M45 30V255H605" stroke="currentColor" fill="none"/><text x="510" y="285" fill="currentColor" font-size="13">利润 ↑</text><text x="8" y="20" fill="currentColor" font-size="13">用水</text>${farmRows.map((r,i)=>`<circle cx="${px(r[1])}" cy="${py(r[2])}" r="${nd[i]?7:5}" fill="${nd[i]?'var(--accent)':'var(--muted)'}" opacity=".7"/><text x="${px(r[1])+9}" y="${py(r[2])-8+i%2*20}" font-size="13" fill="currentColor">${r[0]}</text>`).join('')}`;}
function updateQ(){const values=$$('.q-select').map(s=>Number(s.value)),counts=[1,2,3,4,5].map(n=>values.filter(v=>v===n).length),cap=[2,4,8,4,2];$('#q-counts').innerHTML=counts.map((n,i)=>`<div class="qcol"><span>${i+1}分</span><strong>${n} / ${cap[i]}</strong></div>`).join('');const ok=counts.every((n,i)=>n===cap[i]);$('#q-result').textContent=ok?'排序符合网格。请进一步解释两端卡片的选择理由；这不是观点因子分析。':'请调整到2–4–8–4–2；未完成'+values.filter(v=>v===0).length+'张。';}
async function cacheAll(){const r=await navigator.serviceWorker.ready;const w=r.active;if(!w)throw Error('离线服务未激活');return new Promise((resolve,reject)=>{const ch=new MessageChannel(),t=setTimeout(()=>reject(Error('缓存超时，已下载内容保留')),900000);ch.port1.onmessage=e=>{const x=e.data;if(x.type==='PROGRESS')$('#cache-status').textContent=`正在缓存原文与图表 ${x.done}/${x.total}，请保持网络。`;if(x.type==='DONE'){clearTimeout(t);$('#cache-status').textContent=x.complete?`已完整缓存 ${x.count} 个资源，可测试断网刷新。`:`部分资源未完成（${x.count}/${x.expected}），请联网重试；已缓存内容保留。`;resolve(x);}};w.postMessage({type:'CACHE_ALL'},[ch.port2]);});}
async function cacheStatus(){const el=$('#cache-status');if(!el)return;if(!('serviceWorker' in navigator)||location.protocol==='file:'){el.textContent='本地单文件无需缓存；服务工作线程仅适用于HTTPS或localhost。';return;}try{registration=await navigator.serviceWorker.ready;const worker=registration.active;if(!worker)throw Error('服务工作线程尚未激活');const result=await new Promise((resolve,reject)=>{const ch=new MessageChannel();const timer=setTimeout(()=>reject(Error('缓存状态检查超时')),30000);ch.port1.onmessage=e=>{clearTimeout(timer);resolve(e.data);};worker.postMessage({type:'STATUS'},[ch.port2]);});el.textContent=result.complete?`已完整缓存 ${result.count} 个本站资源，可测试断网刷新。版本 ${result.version}。已归档原文、图表和原件已包含；未取得的外链不在其中。`:`缓存不完整（${result.count}/${result.expected}）。请联网后重试。`; }catch(e){el.textContent='未确认缓存完成：'+e.message;}}
function bind(){const d=byId.get(route.split('/')[0]);if($('#note'))$('#note').oninput=e=>{if(e.isComposing)return;store.notes[d.id]=e.target.value;$('#note-status').textContent=persist()?'已保存到本设备。':'保存失败，请立即导出笔记备份。';};if($('#done'))$('#done').onchange=e=>{store.done[d.id]=e.target.checked;persist();};if($('#print'))$('#print').onclick=()=>window.print();$$('[data-font]').forEach(b=>b.onclick=()=>{store.font=Math.min(23,Math.max(15,(store.font||17)+Number(b.dataset.font)));document.documentElement.style.setProperty('--body-size',store.font+'px');persist();});$$('[data-filter]').forEach(b=>b.onclick=()=>{$$('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));const type=route==='methods'?'method':'paper';let arr=docs.filter(d=>type==='method'?d.type==='method':['paper','thesis'].includes(d.type));const f=b.dataset.filter;if(f!=='all')arr=arr.filter(d=>JSON.stringify(d).includes(f)||(f==='博士'&&d.type==='thesis'));$('#catalog').innerHTML=cards(arr);});$$('[data-action="export"]').forEach(b=>b.onclick=()=>download('Paper-Lab-notes.json',JSON.stringify({schema:'paper-lab-learning-v1',exportedAt:new Date().toISOString(),data:store},null,2),'application/json'));$$('[data-action="import"]').forEach(b=>b.onclick=()=>$('#import-file').click());$$('[data-file]').forEach(b=>b.onclick=()=>download(b.dataset.file,D.files[b.dataset.file]));if($('#cache-site'))$('#cache-site').onclick=async()=>{if(location.protocol==='file:'){toast('当前单文件已可离线阅读。');return;}$('#cache-status').textContent='正在准备，请保持网络连接…';try{if(navigator.storage?.persist)await navigator.storage.persist();await navigator.serviceWorker.ready;await cacheAll();}catch(e){$('#cache-status').textContent='缓存失败：'+e.message;}};if($('#check-cache'))$('#check-cache').onclick=cacheStatus;if($('#check-update'))$('#check-update').onclick=async()=>{try{const r=registration||await navigator.serviceWorker.getRegistration();if(!r){toast('当前环境不支持在线更新；请下载新离线文件。');return;}await r.update();toast(r.waiting?'发现新版本，请使用底部更新按钮。':'已检查。内容发布后会检测到新版本。');}catch{toast('暂时无法连接，请保留现有离线内容。');}};if($('#install-app'))$('#install-app').onclick=async()=>{if(installEvent){await installEvent.prompt();installEvent=null;}else toast('Android使用浏览器“安装应用/添加到主屏幕”；iPhone使用Safari分享菜单“添加到主屏幕”。');};if(route==='lab'){updatePareto();updateQ();$$('.objective').forEach(e=>e.onchange=updatePareto);$$('[data-farm]').forEach(e=>e.oninput=()=>{farmRows[+e.dataset.farm][+e.dataset.col]=e.value.trim()===''?NaN:Number(e.value);updatePareto();});$$('.q-select').forEach(e=>e.onchange=updateQ);$('#export-q').onclick=()=>download('teaching-qsort.json',JSON.stringify({label:'SYNTHETIC TEACHING EXERCISE; NOT RESEARCH DATA',scores:$$('.q-select').map(e=>Number(e.value)||null)},null,2),'application/json');}}
function render(restore=false){window.PaperComfort?.close();window.PaperReader?.beforeNavigate();route=decodeURIComponent(location.hash.replace(/^#\/?/,''))||'home';const [id,section]=route.split('/');window.PaperWorkspace?.leave();if(id==='sync'){window.PaperReader?.leave();window.PaperStudy?.leave();$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');$('#breadcrumb').textContent='GitHub 私有同步';document.title='私有同步 · Paper Lab';window.PaperSync.render().catch(e=>toast(e.message));scrollTo(0,0);return;}if(['discover','my-library','workbook','glossary'].includes(id)){window.PaperReader?.leave();window.PaperStudy?.leave();$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');document.title='个人论文工作区 · Paper Lab';$('#breadcrumb').textContent='检索 · 导入 · 阅读';$$('.sidebar a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#/'+id));window.PaperWorkspace.route(id,route.split('/'),restore?(history.state?.y||0):0);scrollTo(0,0);return;}if(['original','annotations','resources'].includes(id)){$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');window.PaperReader.route(id,route.split('/'));return;}window.PaperReader?.leave();document.title=(byId.get(id)?.title||'农业系统论文带读')+' · Paper Lab';$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');$$('.sidebar a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#/'+id));$('#breadcrumb').textContent=byId.get(id)?.stage||'学习工作台';let out;if(id==='home')out=home();else if(['library','methods'].includes(id))out=library(id);else if(id==='notes')out=notes();else if(id==='offline')out=offline();else if(id==='lab')out=lab();else if(id==='search')out=searchPage(section||'');else if(byId.has(id))out=article(byId.get(id));else out=head('没有找到这篇内容','链接可能来自另一版本。')+link('home','返回学习总览');const y=restore?(history.state?.y||0):0;restoreLock=true;$('#view').innerHTML=out;bind();window.PaperReader?.attachLesson();requestAnimationFrame(()=>{if(restore)scrollTo(0,y);else if(section&&document.getElementById(section))document.getElementById(section).scrollIntoView();else scrollTo(0,0);requestAnimationFrame(()=>{restoreLock=false;savePosition();});});}
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button!==0)return;const href=a.getAttribute('href');if(href?.startsWith('#/')){e.preventDefault();go(href);}});
$('#search-form').onsubmit=e=>{e.preventDefault();go('#/search/'+encodeURIComponent($('#search').value));};
$('#menu').onclick=()=>{const on=$('#sidebar').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(on));};
$('#theme').onclick=()=>{store.dark=!document.body.classList.contains('dark');document.body.classList.toggle('dark',store.dark);persist();};
$('#back').onclick=()=>{savePosition();if(history.length>1)history.back();else go('#/home');};

$('#import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>4e6)throw Error('备份超过4MB');const obj=JSON.parse(await f.text());if(obj.schema!==KEY||!obj.data||typeof obj.data!=='object')throw Error('不是本站学习备份');for(const k of ['notes','done','positions'])for(const [id,v] of Object.entries(obj.data[k]||{})){if(!byId.has(id))continue;if(k==='notes'&&typeof v==='string'){if(store.notes[id]&&store.notes[id]!==v)store.notes[id]+='\n\n--- 导入的笔记 ---\n'+v;else store.notes[id]=v;}if(k==='done'&&typeof v==='boolean')store.done[id]=!!store.done[id]||v;if(k==='positions'&&v&&typeof v.route==='string'&&v.route.startsWith('#/'+id)&&Number.isFinite(v.y))store.positions[id]={route:v.route,y:Math.max(0,v.y),at:v.at||0};}persist();render(true);toast('已合并；现有笔记不会被静默覆盖。');}catch(err){toast('导入失败：'+err.message);}e.target.value='';};
window.addEventListener('paper-sync-applied',()=>{try{const fresh=JSON.parse(localStorage.getItem(KEY)||'{}');for(const name of ['notes','done','positions'])if(!fresh[name]||typeof fresh[name]!=='object')fresh[name]={};store=fresh;persistedBaseline=JSON.parse(JSON.stringify(fresh));}catch{toast('云端检查点已保存，但当前学习笔记未能重新载入；请保留备份。');}});
window.addEventListener('popstate',()=>render(true));window.addEventListener('hashchange',()=>{if(decodeURIComponent(location.hash.replace(/^#\/?/,''))!==route)render(false);});
let scrollTimer;window.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(savePosition,130);},{passive:true});window.addEventListener('pagehide',savePosition);
const net=()=>{const n=$('#network');n.textContent=navigator.onLine?'在线 / 可缓存':'离线阅读';n.classList.toggle('off',!navigator.onLine);};window.addEventListener('online',net);window.addEventListener('offline',net);net();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;});
$('#priority').innerHTML=['liang-2022','liang-2023','farmsteps-2026','cheng-2023','cheng-2025','xu-2024'].map(id=>link(id,byId.get(id)?.title)).join('');$('#version').textContent='内容版本 '+D.version+' · '+D.updated;
document.body.classList.toggle('dark',store.dark??matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.style.setProperty('--body-size',(store.font||17)+'px');if(!history.state?.pl)history.replaceState({pl:true,y:0},'',location.href);window.PaperReader.init({go,toast,byId,route:()=>route});render(true);
window.PaperRelease.init({savePosition});
})();
