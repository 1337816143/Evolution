<script>window.PAPER_DATA={"version": "9a23d6e568bc", "sourceCommit": "73e12207e57d50d4c3dd3d7f4781dd897bb0fbc9", "updated": "2026-09-29", "documents": [{"id": "liang-2022", "type": "paper", "author": "梁政渊 · Zhengyuan Liang", "year": 2022, "stage": "现实诊断", "title": "从真实农户中找到值得学习的系统", "en": "Identifying exemplary sustainable cropping systems using a positive deviance approach: Wheat-maize double cropping in the North China Plain", "citation": "Liang, Z., et al. (2022). Agricultural Systems, 201, 103471.", "url": "https://doi.org/10.1016/j.agsy.2022.103471", "pdf": "https://edepot.wur.nl/575567", "evidence": "正文方法与结果已核读；补充材料、原始数据和图像细节尚未逐项复核", "minutes": 65, "tags": ["Pareto", "Positive deviance", "MIDIP", "HDIP", "HCA"], "summary": "第一课。不是凭经验指定最佳管理，也不是让算法创造新农场，而是从已经存在的系统中寻找多指标表现突出的案例。", "sections": [["先读懂研究问题", "原文依据", "作者比较同一种冬小麦—夏玉米双季生产系统的不同管理案例，问：谁已经在经济、食物供给、资源和环境维度上表现突出？分析对象是344个案例，不是344个实验处理。方法依次为多指标计算、Pareto排序、优秀案例聚类和典型群组识别。", "§2.1–2.7"], ["把数据想成一张矩阵", "教学解释", "一行是一个生产系统，一列是一个指标。先给列写清单位、时间尺度和改善方向，再谈优化。这里的7列是：毛利、膳食能量产出、劳动力、地下水消耗、氮损失、净温室气体排放、农药施用频次；前两项希望提高，其余项在该研究问题下希望降低。\n\n毛利不自动等于扣除了家庭劳动机会成本的纯利润。地下水消耗和氮损失包含计算模型，不是每个农户都有水位监测和淋溶实测。农药频次也不等于有效成分质量或毒性风险。进入[[indicators|指标与系统边界]]核对这些区别。", "指标定义见§2.4；边界提醒为教学说明"], ["Pareto筛选究竟留下了谁", "原文依据", "原文使用非支配排序，将56个案例归入第一前沿，再对它们的标准化指标聚类。本文这一步报告的是Manhattan距离和Ward.D2层次聚类，不是先做PCA。最终一个包含9个案例的群组被选为exemplary systems。\n\n56个非支配案例不代表56个全能冠军。有的可能只是在一项指标上特别强，从而无法被别人全面压过。为什么还要聚类？因为我们需要把这些不同的优势组合分开讨论。", "§2.5.1–2.5.2；§3.1–3.2"], ["MIDIP和HDIP，不再背缩写", "原文依据", "先用全部观测中的各指标最好值组成理想点q。对群组c的指标中心p，计算按观测范围标准化的距离：\n\nd[k,c] = |p[k,c] − q[k]| / (max[k] − min[k])\nMIDIP[c] = sqrt(sum(d[k,c]^2))\nHDIP[c] = sample_sd(d[1,c], ..., d[K,c])\n\nMIDIP小表示整体靠近理想点；HDIP小表示各维度离理想点的距离比较均匀。HDIP很小仍可能各方面都很差，不能单独用它选最好系统。MIDIP不是各距离的简单平均。某列范围为0时，计算实现需要明确处理，不能除以0。详见[[ideal-distance|理想点距离手算课]]。", "§2.5.2，公式9–12；零范围处理为实现补充"], ["读图路线与不能忽略的疑点", "阅读导航", "先沿Fig.1看完整研究流程，再结合Fig.2理解理想点和群组；接着读群组比较和优秀系统对比，最后看管理措施差异。这里提供的是基于正文与图题的阅读指引，不冒充已经逐像素复核所有图形。\n\n数值审查发现：摘要与§3.3对若干资源、环境改善百分比的表述不完全一致；§2.3也有村庄数与总样本数难以对应的句子。本课不把冲突数字拼成一套漂亮结论。正式复现前应对照原PDF、补充表与作者数据。相关记录见[[corrections|勘误与证据边界]]。", "摘要、§2.3、§3.3及图题"], ["结果能够支持到哪一步", "分析提醒", "本研究识别的是观测样本内表现好的系统。它不能仅凭组间比较证明某一种管理措施造成了全部优势，也不能保证把这些措施复制到另一块土壤上就会产生同样结果。\n\n同一组指标既用于挑选优秀案例，又用于比较其是否更优秀，显著性检验需要警惕选择效应。标准化范围、理想点和聚类方法本身也包含选择。Pareto阶段不预设权重，并不等于整个研究没有价值判断。[[causality|观测、模拟与因果证据]]会展开讲。", "教学审视；原文局限见讨论部分"], ["本课练习与海南迁移", "教学练习", "先到[[lab|交互实验室]]手工判断6个教学农场的支配关系，再运行离线包中的pareto_lab.py。要求能够解释：为什么一个高利润但高污染的系统可能仍在前沿上？为什么综合得分最高的系统未必是最适合某位农户的？\n\n迁移到海南时，先限定可比较的农场背景、生产类型和计量边界，再寻找正向案例。不要拿拥有水源和资金优势的农场直接当所有小农的标杆。方法迁移是建议，不是该论文已经在海南验证的结论。", "教学自编数据；不等同原文复现"], ["工具与复现条件", "资源状态", "原文涉及R的eaf非支配排序和层次聚类。完整复现需要原始指标矩阵、清洗规则、标准化范围、聚类参数和补充材料；本轮没有拿到完整作者数据与脚本，不能承诺复现出56和9这两个数字。先掌握机制，再申请数据。下一课进入[[liang-2023|由现实案例走向新轮作方案生成]]。", "Methods与数据可获得性说明"]], "quiz": [["非支配案例是否就是各项都最好的案例？", "不是。只要没有其他案例在所有指标上不差且至少一项更好，它就可能非支配；极端优势方案也可能入选。"], ["HDIP很低为何还不能说明系统优秀？", "它只表示各指标距离理想点的差异小。所有指标都离理想点很远，也能有很低的HDIP。"], ["这篇的聚类是否用了PCA？", "本文所述优秀案例聚类不是先做PCA；不要把2023年论文的方法倒套到2022年。"]], "related": ["pareto", "ideal-distance", "positive-deviance", "liang-2023", "xu-data-2024", "causality"]}, {"id": "liang-2023", "type": "paper", "author": "梁政渊 · Zhengyuan Liang", "year": 2023, "stage": "方案生成", "title": "从三千种轮作中筛出可解释的选择", "en": "Designing diversified crop rotations to advance sustainability: A method and an application", "citation": "Liang, Z., et al. (2023). Sustainable Production and Consumption, 40, 532–544.", "url": "https://doi.org/10.1016/j.spc.2023.07.018", "pdf": "https://edepot.wur.nl/636239", "evidence": "正文方法、指标定义和结果已核读；未取得作者完整脚本", "minutes": 75, "tags": ["ROTAT", "Pareto efficiency", "PCA", "HCA"], "summary": "第二课。Generate → Evaluate → Select → Characterize：生成可行方案，计算指标，筛选，再把方案分成能讨论的类型。", "sections": [["相对上一课的跃迁", "教学解释", "[[liang-2022|2022年的工作]]从已经存在的系统中选择；这一篇则用农学规则组合未来可能的轮作。先生成，再评价，是与只比较几个主观情景不同的设计方式。但生成器只能探索你允许的作物、时序和规则，不能自动发现被排除的生产活动。", "教学比较，依据两篇Methods"], ["原文怎样生成候选轮作", "原文依据", "研究用ROTAT，基于作物时间、顺序和频次等规则，生成1–4年轮作。10种作物被表达为13个带季节差异的节点，得到3011种轮作，包括小麦—玉米参照系统。作物产出和主要投入来自已设定的数据；原文对前茬影响采用简化假设，因此不是逐日生长过程模型。", "§3及Table 1；农学规则见补充材料"], ["11个指标必须逐列核对", "原文依据", "评价涵盖毛利、毛利变异、劳动、能量/锌/维生素C供给、地下水消耗、富营养化、净温室气体、农药有效成分用量和农业多样性代理指标。营养供给采用特定参考人的需要量换算；毛利变异基于不同年份价格条件，不等于已经模拟所有气候与产量风险。\n\n特别注意：本篇农药指标是有效成分质量，不是2022年的施用频次；农业多样性代理量也不是实测物种多样性。不能把两个论文的数据列名相似就直接合并。", "Table 2及指标计算小节"], ["为什么1298个Pareto方案还不够", "原文依据", "3011个候选中有1298个非支配方案；目标多时，大量方案互不支配并不奇怪。作者进一步使用Pareto efficiency score：寻找最小的目标子集大小k，使某个方案在所有大小为k的目标子集中都保持非支配。关键是“所有子集”，不是“至少一个子集”，也不是取非支配概率。\n\n参照轮作的得分为9，研究保留得分不高于9的125个方案。这个阈值不表示125个方案在全部指标上都优于参照。进入[[efficiency-score|Pareto efficiency完整手算与代码]]。", "§3.5.2、结果部分及Fig.2"], ["从125个点到8类方案", "原文依据", "研究用PCA和层次聚类描述筛选后的方案，得到8类具有不同绩效组合的轮作。文中报告ade4::dudi.pca、hclust、cutree，并用肘部图辅助判断类别。不能把2022年报告的距离和连接方式自动认作本篇的设置；当前核读文本不足以把本篇全部聚类参数写死。\n\n学习时先看Fig.1三阶段流程，再看Fig.2分数，接着看方案空间和类别表现，最后返回作物序列实例。[[pca-cluster|降维与聚类]]解释为什么这一步是描述，不是再次证明最优。", "方法小节及图题"], ["结果、限制与迁移", "分析提醒", "核心成果是一组不同取舍的轮作类型，而不是一项适合全部农户的统一处方。高收益作物可能增加劳动需求；参数来自特定地区、生产方式和价格设置；简化前茬效应会改变轮作优势的解释范围。\n\n迁移到海南，要重建作物日历、轮作规则和劳动力峰值，而不是复制华北平原候选库。先做一个3种活动、2块地、3个时期的玩具问题，说明哪些组合因规则被剔除，再考虑扩大。", "讨论与教学迁移建议"], ["练习的验收标准", "教学练习", "运行pareto_lab.py中的efficiency_score示例。把目标数从3增到5，观察非支配比例是否可能上升。解释一个只靠单项极端优势保留下来的方案，为什么可能需要较大的k才能在所有子集中保持非支配。\n\n精确再现3011、1298和125需要原始候选库、农学规则和完整指标输入。教学练习不会伪装成作者的结果。下一课是[[farmsteps-2026|FarmSTEPS的多地块、多时期规划]]。", "自编练习"]], "quiz": [["Pareto efficiency score考察至少一个还是全部同大小目标子集？", "全部。把“所有”错写成“至少一个”会完全改变得分含义。"], ["125个方案是否都全面优于小麦—玉米？", "不是。它们满足作者定义的多指标折中筛选规则，仍然存在指标取舍。"], ["毛利变异能代表全部农业风险吗？", "不能。本文特定价格情景产生的变异不自动包含产量、极端天气、病虫害和市场结构变化。"]], "related": ["liang-2022", "efficiency-score", "rotation", "pca-cluster", "farmsteps-2026", "uncertainty"]}, {"id": "farmsteps-2026", "type": "paper", "author": "梁政渊 · Zhengyuan Liang", "year": 2026, "stage": "时空规划", "title": "FarmSTEPS：地块 × 时间 × 农场约束", "en": "FarmSTEPS, a model for spatial-temporal exploration of diversified and sustainable crop sequence plans for crop farms", "citation": "Liang, Z., et al. (2026). Agronomy for Sustainable Development, 46, 23.", "url": "https://doi.org/10.1007/s13593-026-01097-8", "evidence": "全文方法与结构已核读；软件仓库许可和当前可运行性未实测", "minutes": 75, "tags": ["FarmSTEPS", "ROTAT+", "C#", "Enumeration"], "summary": "第三课。学会把多地块、多时期规划写成数据结构、农学规则、资源约束和可行方案，而不是先追求复杂算法。", "sections": [["先画出六个模块", "原文依据", "原文的六个模块为Farm configuration、Land-unit、Timeline、Crop sequence、Indicator、Constraint。农场由多个地块构成，土地单元关联可种作物和环境条件，时间轴表达规划时期，作物序列模块生成地块内方案，指标和约束在农场层面评价和筛选。", "§2.1及架构图"], ["纵向与横向是两种可行性", "教学解释", "纵向：同一地块前后种什么、什么时候种、是否违反轮作间隔。横向：同一时期所有地块共同消耗的水、劳动或资金是否超过可用量。每块地单独可行，不代表合在一起可行。\n\n用[[rotation|规则生成器]]先产生每块地的可行序列，再组合成农场计划并检查资源。最容易出错的是只计算年度总劳动：年度总量够，不代表两周收获期的劳动也够。", "教学结构解释"], ["不要把枚举说成进化优化", "原文依据", "案例使用系统枚举生成可行农场计划，再进行多目标非支配筛选。三年规划案例得到213679个可行方案和128个Pareto方案。这个过程不能描述为FarmDESIGN式P-MODE不断变异搜索。\n\n两条路线都能做多目标设计，但搜索机制与最优性声明不同。枚举只在被定义并完整遍历的离散空间内完整；它也不证明现实中不存在更好而未被建模的生产方式。", "模型方法和案例结果"], ["固定输入不是过程响应", "原文依据", "候选活动需要播收期、投入、产量和绩效参数。此类规划不能仅因包含时间轴，就被称为逐日作物生理模型。案例重点比较毛利、地下水消耗、农药、富营养化和温室气体等指标，并设置农场约束。", "指标、约束与应用部分"], ["工具与可获得性", "资源状态", "原文报告C#实现，并给出FarmSTEPS软件包位置：https://git.wur.nl/jeroen.groot/farmsteps.package 。本轮未实测该仓库的下载、依赖、许可证和运行环境。论文开放获取不等于软件可无条件再发布。先理解模块和输入表，再核对软件版本。\n\n不必为了读这篇立即系统学习C#。先能写出一张输入数据字典、一个限制式和一个组合示例，比直接改大型代码更有价值。", "Code availability；学习次序为建议"], ["与海南任务的距离", "迁移建议", "可借鉴的是space × time × activity的结构。加入牲畜、水产后，还要处理存栏、饲料和资源循环，不能只是给作物列表追加两种名字。先确定决策时间尺度和系统边界，再决定扩展FarmSTEPS、耦合其他模块或使用新框架。\n\n练习：两地块A/B，三时期，三种候选活动。列出地块内可行序列；组合后用每时期劳动上限过滤；最后比较利润与用水。解释在何处加入约束最省计算。", "教学建议；不是软件现成功能承诺"]], "quiz": [["FarmSTEPS案例是P-MODE吗？", "不是。文中方案生成采用枚举，可行方案随后做Pareto筛选。"], ["多时期模型是否必然是过程模型？", "不是。时间轴可以表示计划和活动序列，产量仍可能是外生参数。"], ["单块地可行，农场一定可行吗？", "不一定。土地单元分别满足轮作规则后，还可能共同超过同一时期水或劳动力等资源上限。"]], "related": ["rotation", "pareto", "whole-farm", "farmdesign-2012", "liang-2023", "uncertainty"]}, {"id": "cheng-2023", "type": "paper", "author": "程嘉莉 · Jiali Cheng", "year": 2023, "stage": "感知调查", "title": "农户看见的生态服务，等不等于生态实况？", "en": "Farmers perceive diminishing ecosystem services, but overlook dis-services in intensively used agricultural landscapes in the North China Plain", "citation": "Cheng, J., et al. (2023). Journal of Environmental Management, 347, 119060.", "url": "https://doi.org/10.1016/j.jenvman.2023.119060", "evidence": "正文调查设计、统计方法与局限已核读；补充问卷待逐项复核", "minutes": 60, "tags": ["Survey", "Ecosystem services", "RDA", "Likert"], "summary": "第四课。学习把农户感知作为一种证据使用，而不是把主观回答替代实际生态监测。", "sections": [["研究对象和证据类型", "原文依据", "研究于2020年调查35个村庄的267名农业参与者，包括187名小农、45名带头农户和35名村负责人。问题涉及当时生态系统服务与负服务，以及受访者回忆的2015–2020年变化。它不是连续五年的生态监测。", "§2.3–2.4"], ["问卷怎样变成变量", "原文依据", "问卷使用1–5级评分并经过试调查。缺失、未发生和不适用没有被一律处理：部分未发生状态记0，部分负服务转换为有无，某些不知道的回答作为缺失处理。统计分析前必须按原指标的编码表转换。\n\n供给服务相关作物收入这里是产量乘价格，不是扣成本后的利润。把“不知道污染存在”编码成“无污染”，会把认知边界变成虚假的环境改善。", "§2.4、§2.6及Table S1引用"], ["RDA到底用了几行数据", "原文依据", "RDA的分析单位是35个村庄：响应是村庄平均感知评分，解释变量是村庄的生物物理与社会经济特征。响应和解释变量标准化，使用vegan进行分析和1000次置换检验。不是直接把267位受访者当作267个独立村庄来回归。", "§2.6"], ["如何看统计图", "教学解释", "先看服务、负服务的概念关系，再看评分分布：回答人数是否变化？不知道、未发生是否分开？接着到Fig.7的RDA，先认清响应、解释变量和排序轴。箭头同向的相关性不是因果链；排序平面不能表达全部高维信息。\n\n论文报告该组解释变量仅解释一部分变异，因此不能把剩余差异都归因于农户知识不足。[[rda|RDA从矩阵开始]]给出最小练习。", "图题与§3.6；读图说明为教学解释"], ["主要结果与限制", "原文依据", "参与者倾向于认为供给服务较好、部分调节和支持服务不足，而很少报告农业产生的负服务。作者明确强调感知可以补充、不能替代生物物理测量。关于为何低报负服务，讨论提出若干可能解释，但这项研究没有设计成区分并验证这些机制的因果研究。", "结果、§4.1及§4.3"], ["工具、练习与海南迁移", "教学练习", "原文使用R、vegan、likert、ggplot2，以及Kruskal–Wallis和后续Wilcoxon秩和比较。当前正文未明确的多重比较校正设置，不应由我们补成作者已经采用。\n\n练习：分别把一条回答编码成0、缺失和不适用，解释它们如何改变村庄均值。海南调查应先做小范围认知试访，把感知指标与实测/遥感指标分层保存。下一课[[cheng-2025|Q方法]]从“你看见什么”转向“你更在意什么”。", "§2.6；数据按作者说明请求获取"]], "quiz": [["2015–2020服务变化是五年实测吗？", "不是，是2020年调查中对过去变化的回忆和感知。"], ["RDA的样本单位是什么？", "村庄，使用35个村庄的平均感知及村庄属性。"], ["大多数人不报告污染能证明污染不存在吗？", "不能。可见性、知识、问题理解和回答意愿都可能影响感知数据。"]], "related": ["rda", "survey", "causality", "cheng-2025", "indicators", "xu-data-2024"]}, {"id": "cheng-2025", "type": "paper", "author": "程嘉莉 · Jiali Cheng", "year": 2025, "stage": "偏好识别", "title": "Q方法：把“都重要”变成可以讨论的取舍", "en": "Stakeholder perspectives on ecosystem services in agricultural landscapes: A case study in the North China Plain", "citation": "Cheng, J., et al. (2025). Agricultural Systems, 223, 104187. Online 29 November 2024.", "url": "https://doi.org/10.1016/j.agsy.2024.104187", "evidence": "正文Q设计、分组分析、图题和局限已核读；作者数据和R脚本需申请", "minutes": 75, "tags": ["Q methodology", "qmethod", "PCA", "Varimax"], "summary": "第五课。认识不同的价值组合，而不是计算所有人应该服从的一组权重。", "sections": [["先区别四个词", "教学解释", "Value是价值；importance是重要性；preference强调相对另一项的偏好；perspective是多项偏好的组合模式。某人说水和利润都重要，不表示在水资源受限时仍能同时最大化。Q排序让参与者把有限位置分配给不同服务，随后解释理由。", "术语对应原文Table 1；解释为教学展开"], ["本篇的具体排序设计", "原文依据", "20条与生态服务对应的陈述，放入五档1–5分网格，格数为2、4、8、4、2。327人完成排序：农户222、村负责人35、乡镇人员9、县级人员21、公司5、市民20、学术人员15。农户和市民表达个人观点，其他群体被要求表达所属机构立场。", "§2.2、Tables 2–3、Fig.1"], ["18种观点从哪里来", "原文依据", "作者先对全部327份排序做总体分析，得到3种主要观点；考虑农户占比较大，又分别对7个群体做Q分析，每组保留2–3个因子，合计18种观点。不是在一个总体模型里提取18个互相独立的类别，也不是18类人口比例。\n\nQ分析采用PCA和varimax旋转，R的qmethod包。因子数结合碎石图、解释度、显著归属人数、特征根等标准及解释性判断。", "§2.2.4、§3.3"], ["从载荷到典型排序", "原文依据", "某份Q-sort被标记归属到一个因子，需要载荷达到显著性条件，且该载荷平方大于其在其他因子上载荷平方之和；并非每个人都会归类。被标记的排序构成加权z分数，再按z分数顺序映射回五档网格，得到factor array。\n\n载荷代表与典型排序的关系，不能直接当作生态服务的优化权重。[[q-method|Q方法教程]]把人×陈述矩阵、因子载荷和factor array分开演示。", "§2.2.4"], ["看图时避免两种错觉", "阅读导航", "先画Fig.1的20格排序，再用Table 3检查样本失衡；随后读Fig.3各组观点与服务类别关系。Fig.4是作者对观点相似性的定性表达，不要把三角形内距离解读为一个未经说明的统计距离。Fig.5包含未归组农户，不能将他们删除后宣称剩下的比例代表全部人群。", "图题与结果部分"], ["这篇没有完成什么", "分析提醒", "它识别相对偏好，不直接测量生态服务真实供给，也没有在这篇文章里完成LandscapeIMAGES优化。观点识别不等于真实采纳、更不等于预测某个方案实施后的行为。公司组仅5人、女性偏少、语句由研究者初拟等，都限制外推。\n\n把Q分数接到优化前，还要说明采用哪种映射、是否允许否决性约束、如何保留少数观点，以及对映射方式有多敏感。不能说“没有权重”就跳过价值选择。", "§4.3–4.4及教学分析"], ["实践、工具与下一步", "教学练习", "在[[lab|实验室]]给20张教学卡片排序，必须满足2–4–8–4–2，然后写出两端卡片的原因。这个练习不产生有效研究数据，更不模拟原文327位受访者。\n\n作者注明数据和R脚本可向通讯作者请求。原始脚本未获前，不承诺复现18个观点。读完进入[[cheng-thesis|程嘉莉博士论文的景观设计导航]]，理解如何从感知、偏好走向模型方案。", "Data availability；练习为原创"]], "quiz": [["本文的Q网格是什么？", "20条陈述，五档1–5分，各档2、4、8、4、2个位置。"], ["18种观点是否来自一次总体18因子分析？", "不是。总体分析3种；分别分析7个群体后累计18种。"], ["因子载荷可直接用作优化目标权重吗？", "不能。它是Q-sort与因子的关系。将偏好转为决策模型的目标、权重或约束需要单独论证。"]], "related": ["q-method", "survey", "cheng-2023", "cheng-thesis", "landscape-2018", "causality"]}, {"id": "xu-2024", "type": "paper", "author": "徐展 · Zhan Xu", "year": 2024, "stage": "农场异质性", "title": "规模变大，为什么不等于所有指标变好", "en": "Comparing the sustainability of smallholder and business farms in the North China Plain; a case study in Quzhou", "citation": "Xu, Z., et al. (2024). Agricultural Systems, 216, 103896.", "url": "https://doi.org/10.1016/j.agsy.2024.103896", "pdf": "https://edepot.wur.nl/651956", "evidence": "正文抽样、指标、统计方法、结果与局限已核读", "minutes": 55, "tags": ["Farm types", "MCI", "Indicators", "Rarefaction"], "summary": "第六课。换分母、换尺度、换种植强度，都会改变关于可持续性的结论。", "sections": [["调查与比较对象", "原文依据", "来自35村的505份有效问卷，包括486个小农场和19个经营型农场，后者由14个家庭农场和5个合作农场构成。数据覆盖2019年6月到2020年6月的一年作物生产，不是把经营规模随机分配给农户的实验。", "§2.2"], ["把六个指标和分母写清", "原文依据", "评价包括灌溉、农药TFI、氮盈余、膳食能量、劳动和毛利，区分地块与农场尺度。地块指标的单位面积值按面积加权，农场总量则是面积乘指标后求和。两种量不能混用。\n\n氮盈余为输入减输出，不等于已测定的氮损失。毛利包含租地和相关变动成本，家庭自有劳动与雇工成本的处理不同；读经济比较必须同时读其成本边界。", "§2.4及Table 1"], ["复种指数改变了问题", "原文依据", "MCI表示单位地面积一年种了多少轮作物，农场MCI按地块面积加权。作者还用年度指标除以MCI，比较每一轮作物的平均表现。\n\n这帮助分辨是管理方式不同，还是一年少种一季而降低了总投入。但这种换算不是消除所有混杂的因果控制。先到[[indicators|单位和聚合]]手算：一年200小时/MCI2，与一年150小时/MCI1，哪个每年省工？哪个每作物省工？", "§2.3–2.4；因果提醒为教学说明"], ["原文统计并不是万能均值检验", "原文依据", "比较使用Kolmogorov–Smirnov检验，针对分布差异。作物丰富度还通过面积匹配的稀释抽样比较，避免样本总面积不同造成简单物种数偏差。原文使用1000次抽样。", "§2.4.2、§2.5"], ["读结果的正确顺序", "阅读导航", "先看作物面积配置和复种方式，再看地块尺度比较，最后看农场年度指标与MCI校正后的指标。经营型农场更偏经济作物，较少双季粮食生产，因此环境指标、能量产出与毛利之间并不同时改善。\n\nFig.6、7使用累计分布，横坐标是指标值，纵坐标是累计概率，不是单个农场随时间的曲线。[[causality|证据类型]]解释为什么不能据此说规模扩大必然造成某个结果。", "Figs.3–7及讨论"], ["给海南研究的实用启发", "迁移建议", "先决定你比较的是每公顷、每农场、每户、每年还是每季。热带多年生作物、水产周期和家庭非农收入不能硬塞进华北平原一年作物边界。\n\n本篇没有完成FarmDESIGN优化；与优化衔接的路线应看[[xu-thesis|徐展博士论文导航]]。可用数据入口是[[xu-data-2024|曲周数据论文]]，但该数据并不自动复现本文全部指标和清洗过程。", "边界迁移建议"]], "quiz": [["面积加权平均和农场总量有何不同？", "前者除以总面积，单位仍是每公顷；后者不除面积，得到整个农场总量。"], ["氮盈余可以直接称为氮淋溶吗？", "不可以。盈余含潜在积累和多种损失/未计过程，不能等同某条实际损失路径。"], ["年度水耗低就代表单季灌溉技术更好吗？", "不一定，可能一年少种一季。需要同时检查MCI和每季投入。"]], "related": ["indicators", "typology", "xu-data-2024", "xu-thesis", "whole-farm"]}, {"id": "xu-data-2024", "type": "paper", "author": "徐展、程嘉莉、梁政渊及合作者", "year": 2024, "stage": "数据基础", "title": "一套调查，怎样支撑多篇博士研究", "en": "Survey data on livelihoods and inputs and outputs of crop production in Quzhou county on the North China Plain", "citation": "Xu, Z., et al. (2024). Data in Brief. Dataset DOI: 10.17632/jp3v9859cx.1.", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10964062/", "dataUrl": "https://data.mendeley.com/datasets/jp3v9859cx/1", "evidence": "全文数据说明、清洗与分类方法已核读；未重新下载运行全部原始CSV", "minutes": 50, "tags": ["Data dictionary", "Sampling", "PCA", "Typology"], "summary": "最值得在第一次田野调查前读的文章。数据结构、主键和抽样设计往往比后来换算法更重要。", "sections": [["四个数不能混用", "原文依据", "村庄总表342条，分类保留308个村；抽样35村，访问525户，清洗后505份有效家庭记录；作物层面1352条记录。342不是最终PCA样本数，525不是分析有效样本数，1352更不是独立农户数。", "Specifications、§3及§4.1"], ["分层抽样如何做", "原文依据", "15个村庄变量经PCA保留7个成分，累计解释66%变异，再用Ward层次聚类和平均轮廓系数辅助定类，之后细分最大类。排除基本无农业的类型，剩余7类各抽5村。每村经营型农场纳入，再随机补充小农户到计划数量。", "§4.1–4.4"], ["三个表，两本字典", "教学解释", "Village表保存村庄属性；Household表保存经营主体与资源；Crop表保存作物活动投入产出。可靠连接需要稳定的village_id、farm_id、plot/activity标识和日期。不能靠姓名或Excel行号连接。\n\n同一地块一年两季作物会有不同活动记录。合并表时若把一对多关系当一对一，就会重复累加土地、水和利润。[[data-schema|数据字典与关系结构]]给出可下载的教学模板。", "教学结构，参考§3"], ["为什么作物面积百分比可以超过100%", "教学解释", "如果分子是播种面积而分母是耕地面积，一年种两季时累计比例可以超过100%。它与同一时点的土地覆盖百分比不是同一个量。看见超过100%不要直接当异常值删除。\n\n村庄年鉴2017、干部调查2018、农户调查2020又属于不同时间切片，不能统一改成一个所谓现状年份。", "Table 3说明、各数据采集时间"], ["开放数据仍然有使用边界", "资源状态", "作者提供Mendeley Data数据入口和代码字典。文中说明问卷匿名、用于非营利研究。本站仅链接数据，不自动把原始记录镜像公开。下载后应先核对数据仓库许可、变量说明和可识别风险。\n\n海南调研需补充多年生果园、牲畜、水产、季节劳动、长期水资源等字段，不能直接宣布曲周模板覆盖整个新项目。", "数据可获得性与伦理说明；扩展建议"]], "quiz": [["为什么525、505和1352都可能正确？", "分别为访问家庭数、清洗后有效家庭数和另一数据层级的活动/田块记录数。"], ["等量抽取每种村庄，能直接算全县比例吗？", "不能默认如此。总体推断需要考虑各层实际规模与抽样权重。"], ["反复出现一个farm_id是否一定重复数据？", "不一定。一农场多地块、多季活动本来就是一对多，须联合活动/地块/时间主键判断。"]], "related": ["data-schema", "typology", "pca-cluster", "liang-2022", "cheng-2023", "xu-2024"]}, {"id": "farmdesign-2012", "type": "paper", "author": "Jeroen C.J. Groot及合作者", "year": 2012, "stage": "全农场模型", "title": "FarmDESIGN：把农场当作相互联系的资源系统", "en": "Multi-objective optimization and design of farming systems", "citation": "Groot, J. C. J., Oomen, G. J. M., & Rossing, W. A. H. (2012). Agricultural Systems, 110, 63–77.", "url": "https://doi.org/10.1016/j.agsy.2012.03.012", "evidence": "用户提供的原始论文正文；年度模型结构与限制已核对", "minutes": 65, "tags": ["FarmDESIGN", "Whole farm", "P-MODE", "Balances"], "summary": "系统建模基础课。重点不是点软件按钮，而是分清外生输入、内部流、输出、目标和约束。", "sections": [["模型到底做了什么", "原文依据", "FarmDESIGN将年度生物经济农场平衡模型与多目标优化相连。作物、动物、饲料、粪肥、土壤有机质、养分、劳动和经济相互关联。荷兰96公顷有机混合农场案例考察利润、有机质、劳动和土壤氮损失四个目标。", "§2及案例研究"], ["最重要的限制：静态年度模型", "原文依据", "原文按年度计算，假定农场存量与畜群处于稳态。作物和动物生产水平预先设定，养分和饲料需求据此计算，不是产量随天气与施肥逐日动态响应。土壤氮损失作为平衡残差，不能当作分别实测的淋溶与反硝化。", "§2.2及§2.2.3"], ["先画流，再写代码", "教学解释", "画出边界外的购买饲料、肥料和产品销售；再画边界内的作物→饲料→动物→粪肥→土壤→作物。内部流在两个模块中出现，但计算整个农场净输入时必须抵消，不能重复当输入。\n\n决策变量是可以改变的数，例如作物面积、牲畜数量和产品用途；参数是暂时给定的，例如单产与价格；约束规定不能违反的条件；目标规定希望改善的方向。[[whole-farm|全农场建模教程]]提供一个两活动示例。", "教学解释"], ["优化不是机器替农户决定", "教学解释", "进化式搜索反复提出配置、检查约束和评价指标，保留非支配候选。结果是给定参数、约束和搜索过程中的近似有效方案集合。没有足够证据不能说证明了全局最优。\n\n即使模型找到同时改善四个目标的方案，也仍需检查现实可实施性、转换成本、管理能力和未纳入指标。原文的模型与用户验证不能替代长期实施试验。", "基于模型结构的分析说明"], ["怎样学才高效", "教学练习", "第一遍只标记外生量、内生量和约束。第二遍从饲料平衡开始，追踪增加动物数量怎样改变饲料进口、粪肥和土地需求。第三遍再看Pareto图。\n\n完成后接[[ditzler-2019|家庭预算、劳动和营养扩展]]与[[qu-2025|粪肥链扩展]]。不要把2012版功能直接等同所有后续版本。", "教学路线"]], "quiz": [["把施肥量改大，模型一定自动模拟出增产吗？", "原始年度静态设定不是这样。生产目标通常为输入，不能默认具备动态产量响应。"], ["内部粪肥转移是否增加整个农场外部N输入？", "不会。它改变内部配置；农场边界核算要抵消内部流。"], ["会运行FarmDESIGN就等于掌握系统建模吗？", "不等于。还需解释模型边界、参数、守恒、约束、搜索和验证。"]], "related": ["whole-farm", "nutrients", "pareto", "validation", "ditzler-2019", "qu-2025"]}, {"id": "landscape-2018", "type": "paper", "author": "Jeroen C.J. Groot及合作者", "year": 2018, "stage": "景观优化", "title": "LandscapeIMAGES：每个Pareto点背后是一张地图", "en": "Exploring ecosystem services trade-offs in agricultural landscapes with a multi-objective programming approach", "citation": "Groot, J. C. J., Yalew, S. G., & Rossing, W. A. H. (2018). Landscape and Urban Planning, 172, 29–36.", "url": "https://doi.org/10.1016/j.landurbplan.2017.12.008", "evidence": "原始论文及全文方法核读", "minutes": 45, "tags": ["LandscapeIMAGES", "GIS", "P-MODE", "Ecosystem services"], "summary": "从“评价一张地图”进到“生成、筛选和解释许多可能的地图”。", "sections": [["模型的四步循环", "原文依据", "框架把通用系统部分与案例指标模块分开，GIS多边形和线段表达田块、边界等对象，数据库提供可选土地利用和管理。核心循环为Generate、Evaluate、Select、Present：生成、评价、Pareto选择、可视化。", "§2与Fig.1"], ["组成和配置必须区分", "教学解释", "同样20%的半自然生境，连成廊道与分散孤岛的连通性可能不同。组成问各类有多少；配置问它们在哪里、相距多远。若某指标只对面积求和，它无法反映邻接、边缘或扩散过程。[[spatial-design|空间显式设计]]说明如何检查模型是否真的用了空间。", "教学解释"], ["指标是对服务的表达，不是服务本身", "原文依据", "案例结合农业收益、土地利用多样性、连通性、花带生物防治潜力、河岸缓冲与景观可见性等指标。许多是代理指标。P-MODE探索备选方案，并不自动保证每一项代理指标已经得到独立生态验证。", "案例与讨论部分"], ["与程嘉莉研究怎么接", "迁移建议", "[[cheng-2025|Q方法]]给出不同人看重哪些服务；LandscapeIMAGES计算改变土地配置可能带来的绩效。二者连接仍须明确怎样从相对偏好选择目标、约束或方案。不能把人类需求当一个模型常数。\n\n练习：3×3九个地块中选3个为生境，比较只算生境面积与加入相邻边数量，哪些配置不再等价？", "教学自编示例"], ["软件与局限", "资源状态", "论文介绍模块化、面向对象实现和数据库接口。具体版本、代码可获得性与许可须另行核验。它主要支持战略性景观设计，不是日常自动农事调度系统。阅读2007年[[landscape-2007|早期框架]]可以看清多尺度思想的来源。", "软件结构与讨论"]], "quiz": [["两个方案各有20%林地，生态指标必然相同吗？", "不一定。面积型指标可能相同，连通性、邻接和过程性指标可能不同。"], ["Q排序直接等于LandscapeIMAGES模型输入吗？", "不自动等于，必须设计并解释偏好到目标、约束或筛选规则的映射。"]], "related": ["spatial-design", "pareto", "cheng-thesis", "landscape-2007", "novotny-2024"]}, {"id": "landscape-2007", "type": "paper", "author": "Jeroen C.J. Groot及合作者", "year": 2007, "stage": "多尺度基础", "title": "多尺度权衡：田块好，不一定整个景观最好", "en": "Exploring multi-scale trade-offs between nature conservation, agricultural profits and landscape quality—A methodology to support discussions on land-use perspectives", "citation": "Groot, J. C. J., et al. (2007). Agriculture, Ecosystems & Environment, 120, 58–69.", "url": "https://doi.org/10.1016/j.agee.2006.03.037", "evidence": "用户提供原文；早期框架与案例性质核对", "minutes": 35, "tags": ["Scale", "LandscapeIMAGES", "Trade-offs"], "summary": "早期LandscapeIMAGES方法论文。读懂尺度、空间配置和讨论支持，而不把原型案例当成政策落地验证。", "sections": [["原文贡献", "原文依据", "论文提出空间显式、多尺度、多目标景观探索框架，以荷兰草地和树篱景观的近真实案例说明农业收益、自然保护、景观与环境目标的关系。定位为帮助多方讨论可选土地利用方案。", "摘要、方法与讨论"], ["为什么尺度会改变结论", "教学解释", "一个田块减肥可能降低产量并减轻损失；但在全农场范围，把有限投入重新安排到反应更高的田块，可能改善整体表现。景观连通性又不是逐田块评分后简单相加。需要给每个指标写明计算层级、聚合规则与空间交互。", "教学解释，参照多尺度框架"], ["阅读与练习", "教学练习", "先识别土地单元、决策变量和目标，再沿地图到绩效图往返阅读。练习：两个农场各自利润都提高，地区污染是否一定下降？给出一种反例，并指出被忽略的跨边界过程。随后读[[landscape-2018|2018平台论文]]，不要把两个版本的实现细节混为一谈。", "教学练习"]], "quiz": [["近真实案例能证明真实社区已采纳吗？", "不能。它说明方法如何运作，实际采纳和实施影响需要另外的证据。"]], "related": ["spatial-design", "indicators", "landscape-2018"]}, {"id": "novotny-2024", "type": "paper", "author": "Ivan P. Novotny及合作者", "year": 2024, "stage": "营养敏感景观", "title": "粮食够不够，不只是一列热量", "en": "Exploring nutrient-sensitive landscape configurations for rural communities in southern Mexico", "citation": "Novotny, I. P., et al. (2024). Landscape and Urban Planning, 246, 105041.", "url": "https://doi.org/10.1016/j.landurbplan.2024.105041", "evidence": "用户提供论文正文；情景设计与营养边界核对", "minutes": 45, "tags": ["Nutrition", "LandscapeIMAGES", "MIAF"], "summary": "把土地利用设计和营养自给连接起来，同时守住“模型供给”与“真实健康改善”的界线。", "sections": [["作者比较什么", "原文依据", "研究比较墨西哥两个社区，在现有生产系统重新配置与加入玉米—南瓜、MIAF果树复合系统的情景下，考察营养、收入、劳动、侵蚀和碳等表现。没有新种植系统时，一个社区即使扩张农业面积也难以达到全部营养自给要求。", "摘要、Methods与情景结果"], ["营养自给的分子分母", "教学解释", "本地生产可供给某种营养的总量除以对应人群需求，是生产端自给指标。它不证明每个人实际吃到、买得起、吸收了这些营养；社区总量也不能表达家庭分配。每种营养单独足够，仍可能受季节可得性、损耗和饮食偏好约束。", "原文研究边界与教学说明"], ["不能把植物多样化写成B12来源", "分析提醒", "读这种研究要追踪每项营养来自何种产品。不能因为增加果树和蔬菜提高了总体营养表现，就宣称植物系统直接提供可靠的维生素B12。模型里的动物产品、产品用途和约束需要单独核算。\n\n练习：某社区蛋白质供给达需求120%，其中40%出口。仅看120%能否判断居民摄入充足？", "教学边界说明"], ["与海南怎么连", "迁移建议", "可借鉴营养目标和景观配置的连接，但海南系统、居民结构、贸易和食物偏好都需重建。不要复制墨西哥情景的17%面积变化作为海南参数。接[[ditzler-2019|家庭模型]]能补上部分家庭预算与食物购买边界。", "情景迁移建议"]], "quiz": [["营养自给达到100%是否等于没有营养不良？", "不是。生产供给与实际可获得性、分配、消费和生物利用不是同一层面的证据。"]], "related": ["indicators", "ditzler-2019", "landscape-2018", "nutrients"]}, {"id": "ditzler-2019", "type": "paper", "author": "Lenora Ditzler及合作者", "year": 2019, "stage": "家庭系统", "title": "农场利润之外：家庭的钱、时间和食物", "en": "A model to examine farm household trade-offs and synergies with an application to smallholders in Vietnam", "citation": "Ditzler, L., et al. (2019). Agricultural Systems, 173, 49–63.", "url": "https://doi.org/10.1016/j.agsy.2019.02.008", "evidence" 础必修", "minutes": 25, "tags": ["Multi-objective", "Dominance"], "summary": "会亲手比较两行数据，比背诵最优定义更重要。", "sources": ["liang-2022", "liang-2023", "farmdesign-2012"], "sections": [["从两目标开始", "教学解释", "设利润越大越好，用水越小越好。A=(100,30)，B=(80,40)，A支配B，因为两项都不差且至少一项严格更好。C=(120,50)与A互不支配：多赚20但多用20水。完全相同的两行不互相严格支配。"], ["正式定义与方向统一", "教学推导", "将所有目标变成最小化：成本类保持原值，收益类取负号。a支配b，当且仅当每列a[k]≤b[k]，且至少一列a[k]\u003cb[k]。\n\n第一前沿F1是不被任何其他可行点支配的点；移走F1，再从剩余点找F2，依次得到rank。首先检查可行性，不能让超出水/劳动上限的方案混入前沿。"], ["三个重要限制", "分析提醒", "样本前沿只对当前样本成立；启发式算法的前沿是搜索到的近似集合；只有完整遍历一个明确定义的有限可行域时，才可对该有限域作完整声明。\n\n目标越多，互不支配往往越常见。非支配不等于均衡、不等于可采纳、不等于所有指标达到社会阈值。需要后续解释与决策。"], ["权重不是原罪", "教学解释", "加权和是有条件适用的方法，不是错误方法：权重要有含义，尺度需明确，还要注意某些非凸前沿点可能无法通过线性加权获得。Pareto探索的优势是先展示取舍；之后选择指标、归一化、距离或阈值仍包含价值判断。\n\n到[[lab|交互实验室]]逐项开关目标，观察前沿怎样改变。"]], "quiz": [["A和B所有指标完全相同时，A支配B吗？", "严格Pareto支配要求至少一项更好，因此不支配。应说明重复点的保留策略。"], ["某方案支配全部已观测农场，能证明现实全局最优吗？", "不能，只能说明相对这些观测、指标和边界的表现。"]], "related": ["ideal-distance", "efficiency-score", "lab", "liang-2022"]}, {"id": "ideal-distance", "type": "method", "title": "MIDIP与HDIP：靠近理想点还是只是均匀", "stage": "基础必修", "minutes": 25, "tags": ["MIDIP", "HDIP", "Normalization"], "summary": "一个手算例子，分清整体距离和维度间不均衡。", "sources": ["liang-2022"], "sections": [["理想点可能不存在", "教学解释", "每列取观测中最好值，拼成理想点。利润最高者与用水最低者可能不是同一个农户，所以理想点通常只是参照，不是一张可以直接照做的现实配方。"], ["原文定义与手算", "原文方法教学", "按[[liang-2022|梁2022]]定义，先将群组中心到各列理想值的距离除以该列观测范围。假设得到d=(0.2,0.2,0.2)，MIDIP=√0.12≈0.346，HDIP=0。另一组d=(0,0,0.5)，MIDIP=0.5，HDIP约0.289。前者整体更接近且更均衡。\n\n但d=(0.8,0.8,0.8)的HDIP也为0，整体却差。不能只看HDIP。"], ["实现细节会改变排名", "教学解释", "标准化范围用全体还是子集？先标准化后取均值，与某些非线性变换后再取中心是否等价？理想点是否纳入不可行方案？极端值是否扩大范围？这些都应写进方法。\n\n常数列范围为0时，可明确剔除其区分作用或单独报告。本课代码选择常数列距离为0，并保留审查说明；这属于教学实现约定。"], ["实践", "教学练习", "用pareto_lab.py计算两个群组中心的MIDIP/HDIP，再人为加入一条极端高成本记录。观察其余方案距离是否变化。解释为什么这不是性能实际改变，而是参照系变了。"]], "quiz": [["MIDIP是距离的平均值吗？", "梁2022这里是标准化距离的欧氏范数，即平方求和开根号。"], ["HDIP=0是否代表理想方案？", "不是，仅说明各指标离理想点的距离相同。"]], "related": ["pareto", "indicators", "liang-2022", "lab"]}, {"id": "efficiency-score", "type": "method", "title": "Pareto efficiency score：别把“全部”读成“至少一个”", "stage": "进阶必修", "minutes": 30, "tags": ["Subsets", "Pareto efficiency"], "summary": "把目标子集逐个枚举，就能看懂梁2023的第二层筛选。", "sources": ["liang-2023"], "sections": [["为什么需要第二层筛选", "教学解释", "多目标空间中，一个点可能仅凭某一项极端优势保留在前沿。作者希望进一步描述方案在不同目标组合中的表现，而不是把全部非支配点都当作折中优良。"], ["定义中的量词", "原文方法教学", "对某个完整目标集下非支配的方案i，依次尝试k=1,...,K。列举所有含k个目标的子集，若i在每一个这样的子集中都非支配，则记录第一个满足条件的k。这就是[[liang-2023|原文]]使用的得分逻辑；分数较小表示在更少目标的各种组合下也经得住比较。\n\n分数不是被支配点的数量、不是出现概率、不是权重和。原文125方案的选择还使用了参照轮作的分数阈值。"], ["三目标例子", "教学推导", "所有目标最小化：A=(1,1,1)，B=(0,2,2)，C=(2,0,2)，D=(2,2,0)。四个点在完整三目标中均非支配。A不是任何单列的最低值，所以不能得1；但任取两列，A都不会被其他点支配，所以A得2。\n\nB在第二、第三目标组成的子集中被A支配；C在第一、第三目标中被A支配；D在第一、第二目标中被A支配。因此B、C、D都需要到k=3才满足所有子集的条件。这个例子展示均衡方案与单项极端优势方案的差别。"], ["实现与计算成本", "教学解释", "目标子集总数为2^K−1，目标很多时开销迅速增加。应先明确比较集合、重复点和方向。教学实现面向小数据，优先透明正确；不能把它当成处理百万方案的高效工业实现。\n\n代码附单元测试：A得2，B/C/D得3。精确复现论文还需使用作者定义的候选集合和相同输入。"]], "quiz": [["只要一个两目标组合不被支配，分数就是2吗？", "不是，必须所有大小为2的子集中都满足。"], ["目标数太多时，子集枚举为什么慢？", "可能需要检查指数数量的子集，每个子集还有非支配比较。"]], "related": ["pareto", "liang-2023", "lab"]}, {"id": "positive-deviance", "type": "method", "title": "Positive deviance：向谁学习，而不是删除谁", "stage": "基础必修", "minutes": 20, "tags": ["Benchmarking", "Observation"], "summary": "这里的正向偏离不是需要清洗掉的异常值。", "sources": ["liang-2022", "toorop-2023", "xu-thesis"], "sections": [["共同思想，不同识别程序", "教学解释", "在相似约束下找出现实中表现较好者，研究其做法。识别可以来自多指标统计，也可以来自访谈提名和个案判断。梁2022与Toorop2023不是同一算法。"], ["先问可比性", "教学解释", "资金、土地、水源、家庭劳动、市场距离和风险暴露不同，都会改变能做到什么。一个有冷链和稳定买家的农场不能直接当作所有小农的可复制榜样。选择样本时应说明可比范围；无法消除的差异应保留为解释限制。"], ["与优化的边界", "教学解释", "正向案例是已经观察到的系统；优化方案可能从未实施。前者有现实存在性但因果识别弱，后者能探索更大空间但依赖模型假设。二者可互补，不能相互替代。"], ["练习", "教学练习", "给一个你熟悉的高绩效农场写三栏：已观察到的优势、可能的管理解释、尚未排除的资源优势。不要在第二栏使用“导致”一词，除非有相应设计支持。"]], "quiz": [["所有positive deviance研究都用Pareto吗？", "不是。识别方式要逐篇查Methods。"]], "related": ["liang-2022", "toorop-2023", "causality", "typology"]}, {"id": "indicators", "type": "method", "title": "指标：单位、方向、分母与系统边界", "stage": "基础必修", "minutes": 30, "tags": ["Indicators", "MCI", "Aggregation"], "summary": "许多看似算法错误，其实是数据列定义错了。", "sources": ["liang-2022", "liang-2023", "xu-2024", "novotny-2024"], "sections": [["每列至少写六件事", "教学解释", "名称、物理含义、单位、时空边界、数据来源、改善方向。再注明它是测量、估算、代理还是感知。N盈余、N损失与N淋溶不能同名；毛利与净利润不能互换；药剂频次与kg有效成分不是同一量。"], ["面积加权手算", "教学推导", "地块A面积1 ha，每ha用水100；B面积3 ha，每ha用水200。农场总量=1×100+3×200=700；农场单位面积均值=700/4=175。直接取(100+200)/2=150会错误地让小地块和大地块占同等权重。"], ["时间分母也会改变结论", "教学推导", "方案A一年两季共用200小时，每季平均100小时；方案B一年一季用150小时。B年度省工，A每季省工。两种陈述都能对，但回答的问题不同。多年生系统还需说明建园期、盛果期和更新期。"], ["方向必须带情境", "分析提醒", "在养分过量地区减少盈余可能有益；在土壤养分耗竭地区，机械追求盈余越低越好可能恶化系统。劳动减少对劳动力不足家庭有利，但不自动等于当地就业目标改善。方向来自问题定义，不是所有地区永远相同。"], ["代码前检查", "教学练习", "用下载包中的data_dictionary.csv，为你准备分析的7列逐项填写定义。任何一列说不清单位或来源，暂时不进入Pareto。"]], "quiz": [["亩与公顷换算未统一会有什么后果？", "指标和资源约束可能系统性放大或缩小15倍，使优化结果看似合理但物理上错误。"]], "related": ["data-schema", "nutrients", "pareto", "xu-2024"]}, {"id": "pca-cluster", "type": "method", "title": "PCA与HCA：把方案整理成可解释的类型", "stage": "方法工具", "minutes": 30, "tags": ["PCA", "HCA", "R"], "summary": "降维和聚类是组织差异，不是自动发现自然真相。", "sources": ["liang-2023", "xu-data-2024", "liang-2022"], "sections": [["PCA保留什么", "教学解释", "对已明确变换和标准化的矩阵，PCA寻找最大方差方向。成分是原变量的线性组合，不是天然的“可持续性总分”。一个解释方差大的轴，不一定最重要于你的决策问题。"], ["聚类选择不是纯技术细节", "教学解释", "变量、标准化、距离、连接方式和类别数都影响分组。Ward的最小方差解释对应欧氏几何；若忠实复现一篇报告其他距离组合的研究，应先如实重现并说明限制，再单独做敏感性检查，而不是静默换掉作者方法。"], ["不要把不同论文设置混用", "原文方法教学", "梁2022的优秀案例聚类与梁2023的PCA后方案分类不是同一步骤。曲周数据文章还采用轮廓系数与后续细分处理。教程可以给通用示例，但不能把教程的默认选项写进原文Methods。"], ["R最小骨架", "教学代码", "Z \u003c- scale(X)\npc \u003c- prcomp(Z, center = FALSE, scale. = FALSE)\n# 根据研究目的与解释度选择PC数，不机械固定为2\nhc \u003c- hclust(dist(pc$x[, 1:k, drop = FALSE]), method = 'ward.D2')\ngroup \u003c- cutree(hc, k = g)\n\n这是欧氏距离教学实现，不是任何一篇论文的完整原始脚本。下载包另附可运行示例。"], ["验收标准", "教学练习", "对同一数据分别按原始指标和PCA得分聚类，改变标准化或类别数。记录哪些对象稳定同组、哪些经常换组。给每类写描述而不是道德标签，最后检查它是否有实际管理意义。"]], "quiz": [["PC1可以直接称为总体可持续性吗？", "不能，PCA按方差而不是按价值或可持续性准则定义轴。"]], "related": ["typology", "liang-2023", "xu-data-2024", "liang-2022"]}, {"id": "rotation", "type": "method", "title": "ROTAT式规则生成与时空约束", "stage": "建模必修", "minutes": 35, "tags": ["ROTAT", "Enumeration", "Constraints"], "summary": "先明确允许什么，再决定怎样搜索。", "sources": ["liang-2023", "farmsteps-2026"], "sections": [["生成器需要的最小输入", "教学解释", "活动集合、开始结束时间、前后衔接规则、最小返回间隔、最大频次、土地适宜性和规划边界。把同一种作物的春播、夏播写成不同活动节点，能表达不同时间条件。"], ["顺序规则与数量约束", "教学推导", "顺序规则如豆科之后不马上再种同组作物；地块资源约束如面积与灌溉适宜性；横向农场约束如Σ area[p]×labour[p,t] ≤ available_labour[t]。\n\n先在地块序列生成时剪掉违反农艺规则的分支，通常比先生成所有组合再逐个淘汰省计算。"], ["组合爆炸为何出现", "教学推导", "每个地块有m条候选序列，n个地块组合就可能有m^n种。枚举适合受控离散问题；规模扩大后可能需剪枝、数学规划或启发式搜索。选择方法应取决于模型结构，而不是哪个名字更新。"], ["你现在该做的练习", "教学练习", "把2块地×3期×3活动写在纸上。要求同活动不连种，每期劳动不超过上限。先列局部可行序列，再组合筛选。离线包的sequence_lab.py实现了这个透明小例子，不代表ROTAT或FarmSTEPS原软件。"]], "quiz": [["为何有时候两块地各自可行，合起来不可行？", "它们可能同一时间共同超过劳动、水或资金上限。"]], "related": ["farmsteps-2026", "liang-2023", "whole-farm", "lab"]}, {"id": "whole-farm", "type": "method", "title": "全农场模型：参数、状态、决策与约束", "stage": "建模必修", "minutes": 35, "tags": ["Farm model", "Resource flows", "Decision variables"], "summary": "一个模型不等于一条回归，也不等于一组软件菜单。", "sources": ["farmdesign-2012", "ditzler-2019", "qu-2025"], "sections": [["四类量", "教学解释", "参数：暂时给定的单产、价格、转化率；状态：系统当前存量；决策：本期能调整的活动与资源分配；输出：给定前述量计算的绩效。年度稳态模型可能不显式追踪逐日状态，因此不能假装包含所有动态反馈。"], ["最小代数模型", "教学推导", "设x为粮食面积，y为饲草面积，n为牲畜数量。土地约束x+y≤A；饲料约束q_f×y+feed_import≥feed_need×n；劳动约束l_x×x+l_y×y+l_n×n≤L。利润由销售减成本计算，环境指标另算，不先强行相加。\n\n增加n会改变饲料进口、粪肥、劳动和收入。某一模块缺失，可能让优化器利用不真实的漏洞。"], ["边界内流与边界外流", "教学解释", "自产饲料喂动物、粪肥回田是内部流，计算全场外部投入时要抵消。产品出口、肥料进口才跨边界。扩大边界到地区后，原来两个农场之间的贸易又成为内部流。"], ["最小可信模型优先", "迁移建议", "先让守恒、约束和基线配置可解释，再增加空间、季节或新产业模块。新模块应有明确科学问题和数据来源。复杂度不是创新性证明。[[validation|模型测试]]应从第一个模块就开始。"]], "quiz": [["为什么优化器会找到现实荒谬的高利润方案？", "常见原因是缺少约束、单位错误、参数域不合理或遗漏关键成本和过程。算法只是利用了你给定的模型。"]], "related": ["nutrients", "validation", "farmdesign-2012", "farmsteps-2026"]}, {"id": "nutrients", "type": "method", "title": "N收支、循环与污染转移", "stage": "建模必修", "minutes": 25, "tags": ["Nitrogen", "Mass balance", "FarmM3"], "summary": "先守恒，再讨论效率；先定边界，再比较盈余。", "sources": ["farmdesign-2012", "xu-2024", "qu-2025"], "sections": [["最基本的守恒式", "教学推导", "输入 − 产品输出 − 损失 = 存量变化。若你把存 12-31的暂不开放提示；不据此推断已发表章节论文无法获取。", "WUR官方Download PDF正常浏览器入口，2026-09-29"]], "quiz": [["顶部显示“仅本地”时，换手机是否已经有刚写的笔记？", "没有。必须先连接私有同步并等待GitHub确认，程序已经发布不代表浏览器里的旧笔记已经上传。"]], "related": ["research-framework"]}, {"id": "release-510", "type": "guide", "title": "v5.1.0：版本号与保护笔记的自动更新", "stage": "更新记录", "minutes": 4, "summary": "程序更新不等于私人数据已同步；默认自动检查，正在编辑或连接同步时延后刷新。", "sections": [["看懂三个状态", "使用说明", "页头v5.1.0是程序版本；内容校验值用于辨认准确构建；顶部云端状态表示私人数据是否已获GitHub确认，三者不能互相替代。"], ["自动更新如何保护阅读", "使用说明", "新版本先下载核心资源，再询问同一站点的所有标签页是否可以切换。输入、选字、导入、翻译或当前GitHub会话未结束时，不强制刷新。已经做过完整离线缓存的设备，更新后自动补齐新增资源；失败时保留旧数据。"], ["授权处理边界", "使用说明", "免填令牌的长期登录需要受保护的服务端。目前仍等待安全托管连接，不能宣称已配置或把共享密钥放进网页。已有手动会话同步保留可用。"], ["继续完善的带读", "学习建议", "进入[[reading-proof-workflow|完整论文带读验收]]，先完成从问题到证据的整篇论证，再进入术语和方法细节。"], ["徐展博士论文补读", "原文核对", "完整PDF已在私有库校验。新增[[xu-chapter4|第4章方法链]]与章节定位，明确8项评价与7项优化目标的区别；不把正文核读说成全部附录、图表和作者代码已经复现。", "依据原件目录及§4.2.3.4"]], "related": ["research-framework", "reading-proof-workflow", "xu-chapter4"]}, {"id": "reading-proof-workflow", "type": "guide", "title": "把一篇论文完整读通：从研究问题到可以复述、检验和迁移", "stage": "体系化带读", "minutes": 45, "summary": "先建立整篇研究的因果与论证顺序，再理解工具。以下是本站教学组织，不替代论文目录；数字案例均为自编。", "sections": [["第一遍：只抓住作者为什么非得做这项研究", "教学带读", "先不要打开软件，也不要遇见缩写就立即跳走。读题名、摘要、引言末段和结论，各写一句话：现实中的矛盾是什么，已有工作缺什么，本文具体补什么，最后拿什么证据回答。四句话应指向同一个问题。若摘要谈多功能农场，你却把问题写成‘比较一种肥料效果’，需要回到系统边界重新判断。\n\n以[[liang-2022|梁2022]]为例，主线不是证明某一项技术普遍最好，而是从已观察系统中寻找多指标表现突出的案例。因此研究首先需要一个可比较的案例集合。先把这个前提抓稳，再进入指标和算法，才知道每个技术步骤为什么存在。", "研究范围见对应论文带读中的原文出处；本节为学习组织"], ["第二遍：弄清每一行数据究竟代表谁", "教学带读", "接着查Methods的研究区、抽样、时间和数据处理。把一行究竟是人、家庭、农场、地块、村庄，还是模型生成的方案写出来，并给每个数字注明所在层级。[[xu-data-2024|曲周数据论文]]的访问数、有效家庭数和作物活动记录数并不属于同一张表；[[cheng-2023|程2023]]的调查人数也不等于RDA的分析行数。\n\n现在画一个简单的数据关系：村庄包含农场，农场包含地块，地块在不同时间包含生产活动。同一个farm_id出现多次可能是合法的一对多，不能凭重复ID删行。完成这一步以后，你才有资格讨论样本大小、独立性和代表性。", "对应数据与调查论文Methods；关系图为教学表达"], ["第三遍：每个方法只能回答一个明确的子问题", "教学带读", "不要把Methods抄成‘Pareto、PCA、聚类、优化’四个名词。改写成输入→操作→输出→为什么还需要下一步。比如：指标矩阵输入非支配排序，得到互不全面压倒的方案；这些方案仍可能有很不同的优势结构，所以再分类；分类只能整理差异，不能自动证明某一类最适合所有人。\n\n到[[liang-2023|梁2023]]时，要另外加入候选生成环节。规则生成器决定哪些方案被允许进入比较，评价模块决定怎样描述好坏，筛选模块决定留下哪些，解释模块把大量结果整理成可讨论的选择。到[[farmsteps-2026|FarmSTEPS]]，则继续问：单块地可行以后，整个农场是否在同一时期还有足够水和劳动？每一步都应能接上前一步留下的问题。", "方法链分别以三篇论文为依据；不得把不同论文的具体参数混用"], ["用一个贯穿例子理解支配、约束和最终选择", "自编教学例子", "以下三个农场完全虚构，利润越高越好，用水和劳动越低越好。A的利润100、用水30、劳动60；B为80、40、80；C为120、50、50。A在三项上都好于B，所以B被A支配。A与C则各有优势，互不支配。\n\n现在加入水资源上限40，C先因不可行被排除，而不是因为‘综合得分不够高’。如果水上限放宽到60，但家庭劳动最多55，A又不可行，C可以。这个例子说明：非支配排序、可行性与人的选择是不同环节。不能把一个前沿点直接称为现实最优处方。\n\n再假设C的市场价格容易下降。你需要先定义情景，再比较风险，不是简单在表后加上‘适应性强’。进入[[lab|交互实验室]]时，带着这条完整逻辑改数值，而不是随便拖动几个参数观察漂亮图形。", "本站原创，不是任何论文的原始数据、单位或研究结论"], ["第四遍：一张结果图要读出问题、答案和边界", "教学带读", "看到一张图，先读图题与坐标，再确认点、线、颜色和误差条分别代表什么。问它对应研究链的哪个子问题。Pareto散点图展示的是指标之间的取舍，不自动证明因果；PCA图展示特定变量和标准化下的主要差异，不自动给出可持续性总分；Q方法中的典型排序是共同观点，不是整个人口的概率分布。\n\n把图中的一个结论改写为带限定词的句子：‘在这个样本内’、‘在给定模型和约束下’、‘在这些情景中’。然后回Methods检查这个限定是否足够。遇到公式或表格排版不可靠时，使用原图核对，不根据被拆散的字符猜测上下标。", "结合[[breure-2024|权衡分析综述]]与对应论文；读图步骤为教学整理"], ["第五遍：理解了原文以后，才讨论海南迁移", "研究迁移建议", "先写本文实际做了什么，再另写自己准备借用什么，两栏不能混在一起。例如可以借鉴[[cheng-2025|Q方法]]表达相对优先级，但不能因此声称它已经预测农户会采用哪项技术；可以借[[farmdesign-2012|年度全农场模型]]整理养分与经济平衡，但不能把它直接当成每日作物过程模拟。\n\n对于海南PhD2，先确认土地、养分、水和劳动的边界以及作物、牲畜、水产的必要联系。工具是否适用，取决于科学问题、数据和可实现的模型结构，而不是论文用了哪个热门软件。迁移表至少写清：保留的机制、必须重估的参数、需要新增的约束、无法验证的假设，以及与PhD1交换什么信息。", "迁移建议不是项目新增硬任务，以导师确认的研究范围为准"], ["完成标准：给自己做一次闭卷复述", "学习验收", "不用论文和本站，连续讲五分钟：为什么研究、研究谁、如何把数据变成证据、各步骤为何相连、最重要的结果及限制。不能只列工具名。随后手算一个小例子，指出哪些输入一改就会改变结论，最后列出完整复现还缺哪些作者数据、脚本和参数。\n\n把这段复述写到[[workbook|带读工作表]]中，再回到原文核对。若只卡在一个词，点术语解释；若不能说明前后两步的关系，回到整篇框架。最终目标不是‘看过全文’，而是能正确复述、有依据地检验，并知道哪里还没有掌握。", "该验收为本站教学设计，不承诺固定天数即可掌握全部理论与工具"]], "quiz": [["为什么不能把Methods理解为一组工具名称？", "工具只完成研究链的一部分。需要交代每一步接收什么、解决哪个子问题、产生什么，以及为什么还要下一步。"], ["在教学例子中，为什么水上限40时C不能因利润高而保留？", "它违反硬性水资源约束。可行性筛选与偏好权衡不同，不能让收益抵消未允许违反的约束。"], ["还没取得作者数据，能否声称复现了论文全部结果？", "不能。可以进行清楚标记的机制练习，但结果复现还需要相应原始数据、清洗规则、参数和运行设定。"]], "related": ["research-framework", "course", "liang-2022", "liang-2023", "cheng-2025", "hainan-map", "validation", "xu-chapter4"]}, {"id": "xu-chapter4", "type": "guide", "title": "徐展博士论文第4章：把农场差异、优秀实践和系统优化真正接起来", "stage": "博士论文章节带读", "minutes": 65, "citation": "Xu, Z. (2025). Exploring options for a more sustainable crop production on the North China Plain. Chapter 4, printed pp. 163–204; supplementary material starts on p. 205. DOI: 10.18174/681150.", "url": "https://doi.org/10.18174/681150", "evidence": "完整322页PDF已在私有库校验。本页已核读目录、第4章正文方法及相关结果/讨论文字；本轮没有逐图检查全部附录，亦未运行作者数据。章节题页当时注明拟投稿，不据此判断今日期刊发表状态。", "summary": "先分类，再寻找同类优秀案例，再用FarmDESIGN比较重新配置与改进管理的不同作用。特别区分：8个评价指标，并非8个同时进入优化器的目标。", "sections": [["先把整本博士的逻辑放在眼前", "原文目录与教学组织", "这本论文的目录不是四个互不相关的工具展示。第1章为总引言；第2章研究华北平原粮食主导地区种植系统的多样性与可持续性，印刷页35起；第3章比较小农与经营型农场，页101起；第4章考察社区内已有优秀实践怎样改善小农生产，页163起；第5章为综合讨论，页267起。第4章补充材料从页205开始。\n\n全文文件有322个PDF页面，而书内印刷页码、前置页和目录书目页数不是同一个量。阅读时优先按章号、小节和书内印刷页定位。本页把第4章当作连接‘认识差异’与‘设计改进’的环节，不把它伪装成已经核实有独立DOI的期刊论文。", "PDF第9页目录；第173页为第4章题页，注明 This chapter will be submitted for publication；引文只用于版本状态说明"], ["为什么先分类，而不是直接找全县最优农场", "原文依据与教学解释", "第4章使用486个小农场数据，不把19个经营型农场混进同一组来寻找小农优秀案例。作者先根据农户、家庭和农场的11项属性构建类型，再在各类型内部评价和寻找正向案例。PCA保留特征值大于1的成分，随后采用Ward.D2层次聚类，并结合肘部图判断类别数。结果保留4个主成分、解释67%的变异，得到省工型260户、全职型204户和资源较充裕型22户。\n\n这样做的逻辑是：投入农场劳动的家庭和主要依靠非农工作的家庭，现实资源约束不同。把它们直接放在同一条排行榜上，会混淆‘管理更好’与‘能投入更多资源’。分类是为解释和设计服务，并不是把人固定贴成永久不变的类别。作者也指出类型是某一时期的截面。", "§4.2.2、§4.2.3.1、§4.3.1及§4.4.1；印刷页169–171、177–178、190–191"], ["同类中的优秀案例为什么还要筛两次", "原文依据", "作者对每类农场计算8项年度指标，涵盖氮盈余、灌溉、农药施用频次、作物多样性、毛利、劳动、膳食能量和维生素C供给。先用R的eaf包进行Pareto排序，保留第一前沿；再聚类，并用MIDIP、HDIP判断哪些群组在各维度之间较为均衡。理想点按同一农场类型内部各指标的最好值构成。\n\n第一前沿不等于所有指标都很好。作者需要第二层筛选，正因为很多目标下可能出现大量互不支配的系统。研究中被选群组的MIDIP和HDIP均较低，但作者在讨论中同时承认：优秀系统并没有在所有指标上都显著胜过其他系统，尤其小类样本较少。不要把‘被选为优秀’改写成‘所有绩效已得到因果验证的全面优势’。", "§4.2.3.2–4.2.3.3，印刷页172–174；§4.4.2，页191–193"], ["四个情景是在拆开两种改进机制", "原文依据与教学解释", "SC1是各农场类型的平均基线。SC2是同类型优秀系统的平均种植配置和管理。SC3使用基线平均投入产出系数，让FarmDESIGN重新配置种植系统面积。SC4在重新配置的同时，优先采用优秀系统中的投入产出系数；某种种植系统没有对应优秀实践时，仍使用原来的平均系数。\n\n因此，SC3主要问‘不改变活动绩效参数，换组合有没有机会’，SC4进一步问‘组合变化与已有较佳管理一起使用，机会空间会怎样变化’。SC2则提供现实优秀系统参照。不能把四者都称作优化算法生成的情景，也不能说SC4给所有活动都换上了经过验证的最佳技术。\n\n这是本章最值得迁移的一步：明确每个情景改变了什么、没改变什么。这样结果差异才能对应清楚的研究问题，而不是把面积、投入与目标同时乱改后只比较总分。", "§4.2.3.4，印刷页174–177；详细参数与变量范围指向原文补充方法S4.7、S4.8，本轮未逐表核对"], ["重要核对：8项评价，不等于8项都进优化器", "原文方法细节", "本章摘要和前文概括8项可持续性目标，但§4.2.3.4后半明确说明：实际优化模型包含7个目标，作物多样性是在生成方案之后再评价。正确理解应同时保留这两个层次，不能只读摘要就写成‘优化器同时优化8个目标’。\n\n作者采用Pareto-based Differential Evolution。每个类型与情景设置4000次迭代，得到2000个候选农场配置，报告F=0.15和CR=0.85。生成之后再次用PCA、聚类与理想点距离选择折中配置。这里的计算参数属于这一章，不能套给FarmSTEPS的枚举流程。启发式搜索得到的方案，也不能据此宣称已数学证明现实全局最优。", "§4.2.3.4，印刷页175–176；最后一句为教学边界说明"], ["怎样读结果而不夸大全县推广效果", "原文依据与局限", "作者的主要结果是：种植系统重新配置与较佳管理结合，可以在模型分析中改善多项指标，但劳动需求会增加，且不同类型的可行调整不一样。SC4在部分生产、经济和养分指标上表现突出，SC3、SC2或基线则可能在多样性、灌溉或劳动等指标上更好，没有一个情景同时最大化所有目标。\n\n汇总时使用的是样本内各农场类型的面积权重。作者明确写明，这反映所调查小农的聚合潜力，不是拥有全县各类型面积统计支持的全县精确预测。原研究对非等比例抽样作了重抽样敏感性分析，但这不把条件性模型结果变成已经实施后的社会经济收益。\n\n原图尚未在本轮逐像素复核；阅读Fig.4.5和4.6时应回原件检查种植组成、归一化方向、比较基准及图注，不仅依靠这里的文字概括。", "§4.3.4，印刷页187–189；§4.4相关讨论；图形仍须原件核对"], ["用一个小练习检验你是否理解SC3和SC4", "自编教学练习", "假设农场只有粮食和蔬菜两种活动，土地与劳动上限固定。第一轮保持两种活动的每公顷投入产出不变，只改变面积，记录毛利和用水的可行组合，这对应重新配置的思想。第二轮只给确有较佳管理依据的蔬菜活动换一个投入产出组合，粮食参数不动，再搜索。\n\n对比两个可行集合，并回答：改善来自换面积，还是活动本身的投入产出关系改变？哪种方案仍会超出劳动上限？没有采纳调查时，能否宣称农户愿意照做？这些教学活动和数值需要你自行明示，不是原作者的数据或完整复现。\n\n回到海南时，可借用这种分解逻辑，但种养、水产、季节资源约束和PhD1接口需要重新定义。不要把一章成功的框架当成模型和参数都可原封不动搬过来的理由。", "原创教学练习；对应方法思想见§4.2.3.4；不新增博士硬任务"]], "quiz": [["本章实际优化器使用几个目标？", "7个。共评价8项指标，但作物多样性在方案生成后评价；摘要层的8项概括不能替代方法细节。"], ["SC3和SC4最关键的区别是什么？", "二者都优化配置；SC3使用同类型平均投入产出系数，SC4对有相应优秀实践的活动改用优秀系统系数，没有对应优秀实践的活动保留原平均参数。"], ["论文的汇总改善百分比是全县已经实现的效果吗？", "不是，是按样本类型面积加权的条件性改进潜力。作者说明总体类型面积未知，也没有把所有设计作为实施试验来验证。"]], "related": ["xu-thesis", "xu-data-2024", "xu-2024", "liang-2022", "farmdesign-2012", "typology", "reading-proof-workflow"]}], "files": {"README.md": "# 教学练习，不是论文原始复现\n\n所有数值均为自编示例，不能用于农业建议、论文结果或真实海南农场结论。\n\n```bash\npython pareto_lab.py --test\npython pareto_lab.py\npython sequence_lab.py\nRscript multivariate_lab.R\n```\n\nPython脚本仅用标准库；R脚本仅用基础函数。首次安装Python/R后可离线运行。单元测试检查支配关系、重复点、层级排序、全部目标子集的效率分数、理想点距离与常数列处理。\n\n第一课验收：能手算A/B/C之间的支配，说明重复点E为什么仍可保留，说明改变劳动目标如何影响方案F。\n第二课验收：能证明[1,1,1]在全部两目标组合下非支配，而[0,2,2]在后两目标中被支配。\n第三课验收：把每期劳动上限改成8或10，解释可行域变化。模型没有真实生长过程、价格反馈或风险。\n\n完整结果复现还需作者数据、清洗规则、参数、补充材料和版本信息。详细分级见网站“核验与勘误”。\n", "data_dictionary.csv": "variable,entity,unit,time_boundary,source_type,direction,missing_policy,notes\nfarm_id,farm,identifier,not_applicable,assigned,not_applicable,not_allowed,Stable pseudonymous key\nplot_area,plot,ha,survey_date,measured,not_applicable,flag_missing,Do not mix ha and mu\nactivity_id,plot_activity,identifier,season,assigned,not_applicable,not_allowed,Unique joint plot-season-activity identifier\nnitrogen_input,plot_activity,kg_N_per_ha,season,reported_or_measured,context_dependent,do_not_replace_with_zero,Separate source and uncertainty\nwater_input,plot_activity,m3_per_ha,season,reported_or_measured,context_dependent,do_not_replace_with_zero,Not automatically groundwater depletion\nlabour_use,plot_activity,h_per_ha,season,reported,context_dependent,flag_missing,Distinguish family hired and machinery services\nnet_revenue,farm,currency_per_year,year,calculated,maximize,flag_missing,Specify rent family labour and subsidies boundary\n", "multivariate_lab.R": "# Synthetic teaching example; NOT authors' code or Quzhou/Hainan observations.\n# R base functions only. Run with Rscript multivariate_lab.R.\nset.seed(19)\nX \u003c- data.frame(profit=rnorm(30,100,10), water=rnorm(30,50,6), labour=rnorm(30,80,8))\nstopifnot(!anyNA(X), all(vapply(X, sd, numeric(1)) > 0))\npc \u003c- prcomp(X, center=TRUE, scale.=TRUE)\nprint(summary(pc))\n# Retaining two PCs is an educational choice, not a paper-specific setting.\nhc \u003c- hclust(dist(pc$x[,1:2,drop=FALSE]), method='ward.D2')\ngroup \u003c- cutree(hc,k=3)\nprint(aggregate(X,list(cluster=group),mean))\nwrite.csv(data.frame(X,cluster=group),'synthetic_cluster_output.csv',row.names=FALSE)\n# For scientific use, assess variable selection, PCs, cluster stability and context.\n", "pareto_lab.py": "\"\"\"Synthetic teaching examples, NOT author data or full paper replication.\nRun: python pareto_lab.py --test ; python pareto_lab.py\nPython 3.10+, standard library only. All numeric objectives are minimized.\n\"\"\"\nfrom itertools import combinations\nfrom math import isfinite, sqrt\nfrom statistics import stdev\nimport argparse, unittest\n\ndef validate(rows):\n    if not rows or not rows[0]:raise ValueError('Non-empty rectangular matrix required')\n    m=len(rows[0])\n    if any(len(r)!=m or any(not isinstance(v,(int,float)) or not isfinite(v) for v in r) for r in rows):raise ValueError('Finite rectangular numeric matrix required')\n\ndef dominates(a,b):\n    return all(x\u003c=y for x,y in zip(a,b)) and any(x\u003cy for x,y in zip(a,b))\n\ndef nondominated(rows):\n    validate(rows)\n    return [not any(j!=i and dominates(s,r) for j,s in enumerate(rows)) for i,r in enumerate(rows)]\n\ndef pareto_rank(rows):\n    validate(rows);remaining=list(range(len(rows)));rank=[0]*len(rows);level=1\n    while remaining:\n        flags=nondominated([rows[i] for i in remaining]);front=[i for i,ok in zip(remaining,flags) if ok]\n        for i in front:rank[i]=level\n        remaining=[i for i in remaining if i not in front];level+=1\n    return rank\n\ndef efficiency_score(rows):\n    \"\"\"Small transparent implementation: smallest k with ND in ALL k-subsets.\n    Compared against the complete supplied matrix. Dominated cases get None.\n    Complexity is exponential in objective count; not a production optimizer.\n    \"\"\"\n    validate(rows);n,m=len(rows),len(rows[0]);result=[None]*n\n    active={i for i,ok in enumerate(nondominated(rows)) if ok}\n    for k in range(1,m+1):\n        survives=set(active)\n        for subset in combinations(range(m),k):\n            flags=nondominated([[r[j] for j in subset] for r in rows])\n            survives.intersection_update(i for i,ok in enumerate(flags) if ok)\n            if not survives:break\n        for i in survives:result[i]=k\n        active-=survives\n        if not active:break\n    return result\n\ndef ideal_distance(centroid,population):\n    validate(population)\n    if len(centroid)!=len(population[0]):raise ValueError('Dimension mismatch')\n    distances=[]\n    for k,p in enumerate(centroid):\n        lo=min(r[k] for r in population);hi=max(r[k] for r in population)\n        distances.append(abs(p-lo)/(hi-lo) if hi>lo else 0.0)\n    return {'distances':distances,'MIDIP':sqrt(sum(v*v for v in distances)),'HDIP':stdev(distances) if len(distances)>1 else 0.0}\n\nclass Tests(unittest.TestCase):\n    def test_duplicate(self):self.assertEqual(nondominated([[1,1],[1,1],[2,2]]),[True,True,False])\n    def test_tradeoff(self):self.assertEqual(nondominated([[1,3],[2,2],[3,1]]),[True]*3)\n    def test_rank(self):self.assertEqual(pareto_rank([[1,1],[2,2],[3,3]]),[1,2,3])\n    def test_efficiency(self):self.assertEqual(efficiency_score([[1,1,1],[0,2,2],[2,0,2],[2,2,0]]),[2,3,3,3])\n    def test_dominated(self):self.assertEqual(efficiency_score([[0,0],[1,1]]),[1,None])\n    def test_distance(self):\n        r=ideal_distance([.2,.2,.2],[[0,0,0],[1,1,1]])\n        self.assertAlmostEqual(r['MIDIP'],sqrt(.12));self.assertEqual(r['HDIP'],0)\n    def test_constant(self):self.assertEqual(ideal_distance([2,1],[[2,1],[2,3]])['MIDIP'],0)\n    def test_bad(self):\n        with self.assertRaises(ValueError):nondominated([[float('nan')]])\n    def test_invariance(self):\n        x=[[1,3],[2,2],[3,1],[3,3]]\n        self.assertEqual(nondominated(x),nondominated([[a*10+7,b*2-1] for a,b in x]))\nif __name__=='__main__':\n    p=argparse.ArgumentParser();p.add_argument('--test',action='store_true');a=p.parse_args()\n    if a.test:unittest.main(argv=['pareto_lab.py'])\n    else:\n        rows=[[1,1,1],[0,2,2],[2,0,2],[2,2,0]]\n        print('SYNTHETIC DATA; minimize all objectives')\n        print('Rows:',rows);print('Non-dominated:',nondominated(rows));print('Efficiency scores:',efficiency_score(rows))\n", "sequence_lab.py": "\"\"\"Synthetic 2-plot / 3-period planning exercise. NOT FarmSTEPS source code.\"\"\"\nfrom itertools import product\nfrom pareto_lab import nondominated\nCROPS={'grain':{'profit':8,'water':5,'labour':2},'legume':{'profit':7,'water':3,'labour':3},'vegetable':{'profit':14,'water':8,'labour':7}}\nPERIODS=3;LABOUR_LIMIT=9\nseq=[s for s in product(CROPS,repeat=PERIODS) if all(s[t]!=s[t-1] for t in range(1,PERIODS))]\nplans=[]\nfor a,b in product(seq,repeat=2):\n    labour=[CROPS[a[t]]['labour']+CROPS[b[t]]['labour'] for t in range(PERIODS)]\n    if max(labour)>LABOUR_LIMIT:continue\n    profit=sum(CROPS[c]['profit'] for c in a+b);water=sum(CROPS[c]['water'] for c in a+b)\n    plans.append({'A':a,'B':b,'labour':labour,'profit':profit,'water':water})\nflags=nondominated([[-p['profit'],p['water']] for p in plans])\nassert all(max(p['labour'])\u003c=LABOUR_LIMIT for p in plans)\nprint('SYNTHETIC EDUCATIONAL PROBLEM; not paper case-study counts')\nprint('Sequences per plot:',len(seq),'Feasible plans:',len(plans),'ND plans:',sum(flags))\nfor p,ok in list(zip(plans,flags))[:12]:print(p,'ND=',ok)\n", "synthetic_farms.csv": "case_id,profit_score,water_score,labour_score,provenance\nA,100,30,80,SYNTHETIC_TEACHING_ONLY\nB,80,40,100,SYNTHETIC_TEACHING_ONLY\nC,120,50,90,SYNTHETIC_TEACHING_ONLY\nD,90,20,70,SYNTHETIC_TEACHING_ONLY\nE,100,30,80,SYNTHETIC_TEACHING_ONLY\nF,110,35,120,SYNTHETIC_TEACHING_ONLY\n"}, "application": {"schema": "paper.application.release.v1", "version": "5.1.0", "date": "2026-09-29", "title": "可见版本与保护笔记的自动更新", "changes": ["页头展示易读版本号，版本面板区分程序版本、内容校验值与云端保存状态。", "联网、回到前台与定期检查更新；新资源就绪且所有本站标签页安全后自动应用。", "编辑、选字、导入、翻译或会话授权同步期间延后刷新，不中断笔记与授权。", "修复多个标签页保存阅读位置时可能覆盖另一页整篇笔记的问题；并发内容保留核对。", "已有完整离线缓存的设备在新版本启用后自动补齐新增资源，不清除私人数据。", "补充徐展博士论文第4章的正文方法链，明确8项评价与7项优化目标的区别。"], "automaticUpdate": "idle-and-all-tabs-safe", "managedSignIn": "awaiting-secure-backend-connection", "credentialPolicy": "No credentials in source, public configuration, cache, logs or chat-derived records"}};
