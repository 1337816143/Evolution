<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f7f2ed">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>亲密关系成长中心｜加密访问</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="gate" class="gate-shell">
    <section class="gate-card" aria-labelledby="gate-title">
      <div class="brand-mark" aria-hidden="true">M</div>
      <p class="eyebrow">LOCAL ENCRYPTED ACCESS</p>
      <h1 id="gate-title">私人加密访问</h1>
      <p class="lead">私人内容以 AES-256-GCM 密文存放在 GitHub Pages。解密密码只在当前浏览器内使用，不会发送到 GitHub 或其他服务器。</p>

      <form id="unlock-form" autocomplete="off">
        <label for="password">解密密码</label>
        <div class="password-row">
          <input id="password" name="password" type="password" minlength="24" maxlength="256" autocomplete="off" spellcheck="false" required autofocus>
          <button id="toggle-password" class="secondary-button" type="button" aria-label="显示密码">显示</button>
        </div>
        <button id="unlock-button" class="primary-button" type="submit">解锁私人内容</button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite">等待输入解密密码。</p>
      <div class="privacy-note">
        <strong>公开仓库中不存在明文聊天记录或明文关系分析。</strong>
        <span>密码错误时，浏览器无法还原内容；关闭或锁定页面后需要重新输入。</span>
      </div>
    </section>
  </main>

  <section id="viewer" class="viewer" hidden>
    <header class="viewer-bar">
      <div>
        <strong>亲密关系成长中心</strong>
        <small>本地解密会话</small>
      </div>
      <button id="lock-button" class="lock-button" type="button">立即锁定</button>
    </header>
    <iframe id="app-frame" title="已解密的亲密关系成长中心" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>
  </section>

  <noscript>此页面需要启用 JavaScript 才能在浏览器本地解密内容。</noscript>
  <script src="./app.js" defer></script>
</body>
</html>
